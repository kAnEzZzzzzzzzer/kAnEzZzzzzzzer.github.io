<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Clone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    background: #000;
    padding: 25px 15px;
    border-right: 1px solid #222;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin: 10px;
    margin-bottom: 35px;
}

.nav-button {
    width: 100%;
    padding: 13px;
    margin-bottom: 5px;
    border: none;
    background: transparent;
    color: #aaa;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.nav-button:hover,
.nav-button.active {
    background: #1f1f1f;
    color: white;
}

/* MAIN */

main {
    min-width: 0;
    background: linear-gradient(#242424, #121212 350px);
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 12px;
    padding: 15px 25px;
    background: rgba(18,18,18,.95);
    backdrop-filter: blur(10px);
}

.search {
    flex: 1;
    max-width: 650px;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

.search-button,
.login-button {
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

.search-button {
    background: #1ed760;
    color: black;
}

.login-button {
    background: white;
    color: black;
}

.content {
    padding: 30px 25px 120px;
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

h2 {
    margin-top: 35px;
}

/* CARDS */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
}

.card {
    background: rgba(255,255,255,.07);
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    background: rgba(255,255,255,.15);
    transform: translateY(-2px);
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    background: #282828;
}

.card-title {
    margin-top: 10px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* TRACK LIST */

.track {
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 6px;
}

.track:hover {
    background: rgba(255,255,255,.1);
}

.track img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}

.play-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #1ed760;
    cursor: pointer;
    font-weight: bold;
}

/* STATUS */

.status {
    color: #aaa;
    margin-bottom: 20px;
}

.error {
    color: #ff8888;
    background: #351515;
    padding: 15px;
    border-radius: 8px;
}

/* PLAYER */

.player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 78px;
    background: #181818;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    z-index: 20;
}

.player img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 5px;
}

.player-info {
    min-width: 180px;
}

.player-title {
    font-weight: bold;
}

.player-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
}

.spotify-button {
    margin-left: auto;
    background: #1ed760;
    color: black;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* MOBILE */

@media(max-width:700px) {

    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .content {
        padding: 20px 15px 120px;
    }

    .topbar {
        padding: 12px;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ♫ Spotify Clone
        </div>

        <button class="nav-button active" onclick="home()">
            🏠 Home
        </button>

        <button class="nav-button" onclick="focusSearch()">
            🔎 Search
        </button>

        <button class="nav-button" onclick="loadPlaylists()">
            📚 My Playlists
        </button>

    </aside>


    <main>

        <div class="topbar">

            <input
                id="search"
                class="search"
                placeholder="What do you want to play?"
            >

            <button
                class="search-button"
                onclick="searchSpotify()"
            >
                Search
            </button>

            <button
                id="loginButton"
                class="login-button"
                onclick="login()"
            >
                Log in
            </button>

        </div>


        <div class="content">

            <h1 id="heading">
                Spotify Clone
            </h1>

            <div id="status" class="status">
                Log in with Spotify to search music.
            </div>

            <div id="results"></div>

        </div>

    </main>

</div>


<!-- PLAYER -->

<div class="player">

    <img id="playerImage" src="" alt="">

    <div class="player-info">

        <div
            id="playerTitle"
            class="player-title"
        >
            Nothing playing
        </div>

        <div
            id="playerArtist"
            class="player-artist"
        >
            Choose a song
        </div>

    </div>

    <button
        id="spotifyButton"
        class="spotify-button"
        style="display:none"
        onclick="openSpotify()"
    >
        Open in Spotify
    </button>

</div>


<script>

/* =========================================================
   SPOTIFY SETTINGS
   ========================================================= */

const CLIENT_ID =
    "b70e6ed30b444ef3859d594d418c2aa1";

const REDIRECT_URI =
    "http://127.0.0.1:8080";


const SCOPES =
    "user-read-private user-read-email playlist-read-private playlist-read-collaborative";


let accessToken =
    localStorage.getItem("spotify_access_token") || "";

let currentSpotifyURL = "";


/* =========================================================
   HELPERS
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}


function status(text, error = false) {

    $("status").textContent = text;

    $("status").className =
        error ? "error" : "status";
}


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function image(item) {

    return (
        item?.images?.[0]?.url ||
        item?.album?.images?.[0]?.url ||
        ""
    );
}


function spotifyURL(item) {

    return item?.external_urls?.spotify || "#";
}


/* =========================================================
   PKCE LOGIN
   ========================================================= */

function randomString(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return [...array]
        .map(byte =>
            characters[byte % characters.length]
        )
        .join("");
}


async function sha256Base64URL(value) {

    const data =
        new TextEncoder().encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(digest)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


async function login() {

    const verifier =
        randomString();

    const challenge =
        await sha256Base64URL(verifier);

    const state =
        randomString(32);


    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );


    const url =
        new URL(
            "https://accounts.spotify.com/authorize"
        );


    url.search =
        new URLSearchParams({

            response_type: "code",

            client_id: CLIENT_ID,

            scope: SCOPES,

            redirect_uri: REDIRECT_URI,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });


    window.location.href =
        url.toString();
}


/* =========================================================
   HANDLE SPOTIFY CALLBACK
   ========================================================= */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("code");

    const state =
        params.get("state");

    const error =
        params.get("error");


    if (error) {

        throw new Error(
            "Spotify login failed: " + error
        );

    }


    if (!code) {

        return false;

    }


    const savedState =
        localStorage.getItem(
            "spotify_state"
        );


    if (state !== savedState) {

        throw new Error(
            "Spotify security check failed."
        );

    }


    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );


    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    new URLSearchParams({

                        client_id:
                            CLIENT_ID,

                        grant_type:
                            "authorization_code",

                        code:
                            code,

                        redirect_uri:
                            REDIRECT_URI,

                        code_verifier:
                            verifier

                    })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Could not get Spotify access token."
        );

    }


    accessToken =
        data.access_token;


    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );


    if (data.refresh_token) {

        localStorage.setItem(
            "spotify_refresh_token",
            data.refresh_token
        );

    }


    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );


    return true;
}


/* =========================================================
   SPOTIFY API
   ========================================================= */

async function spotifyAPI(endpoint) {

    if (!accessToken) {

        throw new Error(
            "Please log in with Spotify first."
        );

    }


    const response =
        await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            {

                headers: {
                    Authorization:
                        "Bearer " + accessToken
                }

            }
        );


    const data =
        await response.json()
            .catch(() => ({}));


    if (!response.ok) {

        if (response.status === 401) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            accessToken = "";

        }


        throw new Error(
            data.error?.message ||
            "Spotify API error: " +
            response.status
        );

    }


    return data;
}


/* =========================================================
   SEARCH
   ========================================================= */

async function searchSpotify() {

    const query =
        $("search").value.trim();


    if (!query) {

        status(
            "Type something to search."
        );

        return;

    }


    if (!accessToken) {

        status(
            "Click Log in first."
        );

        return;

    }


    status(
        "Searching Spotify..."
    );


    $("heading").textContent =
        'Search: "' + query + '"';


    try {

        const data =
            await spotifyAPI(
                "/search?" +
                new URLSearchParams({

                    q: query,

                    type:
                        "track,artist,album,playlist",

                    limit: "10",

                    market: "US"

                })
            );


        renderSearch(data);

        status(
            "Spotify search results"
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   DISPLAY SEARCH RESULTS
   ========================================================= */

function renderSearch(data) {

    let output = "";


    const sections = [

        [
            "Songs",
            data.tracks?.items || [],
            "track"
        ],

        [
            "Artists",
            data.artists?.items || [],
            "artist"
        ],

        [
            "Albums",
            data.albums?.items || [],
            "album"
        ],

        [
            "Playlists",
            data.playlists?.items || [],
            "playlist"
        ]

    ];


    for (const [name, items, type] of sections) {

        if (!items.length) continue;


        output +=
            "<h2>" +
            name +
            "</h2>";


        output +=
            '<div class="grid">';


        for (const item of items) {

            const img =
                image(item);


            let subtitle = "";


            if (type === "track") {

                subtitle =
                    (item.artists || [])
                        .map(a => a.name)
                        .join(", ");

            }

            else if (type === "artist") {

                subtitle =
                    "Artist";

            }

            else if (type === "album") {

                subtitle =
                    (item.artists || [])
                        .map(a => a.name)
                        .join(", ");

            }

            else {

                subtitle =
                    item.owner?.display_name
                        ? "By " +
                          item.owner.display_name
                        : "Spotify playlist";

            }


            output += `

                <div
                    class="card"
                    onclick="openItem(
                        '${type}',
                        '${escapeHTML(item.id)}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }


                    <div class="card-title">
                        ${escapeHTML(item.name)}
                    </div>


                    <div class="card-subtitle">
                        ${escapeHTML(subtitle)}
                    </div>

                </div>

            `;

        }


        output +=
            "</div>";

    }


    if (!output) {

        output =
            "<div class='status'>" +
            "No results found." +
            "</div>";

    }


    $("results").innerHTML =
        output;
}


/* =========================================================
   OPEN SEARCH RESULT
   ========================================================= */

async function openItem(type, id) {

    try {

        if (type === "track") {

            const track =
                await spotifyAPI(
                    "/tracks/" +
                    encodeURIComponent(id)
                );

            selectTrack(track);

        }


        else if (type === "playlist") {

            await openPlaylist(id);

        }


        else if (type === "album") {

            const album =
                await spotifyAPI(
                    "/albums/" +
                    encodeURIComponent(id)
                );

            openAlbum(album);

        }


        else if (type === "artist") {

            const artist =
                await spotifyAPI(
                    "/artists/" +
                    encodeURIComponent(id)
                );

            openArtist(artist);

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   SELECT TRACK
   ========================================================= */

function selectTrack(track) {

    currentSpotifyURL =
        spotifyURL(track);


    $("playerImage").src =
        image(track);


    $("playerTitle").textContent =
        track.name;


    $("playerArtist").textContent =
        (track.artists || [])
            .map(a => a.name)
            .join(", ");


    $("spotifyButton").style.display =
        currentSpotifyURL !== "#"
            ? "block"
            : "none";
}


function openSpotify() {

    if (currentSpotifyURL) {

        window.open(
            currentSpotifyURL,
            "_blank"
        );

    }
}


/* =========================================================
   PLAYLISTS
   ========================================================= */

async function openPlaylist(id) {

    try {

        const playlist =
            await spotifyAPI(
                "/playlists/" +
                encodeURIComponent(id) +
                "?market=US"
            );


        $("heading").textContent =
            playlist.name;


        let output = "";


        const cover =
            image(playlist);


        if (cover) {

            output += `

                <img
                    src="${escapeHTML(cover)}"
                    style="
                        width:200px;
                        height:200px;
                        object-fit:cover;
                        border-radius:8px;
                    "
                >

            `;

        }


        output +=
            "<h2>" +
            escapeHTML(playlist.name) +
            "</h2>";


        output +=
            '<div>';


        const tracks =
            playlist.tracks?.items || [];


        for (const item of tracks) {

            if (!item.track) continue;


            output +=
                trackRow(item.track);

        }


        output +=
            "</div>";


        $("results").innerHTML =
            output;


        status(
            "Playlist loaded."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


function trackRow(track) {

    return `

        <div class="track">

            <img
                src="${escapeHTML(image(track))}"
                alt=""
            >


            <div>

                <div class="card-title">
                    ${escapeHTML(track.name)}
                </div>

                <div class="card-subtitle">
                    ${
                        escapeHTML(
                            (track.artists || [])
                                .map(a => a.name)
                                .join(", ")
                        )
                    }
                </div>

            </div>


            <button
                class="play-button"
                onclick='selectTrack(${JSON.stringify(track).replace(/'/g, "&#39;")})'
            >
                ▶
            </button>

        </div>

    `;
}


/* =========================================================
   ALBUM
   ========================================================= */

function openAlbum(album) {

    $("heading").textContent =
        album.name;


    let output =
        `<h2>${escapeHTML(album.name)}</h2>`;


    output +=
        `<div class="status">${
            escapeHTML(
                (album.artists || [])
                    .map(a => a.name)
                    .join(", ")
            )
        }</div>`;


    for (const track of album.tracks?.items || []) {

        track.album =
            album;


        output +=
            trackRow(track);

    }


    $("results").innerHTML =
        output;


    status(
        "Album loaded."
    );
}


/* =========================================================
   ARTIST
   ========================================================= */

function openArtist(artist) {

    $("heading").textContent =
        artist.name;


    $("results").innerHTML = `

        <div class="card" style="max-width:300px">

            ${
                image(artist)

                ?

                `<img
                    src="${escapeHTML(image(artist))}"
                    alt=""
                >`

                :

                ""
            }


            <div class="card-title">
                ${escapeHTML(artist.name)}
            </div>


            <div class="card-subtitle">
                Spotify Artist
            </div>

        </div>

    `;


    currentSpotifyURL =
        spotifyURL(artist);


    $("spotifyButton").style.display =
        currentSpotifyURL !== "#"
            ? "block"
            : "none";


    status(
        "Artist loaded."
    );
}


/* =========================================================
   MY PLAYLISTS
   ========================================================= */

async function loadPlaylists() {

    if (!accessToken) {

        status(
            "Click Log in first."
        );

        return;

    }


    $("heading").textContent =
        "My Playlists";


    status(
        "Loading your playlists..."
    );


    try {

        const data =
            await spotifyAPI(
                "/me/playlists?limit=50"
            );


        let output =
            '<div class="grid">';


        for (const playlist of data.items || []) {

            const img =
                image(playlist);


            output += `

                <div
                    class="card"
                    onclick="openPlaylist(
                        '${escapeHTML(playlist.id)}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }


                    <div class="card-title">
                        ${escapeHTML(playlist.name)}
                    </div>


                    <div class="card-subtitle">
                        ${
                            escapeHTML(
                                playlist.owner?.display_name || ""
                            )
                        }
                    </div>

                </div>

            `;

        }


        output +=
            "</div>";


        $("results").innerHTML =
            output;


        status(
            (data.items || []).length +
            " playlists loaded."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   HOME
   ========================================================= */

function home() {

    $("heading").textContent =
        "Spotify Clone";


    $("results").innerHTML =
        "";


    status(
        accessToken
            ? "Ready. Search Spotify above."
            : "Log in with Spotify to search music."
    );
}


function focusSearch() {

    $("search").focus();

}


/* =========================================================
   ENTER KEY
   ========================================================= */

$("search").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchSpotify();

        }

    }
);


/* =========================================================
   START
   ========================================================= */

(async function() {

    try {

        const callback =
            await handleCallback();


        if (accessToken) {

            $("loginButton").textContent =
                "Log out";


            $("loginButton").onclick =
                function() {

                    localStorage.removeItem(
                        "spotify_access_token"
                    );

                    accessToken = "";

                    location.reload();

                };


            status(
                callback
                    ? "Spotify connected!"
                    : "Ready. Search Spotify above."
            );

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }

})();

</script>

</body>
</html>
