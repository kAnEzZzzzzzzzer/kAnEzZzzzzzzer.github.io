            })
            .then(function(key) {
                return subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
            })
            .then(function(plain) {
                var html = new TextDecoder().decode(plain);
                document.open();
                document.write(html);
                document.close();
            })
            .catch(block);
    } catch (e) {
        block();
    }
})();
</script>
