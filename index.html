<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify by Kane</title>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>



<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
}

/* Sidebar */

.sidebar {
    background: #000;
    padding: 25px 15px;
    border-right: 1px solid #222;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin: 10px;
    margin-bottom: 35px;
}

.nav-button.logged-in-nav {
    display: none;
}

.nav-button.youtube-only-nav {
    display: none;
}

.nav-button {
    width: 100%;
    padding: 13px;
    margin-bottom: 5px;
    border: none;
    background: transparent;
    color: #aaa;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.nav-button:hover,
.nav-button.active {
    background: #1f1f1f;
    color: white;
}

.dj-nav {
    margin-top: 18px;
    color: white;
}

.dj-nav:hover {
    background: #1f1f1f;
    color: white;
}

/* Main page */

main {
    min-width: 0;
    background: linear-gradient(#242424, #121212 350px);
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 12px;
    padding: 15px 25px;
    background: rgba(18,18,18,.95);
    backdrop-filter: blur(10px);
}

.search {
    flex: 1;
    max-width: 650px;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

.search-button,
.login-button {
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

.search-button {
    background: #1ed760;
    color: black;
}

.login-button {
    background: white;
    color: black;
}

.content {
    padding: 30px 25px 130px;
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

h2 {
    margin-top: 35px;
}

/* Cards */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
}

.card {
    background: rgba(255,255,255,.07);
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    background: rgba(255,255,255,.15);
    transform: translateY(-2px);
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    background: #282828;
}

.card-title {
    margin-top: 10px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Track rows */

.track {
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 6px;
}

.track:hover {
    background: rgba(255,255,255,.1);
}

.track img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}

.play-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #1ed760;
    cursor: pointer;
    font-weight: bold;
}

.play-button:hover {
    transform: scale(1.05);
}

/* Status message */

.status {
    color: #aaa;
    margin-bottom: 20px;
}

.error {
    color: #ff8888;
    background: #351515;
    padding: 15px;
    border-radius: 8px;
}

/* Hero */

.hero {
    display: flex;
    gap: 20px;
    align-items: center;
    margin: 15px 0 25px;
}

.hero img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
}


.kiis-page {
    max-width: 700px;
}

.kiis-player-card {
    background: rgba(255,255,255,.06);
    border-radius: 15px;
    padding: 25px;
    margin-top: 20px;
}

.kiis-now {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: #aaa;
    margin-bottom: 15px;
}

.kiis-player-card .status {
    margin-top: 16px;
}

/* DJ X */

.dj-page {
    background: rgba(255,255,255,.07);
    border-radius: 15px;
    padding: 35px;
    margin-top: 20px;
}

.dj-title {
    font-size: 55px;
    font-weight: 800;
    margin: 0 0 10px;
}

.dj-description {
    color: #bbb;
    font-size: 17px;
    margin-bottom: 25px;
}

.dj-button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    background: #1ed760;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-right: 8px;
}

.dj-button:hover {
    background: #1fdf64;
}

.dj-skip {
    border: 1px solid #777;
    background: transparent;
    color: white;
}

.dj-skip:hover {
    background: rgba(255,255,255,.1);
}

.search-button.youtube-mode {
    background: #ff3b3b;
    color: white;
}

.search-button.google-mode {
    background: #4285F4;
    color: white;
}

.search-button.radio-mode {
    background: #a855f7;
    color: white;
}

/* Radio */

.nav-button.radio-only-nav {
    display: none;
}

.radio-now {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,.07);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
}

.radio-now .radio-art {
    width: 110px;
    flex-shrink: 0;
}

.radio-now .dj-button {
    background: #a855f7;
    color: white;
    margin: 10px 0 0;
}

.radio-now .dj-button:hover {
    background: #b76dfa;
}

.radio-now-title {
    font-size: 26px;
    font-weight: 800;
    margin: 4px 0;
}

.radio-art {
    position: relative;
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 22px;
    color: white;
    text-shadow: 0 2px 8px rgba(0,0,0,.35);
    text-align: center;
    padding: 6px;
}

.radio-live {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    background: rgba(0,0,0,.55);
    border-radius: 10px;
    padding: 3px 7px;
}

.card.playing {
    outline: 2px solid #a855f7;
    background: rgba(168,85,247,.18);
}

.card {
    position: relative;
}

.radio-add-button {
    display: none;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: #a855f7;
    color: white;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
}

.radio-add-button:hover {
    background: #b76dfa;
}

.radio-remove {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: white;
    font-size: 12px;
    cursor: pointer;
    z-index: 2;
}

.radio-remove:hover {
    background: #e11d48;
}

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.7);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.open {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 440px;
    background: #282828;
    border-radius: 14px;
    padding: 26px;
}

.modal h2 {
    margin: 0 0 18px;
}

.modal label {
    display: block;
    font-size: 13px;
    color: #bbb;
    margin: 12px 0 5px;
}

.modal input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #121212;
    color: white;
    font-size: 15px;
    outline: none;
}

.modal input:focus {
    border-color: #a855f7;
}

.modal-hint {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
}

.modal-error {
    color: #ff8888;
    font-size: 13px;
    min-height: 18px;
    margin-top: 12px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}

.modal-actions .dj-button {
    background: #a855f7;
    color: white;
    margin: 0;
}

.modal-actions .dj-skip {
    background: transparent;
    border: 1px solid #777;
}

/* Google results */

.google-result {
    padding: 14px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
}

.google-result:hover {
    background: rgba(255,255,255,.07);
}

.google-result-url {
    color: #8ab4f8;
    font-size: 13px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.google-result-title {
    font-size: 18px;
    color: #4285F4;
    margin-bottom: 4px;
}

.google-result-title:hover {
    text-decoration: underline;
}

.google-result-snippet {
    color: #ccc;
    font-size: 14px;
    line-height: 1.4;
}

/* Mode dropdown (replaces old mode-toggle-button) */

.mode-dropdown {
    position: relative;
}

.mode-dropdown-button {
    background: white;
    color: black;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
}

.mode-dropdown-button:hover {
    background: #eee;
}

.mode-dropdown-caret {
    font-size: 10px;
    line-height: 1;
}

.mode-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #282828;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    padding: 6px;
    min-width: 170px;
    z-index: 30;
}

.mode-dropdown-menu.open {
    display: block;
}

.mode-dropdown-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.mode-dropdown-item:hover {
    background: #3a3a3a;
}

.mode-dropdown-check {
    color: #1ed760;
    font-weight: bold;
    visibility: hidden;
}

.mode-dropdown-item.active .mode-dropdown-check {
    visibility: visible;
}

/* Shorts Feed */

.shorts-feed {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-height: 75vh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    padding: 10px 0 20px;
}

.shorts-item {
    position: relative;
    scroll-snap-align: center;
    flex-shrink: 0;
    width: 260px;
    aspect-ratio: 9/16;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
}

.shorts-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.shorts-item iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.shorts-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    color: white;
    font-size: 13px;
    pointer-events: none;
}

.shorts-caption .card-subtitle {
    margin-top: 2px;
}

/* Currently Playing Bar */

.player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 82px;
    background: #181818;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    z-index: 20;
}

.player img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 5px;
}

.player-info {
    min-width: 180px;
    max-width: 250px;
}

.player-title {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

.control-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-button:hover {
    background: #333;
}

.play-control {
    background: white;
    color: black;
}

.play-control:hover {
    background: #ddd;
}

.spotify-button {
    background: #1ed760;
    color: black;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* Mobile */

@media(max-width:700px) {

    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .content {
        padding: 20px 15px 130px;
    }

    .topbar {
        padding: 12px;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
    }

    .hero img {
        width: 140px;
        height: 140px;
    }

    .dj-page {
        padding: 25px;
    }

    .dj-title {
        font-size: 40px;
    }

    .player-info {
        min-width: 100px;
    }

    .spotify-button {
        display: none;
    }

}
</style>

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div id="sidebarLogo" class="logo">
               Spotify Clone
        </div>

        <button class="nav-button active" onclick="home()">
              Home
        </button>

        <button class="nav-button logged-in-nav spotify-only-nav" onclick="focusSearch()">
              Search
        </button>

        <button class="nav-button logged-in-nav spotify-only-nav" onclick="loadPlaylists()">
              My Playlists
        </button>

        <button class="nav-button logged-in-nav dj-nav spotify-only-nav" onclick="openDJX()">
              DJ X
        </button>

        <button id="longFormTabButton" class="nav-button youtube-only-nav youtube-tab-nav active" onclick="setYoutubeTab('long')">
              Long Form
        </button>

        <button id="shortsTabButton" class="nav-button youtube-only-nav youtube-tab-nav" onclick="setYoutubeTab('short')">
              Shorts
        </button>

        <button id="webTabButton" class="nav-button google-only-nav google-tab-nav active" onclick="setGoogleTab('web')">
              Web
        </button>

        <button id="imagesTabButton" class="nav-button google-only-nav google-tab-nav" onclick="setGoogleTab('image')">
              Images
        </button>

        <button id="safeSearchButton" class="nav-button google-only-nav" onclick="toggleSafeSearch()">
              SafeSearch: On
        </button>

    </aside>

    <main>

        <div class="topbar">

            <input
                id="search"
                class="search"
                placeholder="What do you want to play?"
                autocomplete="off"
            >

            <button
                id="searchButton"
                class="search-button"
                onclick="handleSearchButton()"
            >
                Search
            </button>

            <button
                id="radioAddButton"
                class="radio-add-button"
                onclick="openAddStation()"
                title="Add a radio station"
            >+</button>

            <button
                id="loginButton"
                class="login-button"
                onclick="login()"
            >
                Log in
            </button>

            <div id="modeDropdown" class="mode-dropdown">

                <button
                    id="modeDropdownButton"
                    class="mode-dropdown-button"
                    onclick="toggleModeDropdown()"
                    title="Switch mode"
                >
                    <span id="modeDropdownLabel">Spotify</span>
                    <span class="mode-dropdown-caret">▼</span>
                </button>

                <div id="modeDropdownMenu" class="mode-dropdown-menu">

                    <button
                        id="modeOptionSpotify"
                        class="mode-dropdown-item active"
                        onclick="selectMode('spotify')"
                    >
                        <span>Spotify</span>
                        <span class="mode-dropdown-check">✓</span>
                    </button>

                    <button
                        id="modeOptionYoutube"
                        class="mode-dropdown-item"
                        onclick="selectMode('youtube')"
                    >
                        <span>YouTube</span>
                        <span class="mode-dropdown-check">✓</span>
                    </button>

                    <button
                        id="modeOptionGoogle"
                        class="mode-dropdown-item"
                        onclick="selectMode('google')"
                    >
                        <span>Google</span>
                        <span class="mode-dropdown-check">✓</span>
                    </button>

                    <button
                        id="modeOptionRadio"
                        class="mode-dropdown-item"
                        onclick="selectMode('radio')"
                    >
                        <span>Radio</span>
                        <span class="mode-dropdown-check">✓</span>
                    </button>

                </div>

            </div>

        </div>

        <div class="content">

            <h1 id="heading">
                Spotify Clone
            </h1>

            <div id="status" class="status">
                Log in with Spotify to search music.
            </div>

            <div id="results"></div>

        </div>

    </main>

</div>


<div id="addModal" class="modal-overlay" onclick="if(event.target===this)closeAddStation()">
    <div class="modal">
        <h2>Add a radio station</h2>

        <label for="addName">Station name</label>
        <input id="addName" placeholder="e.g. My Favorite FM" autocomplete="off">

        <label for="addUrl">Stream URL</label>
        <input id="addUrl" placeholder="https://example.com/stream.mp3" autocomplete="off">
        <div class="modal-hint">Use a direct stream link (.mp3, .aac or .m3u8). Playlist files like .pls or .m3u won't work.</div>

        <label for="addCity">City (optional)</label>
        <input id="addCity" placeholder="e.g. Chicago" autocomplete="off">

        <label for="addGenre">Genre (optional)</label>
        <input id="addGenre" placeholder="e.g. Jazz" autocomplete="off">

        <div id="addError" class="modal-error"></div>

        <div class="modal-actions">
            <button class="dj-button dj-skip" onclick="closeAddStation()">Cancel</button>
            <button class="dj-button" onclick="saveNewStation()">Save station</button>
        </div>
    </div>
</div>

<audio id="radioAudio" preload="none"></audio>

<!-- Currently Playing Bar -->

<div class="player">

    <img id="playerImage" src="" alt="">

    <div class="player-info">

        <div
            id="playerTitle"
            class="player-title"
        >
            Nothing playing
        </div>

        <div
            id="playerArtist"
            class="player-artist"
        >
            Choose a song
        </div>

    </div>

    <div class="player-controls">

        <button
            class="control-button"
            onclick="previousTrack()"
            title="Previous"
        >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button
            id="playButton"
            class="control-button play-control"
            onclick="togglePlayback()"
            title="Play/Pause"
        >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button
            class="control-button"
            onclick="nextTrack()"
            title="Next"
        >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

    </div>

    <button
        id="spotifyButton"
        class="spotify-button"
        style="display:none"
        onclick="openSpotify()"
    >
        Open in Spotify
    </button>

</div>

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* PKCE */

function randomString(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return [...array]
        .map(byte =>
            characters[byte % characters.length]
        )
        .join("");
}


async function sha256Base64URL(value) {

    const data =
        new TextEncoder().encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(digest)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* Log in */

async function login() {

    const verifier =
        randomString();

    const challenge =
        await sha256Base64URL(verifier);

    const state =
        randomString(32);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );

    const url =
        new URL(
            "https://accounts.spotify.com/authorize"
        );

    url.search =
        new URLSearchParams({

            response_type: "code",

            client_id: CLIENT_ID,

            scope: SCOPES,

            redirect_uri: REDIRECT_URI,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });

    // Spotify's login page refuses to load inside an iframe, so this has
    // to navigate the whole tab (window.top), not just this iframe.
    window.top.location.href =
        url.toString();
}


/* Login callback */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const state =
        params.get("state");

    const error =
        params.get("error");

    if (error) {

        throw new Error(
            "Spotify login failed: " + error
        );
    }

    if (!code) {
        return false;
    }

    if (
        state !==
        localStorage.getItem("spotify_state")
    ) {

        throw new Error(
            "Spotify security check failed."
        );
    }

    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    new URLSearchParams({

                        client_id:
                            CLIENT_ID,

                        grant_type:
                            "authorization_code",

                        code:
                            code,

                        redirect_uri:
                            REDIRECT_URI,

                        code_verifier:
                            verifier

                    })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Could not get Spotify access token."
        );
    }

    accessToken =
        data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );

    if (data.refresh_token) {

        refreshToken =
            data.refresh_token;

        localStorage.setItem(
            "spotify_refresh_token",
            refreshToken
        );
    }

    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );

    return true;
}


/* Spotify API */

async function spotifyAPI(
    endpoint,
    options = {}
) {

    if (!accessToken) {

        throw new Error(
            "Please log in with Spotify first."
        );
    }

    const headers = {

        Authorization:
            "Bearer " + accessToken

    };

    if (options.body) {

        headers["Content-Type"] =
            "application/json";
    }

    const response =
        await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            {
                ...options,

                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

    const data =
        await response
            .json()
            .catch(() => ({}));

    if (!response.ok) {

        if (response.status === 401) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            accessToken = "";

        }

        throw new Error(
            data.error?.message ||
            "Spotify API error: " +
            response.status
        );
    }

    return data;
}


/* Web playback SDK */

window.onSpotifyWebPlaybackSDKReady =
    function() {

        if (!accessToken) {
            return;
        }

        player =
            new Spotify.Player({

                name:
                    "Spotify Clone",

                getOAuthToken:
                    callback => {

                        callback(
                            accessToken
                        );

                    },

                volume:
                    0.5

            });

        player.addListener(
            "ready",
            function({ device_id }) {

                deviceId =
                    device_id;

                playerReady =
                    true;

                console.log(
                    "Spotify player ready:",
                    deviceId
                );

                status(
                    "Spotify player connected."
                );

            }
        );

        player.addListener(
            "not_ready",
            function({ device_id }) {

                console.log(
                    "Device went offline:",
                    device_id
                );

                playerReady =
                    false;
            }
        );

        player.addListener(
            "player_state_changed",
            function(state) {

                if (!state) {
                    return;
                }

                const track =
                    state.track_window
                        ?.current_track;

                if (!track) {
                    return;
                }

                const artists =
                    (track.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ") ||
                    "Unknown artist";

                $("playerTitle").textContent =
                    track.name || "Unknown track";

                $("playerArtist").textContent =
                    artists;

                if (
                    track.album?.images?.[0]?.url
                ) {

                    $("playerImage").src =
                        track.album.images[0].url;

                }

                currentSpotifyURL =
                    track.external_urls?.spotify ||
                    "";

                $("spotifyButton").style.display =
                    currentSpotifyURL
                        ? "block"
                        : "none";

                $("playButton").innerHTML =
                    state.paused
                        ? PLAY_ICON_SVG
                        : PAUSE_ICON_SVG;

                status(
                    (state.paused ? "Paused: " : "Now playing: ") +
                    (track.name || "Unknown track") +
                    " — " +
                    artists
                );

            }
        );

        player.addListener(
            "initialization_error",
            function({ message }) {

                status(
                    "Player initialization error: " +
                    message,
                    true
                );

            }
        );

        player.addListener(
            "authentication_error",
            function({ message }) {

                status(
                    "Spotify authentication error: " +
                    message,
                    true
                );

            }
        );

        player.addListener(
            "account_error",
            function({ message }) {

                status(
                    "Spotify account error: " +
                    message,
                    true
                );

            }
        );

        player.connect();

    };


/* Play track */

async function playTrack(track) {

    if (!track) {
        return;
    }

    if (!deviceId) {

        alert(
            "Spotify player is not ready yet. " +
            "Please wait a moment after logging in."
        );

        return;
    }

    try {

        djMode = false;

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",

                body: JSON.stringify({

                    uris: [
                        track.uri
                    ]

                })

            }
        );

        const artists =
            (track.artists || [])
                .filter(Boolean)
                .map(a => a?.name)
                .filter(Boolean)
                .join(", ") ||
            "Unknown artist";

        $("playerImage").src =
            image(track);

        $("playerTitle").textContent =
            track.name || "Unknown track";

        $("playerArtist").textContent =
            artists;

        currentSpotifyURL =
            spotifyURL(track);

        $("spotifyButton").style.display =
            currentSpotifyURL !== "#"
                ? "block"
                : "none";

        status(
            "Now playing: " +
            (track.name || "Unknown track") +
            " — " +
            artists
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}

/* Custom stations (saved in localStorage) */

const CUSTOM_KEY = "radio_custom_stations";

let customStations = [];

try {
    customStations = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]")
        .filter(s => s && s.id && s.url && s.colors);
} catch (e) {
    customStations = [];
}

function saveCustomStations() {
    try {
        localStorage.setItem(CUSTOM_KEY, JSON.stringify(customStations));
    } catch (e) {}
}

function allStations() {
    return [...customStations, ...RADIO_STATIONS];

        ? `<button class="radio-remove" title="Remove station" onclick="event.stopPropagation(); removeStation('${escapeHTML(s.id)}')">✕</button>`
        : "";

function openAddStation() {
    ["addName", "addUrl", "addCity", "addGenre"].forEach(id => { $(id).value = ""; });
    $("addError").textContent = "";
    $("addModal").classList.add("open");
    $("addName").focus();
}

function closeAddStation() {
    $("addModal").classList.remove("open");
}

function saveNewStation() {
    const name = $("addName").value.trim();
    const url = $("addUrl").value.trim();
    const fail = msg => { $("addError").textContent = msg; };

    if (!name) return fail("Give the station a name.");

    let valid = false;
    try {
        const u = new URL(url);
        valid = u.protocol === "https:" || (u.protocol === "http:" && location.protocol !== "https:");
    } catch (e) {}
    if (!valid) return fail("Enter a valid stream URL starting with https://");

    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const hue = h % 360;

    customStations.unshift({
        id: "custom_" + Date.now(),
        custom: true,
        name: name,
        tag: name.split(/\s+/).slice(0, 2).join(" ").slice(0, 14),
        city: $("addCity").value.trim() || "My stations",
        genre: $("addGenre").value.trim() || "Custom",
        colors: ["hsl(" + hue + ",65%,45%)", "hsl(" + ((hue + 40) % 360) + ",65%,24%)"],
        url: url
    });
    saveCustomStations();
    closeAddStation();

    $("search").value = "";
    radioQuery = "";
    renderRadioPage();
    status('Added "' + name + '".');
}

function removeStation(id) {
    const s = customStations.find(x => x.id === id);
    if (!s || !confirm('Remove "' + s.name + '"?')) return;
    if (currentStationId === id) stopRadio();
    customStations = customStations.filter(x => x.id !== id);
    saveCustomStations();
    syncRadio();
}

function getStation(id) {
    return RADIO_STATIONS.find(x => x.id === id)
        || customStations.find(x => x.id === id)
        || radioExtra[id];

async function rbFetch(path) {
    for (const base of RB_SERVERS) {
        try {
            const r = await fetch(base + path);
            if (r.ok) return await r.json();
        } catch (e) {}
    }
    return [];
}

function rbParams(o) {
    return new URLSearchParams({ ...o, hidebroken: "true", order: "clickcount", reverse: "true" });
}

async function rbLookup(term) {
    const rows = await rbFetch("/json/stations/search?" + rbParams({ name: term, limit: "15" }));
    return rows.map(r => r.url_resolved || "").filter(u => u.startsWith("https://"));
}

function rbToStation(r) {
    const url = r.url_resolved || "";
    if (!url.startsWith("https://") || !r.stationuuid) return null;
    let h = 0;
    for (const c of r.stationuuid) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const hue = h % 360;
    const name = (r.name || "Unknown station").trim();
    return {
        id: "rb_" + r.stationuuid,
        name: name,
        tag: name.split(/\s+/).slice(0, 2).join(" ").slice(0, 14),
        city: r.state || r.country || "Online",
        genre: (r.tags || "").split(",").filter(Boolean).slice(0, 2).join(", ") || "Radio",
        colors: ["hsl(" + hue + ",65%,45%)", "hsl(" + ((hue + 40) % 360) + ",65%,24%)"],
        url: url
    };
}

async function searchRadioOnline(q, token) {
    const [a, b] = await Promise.all([
        rbFetch("/json/stations/search?" + rbParams({ name: q, limit: "24" })),
        rbFetch("/json/stations/search?" + rbParams({ tag: q, limit: "24" }))
    ]);
    if (token !== radioSearchToken) return;
    const seen = new Set();
    const list = [];
    for (const r of [...a, ...b]) {
        if (seen.has(r.stationuuid)) continue;
        seen.add(r.stationuuid);
        const s = rbToStation(r);
        if (s) { radioExtra[s.id] = s; list.push(s); }
    }
    radioOnline = list.slice(0, 24);
    radioOnlineMsg = list.length ? "" : "No online stations found (or the station directory couldn't be reached).";
    renderRadioOnline();
}

            </div></div>`;

    renderRadioGrid();
    renderRadioOnline();

function radioMatches() {
    const terms = radioQuery.toLowerCase().split(/\s+/).filter(Boolean);
    return allStations().filter(s => {
        const hay = (s.name + " " + s.tag + " " + s.city + " " + s.genre).toLowerCase();
        return terms.every(t => hay.includes(t));
    });
}

function renderRadioGrid() {
    const grid = $("radioGrid");
    if (!grid) return;
    const list = radioMatches();
    grid.innerHTML = list.length
        ? list.map(stationCard).join("")
        : (radioQuery ? "" : "<div class='status'>No stations.</div>");
}

function renderRadioOnline() {
    const box = $("radioOnline");
    if (!box) return;
    if (!radioQuery) { box.innerHTML = ""; return; }
    box.innerHTML = "<h2>More stations online</h2>" + (radioOnline.length
        ? '<div class="grid">' + radioOnline.map(stationCard).join("") + "</div>"
        : '<div class="status">' + escapeHTML(radioOnlineMsg) + "</div>");
}

function filterRadio(query) {
    radioQuery = (query || "").trim();
    if (currentMode !== "radio" || !$("radioGrid")) return;
    renderRadioGrid();

    clearTimeout(radioSearchTimer);
    const token = ++radioSearchToken;
    radioOnline = [];

    if (radioQuery.length < 2) {
        radioOnlineMsg = "";
        renderRadioOnline();
        status("Search by name, city or genre. Online results cover stations worldwide.");
        return;
    }

    radioOnlineMsg = "Searching online stations…";
    renderRadioOnline();
    status('Results for "' + radioQuery + '"');
    radioSearchTimer = setTimeout(() => searchRadioOnline(radioQuery, token), 400);
}

function loadSource(s) {
    const audio = $("radioAudio");
    const a = radioAttempt;
    const i = a.i;
    const url = a.urls[i];

    if (radioHls) { radioHls.destroy(); radioHls = null; }

    if (url.includes(".m3u8") && !audio.canPlayType("application/vnd.apple.mpegurl") && window.Hls && Hls.isSupported()) {
        const h = new Hls({ enableWorker: true });
        radioHls = h;
        h.loadSource(url);
        h.attachMedia(audio);
        h.on(Hls.Events.ERROR, function(_, data) {
            if (radioHls === h && data && data.fatal) radioFailed();
        });
    } else {
        audio.src = url;
    }

    audio.play().catch(() => {});

    clearTimeout(radioTimer);
    radioTimer = setTimeout(() => {
        if (radioState === "loading" && radioAttempt === a && a.i === i) radioFailed();
    }, 12000);
}

async function radioFailed() {
    const s = getStation(currentStationId);
    const a = radioAttempt;
    if (!s || !a || a.looking) return;

    if (a.i + 1 < a.urls.length) {
        a.i++;
        loadSource(s);
        return;
    }

    if (!a.lookedUp && !s.custom) {
        a.lookedUp = true;
        a.looking = true;
        const urls = await rbLookup(RADIO_LOOKUP[s.id] || s.name);
        a.looking = false;
        if (radioAttempt !== a) return;
        const fresh = urls.filter(u => !a.urls.includes(u)).slice(0, 4);
        if (fresh.length) {
            a.urls.push(...fresh);
            a.i++;
            loadSource(s);
            return;
        }
    }

    clearTimeout(radioTimer);
    radioState = "error";
    syncRadio();
}

function playStation(id) {
    const s = getStation(id);
    const audio = $("radioAudio");
    if (!s || !audio) return;

    if (currentStationId === id && (radioState === "playing" || radioState === "loading")) {
        clearTimeout(radioTimer);
        radioState = "paused";
        audio.pause();
        syncRadio();
        return;
    }

    if (currentStationId !== id || !radioAttempt) {
        radioAttempt = { urls: [s.url, ...(RADIO_ALT[s.id] || [])], i: 0, lookedUp: false, looking: false };
    }

    currentStationId = id;
    radioState = "loading";
    syncRadio();
    loadSource(s);
}

function stopRadio() {
    const audio = $("radioAudio");
    clearTimeout(radioTimer);
    if (radioHls) { radioHls.destroy(); radioHls = null; }
    currentStationId = null;
    radioAttempt = null;
    radioState = "idle";
    if (audio) { audio.pause(); audio.removeAttribute("src"); audio.load(); }
}

(function() {
    const audio = $("radioAudio");
    audio.addEventListener("playing", () => {
        if (!currentStationId) return;
        clearTimeout(radioTimer);
        radioState = "playing";
        syncRadio();
    });
    audio.addEventListener("waiting", () => {
        if (currentStationId && radioState === "playing") { radioState = "loading"; syncRadio(); }
    });
    audio.addEventListener("pause", () => {
        if (currentStationId && radioState === "playing") { radioState = "paused"; syncRadio(); }
    });
    audio.addEventListener("error", () => {
        if (currentStationId && radioState !== "paused") radioFailed();
    });
})();

/* Search results */
   

function renderSearch(data) {

    let output = "";

    const sections = [

        [
            "Songs",
            data?.tracks?.items || [],
            "track"
        ],

        [
            "Artists",
            data?.artists?.items || [],
            "artist"
        ],

        [
            "Albums",
            data?.albums?.items || [],
            "album"
        ],

        [
            "Playlists",
            data?.playlists?.items || [],
            "playlist"
        ]

    ];

    for (
        const [name, rawItems, type]
        of sections
    ) {

        const items =
            Array.isArray(rawItems)
                ? rawItems.filter(item => item != null)
                : [];

        if (!items.length) {
            continue;
        }

        output +=
            "<h2>" +
            escapeHTML(name) +
            "</h2>";

        output +=
            '<div class="grid">';

        for (
            const item
            of items
        ) {

            if (!item) {
                continue;
            }

            const itemID =
                item.id || "";

            const itemName =
                item.name || "Unknown";

            const img =
                image(item);

            let subtitle =
                "";

            if (type === "track") {

                subtitle =
                    (item.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ");

            }

            else if (type === "artist") {

                subtitle =
                    "Artist";

            }

            else if (type === "album") {

                subtitle =
                    (item.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ");

            }

            else if (type === "playlist") {

                const ownerName =
                    item?.owner?.display_name ||
                    item?.owner?.name ||
                    "";

                subtitle =
                    ownerName
                        ? "By " + ownerName
                        : "Spotify playlist";
            }

            output += `

                <div
                    class="card"
                    onclick="openItem(
                        '${escapeHTML(type)}',
                        '${escapeHTML(itemID)}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }

                    <div class="card-title">
                        ${escapeHTML(itemName)}
                    </div>

                    <div class="card-subtitle">
                        ${escapeHTML(subtitle)}
                    </div>

                </div>

            `;

        }

        output +=
            "</div>";

    }

    if (!output) {

        output =
            "<div class='status'>" +
            "No results found." +
            "</div>";

    }

    $("results").innerHTML =
        output;
}


/* Open result */

async function openItem(type, id) {

    if (!id) {
        return;
    }

    try {

        if (type === "track") {

            const track =
                await spotifyAPI(
                    "/tracks/" +
                    encodeURIComponent(id)
                );

            await playTrack(track);

        }

        else if (type === "playlist") {

            await openPlaylist(id);

        }

        else if (type === "album") {

            const album =
                await spotifyAPI(
                    "/albums/" +
                    encodeURIComponent(id)
                );

            openAlbum(album);

        }

        else if (type === "artist") {

            const artist =
                await spotifyAPI(
                    "/artists/" +
                    encodeURIComponent(id)
                );

            openArtist(artist);

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}

/* YouTube */

function extractYouTubeID(raw) {

    if (!raw) {
        return "";
    }

    const value = raw.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
        return value;
    }

    try {

        const url = new URL(value);

        if (url.hostname.includes("youtu.be")) {
            return url.pathname.replace("/", "").slice(0, 11);
        }

        if (url.hostname.includes("youtube.com")) {

            if (url.pathname.startsWith("/watch")) {
                return url.searchParams.get("v") || "";
            }

            if (url.pathname.startsWith("/embed/")) {
                return url.pathname.split("/embed/")[1]?.slice(0, 11) || "";
            }

            if (url.pathname.startsWith("/shorts/")) {
                return url.pathname.split("/shorts/")[1]?.slice(0, 11) || "";
            }

        }

    }
    catch (e) {
    }

    return "";
}

        "Type something and press Search."
    );

}

function googleEmptyStateHTML() {

            : "Search Google, right from here.";

    return `
        <div class="dj-page" style="text-align:center;">

                ${escapeHTML(message)}

}


async function searchGoogle(query) {

    if (
        !TAVILY_API_KEY ||
        TAVILY_API_KEY === "YOUR_TAVILY_API_KEY_HERE"
    ) {

        status(
            "Search isn't set up yet. Add your TAVILY_API_KEY in the code.",
            true
        );

        return;
    }

    status(
        "Searching..."
    );

    $("heading").textContent =
        'Google search' +
        (currentGoogleTab === "image" ? " (Images)" : "") +
        ': "' + query + '"';

    try {

        const body = {

            query:
                query,

            search_depth:
                "basic",

            max_results:
                10,

            include_images:
                currentGoogleTab === "image"

        };

        const response =
            await fetch(
                "https://api.tavily.com/search",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + TAVILY_API_KEY
                    },
                    body: JSON.stringify(body)
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.detail ||
                "Tavily API error: " +
                response.status
            );
        }

        if (currentGoogleTab === "image") {

            const images =
                (data.images || [])
                    .filter(Boolean);

            renderGoogleResults(images);

            status(
                images.length
                    ? "Image results"
                    : "No results found."
            );

        } else {

            const items =
                (data.results || [])
                    .filter(Boolean);

            renderGoogleResults(items);

            status(
                items.length
                    ? "Search results"
                    : "No results found."
            );

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


function renderGoogleResults(items) {

    if (currentGoogleTab === "image") {

        renderGoogleImageResults(items);

        return;
    }

    if (!items.length) {

        $("results").innerHTML =
            "<div class='status'>No results found.</div>";

        return;
    }

    let output =
        '<div>';

    for (
        const item
        of items
    ) {

        const link =
            item.url || "#";

        const title =
            item.title || "Untitled";

        const snippet =
            item.content || "";

        let displayLink =
            link;

        try {
            displayLink =
                new URL(link).hostname;
        } catch (e) {
        }

        output += `

            <div
                class="google-result"
                onclick="window.open('${escapeHTML(link)}', '_blank')"
            >

                <div class="google-result-url">
                    ${escapeHTML(displayLink)}
                </div>

                <div class="google-result-title">
                    ${escapeHTML(title)}
                </div>

                <div class="google-result-snippet">
                    ${escapeHTML(snippet)}
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


function renderGoogleImageResults(items) {

    if (!items.length) {

        $("results").innerHTML =
            "<div class='status'>No results found.</div>";

        return;
    }

    let output =
        '<div class="grid">';

    for (
        const item
        of items
    ) {

        // Tavily returns either plain URL strings or {url, description}
        // objects depending on settings, so handle both.
        const isPlainString =
            typeof item === "string";

        const imgURL =
            isPlainString
                ? item
                : (item.url || "");

        const pageURL =
            imgURL || "#";

        const title =
            (!isPlainString && item.description) || "Image";

        output += `

            <div
                class="card"
                onclick="window.open('${escapeHTML(pageURL)}', '_blank')"
            >

                ${
                    imgURL

                    ?

                    `<img
                        src="${escapeHTML(imgURL)}"
                        alt=""
                    >`

                    :

                    `<div
                        style="
                            aspect-ratio:1;
                            background:#282828;
                            border-radius:6px;
                        "
                    ></div>`
                }

                <div class="card-title">
                    ${escapeHTML(title)}
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}

/* Search button */
function handleSearchButton() {

    if (currentMode === "radio") {

        filterRadio($("search").value);

        return;
    }

    if (currentMode === "google") {

        const raw =
            $("search")?.value.trim() || "";

        if (!raw) {

            status(
                "Type something to search."
            );

            return;
        }

        searchGoogle(raw);

        return;
    }

    if (currentMode === "youtube") {

        const raw =
            $("search")?.value.trim() || "";

        if (!raw) {

            status(
                "Type something to search, or paste a YouTube link."
            );

            return;
        }

        const id =
            extractYouTubeID(raw);

        if (id) {
            playYouTubeVideo(id);
        }
        else {
            searchYouTube(raw);
        }

        return;
    }

    searchSpotify();
}


/* Turns an ISO 8601 duration (e.g. "PT1M30S") into whole seconds. */
function parseISO8601DurationToSeconds(duration) {

    const match =
        /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(
            duration || ""
        );

    if (!match) {
        return 0;
    }

    const hours =
        parseInt(match[1] || "0", 10);

    const minutes =
        parseInt(match[2] || "0", 10);

    const seconds =
        parseInt(match[3] || "0", 10);

    return (hours * 3600) + (minutes * 60) + seconds;
}


async function searchYouTube(query) {

    const tab =
        currentYoutubeTab;

    status(
        "Searching YouTube..."
    );

    $("heading").textContent =
        'YouTube search' +
        (tab === "short" ? " (Shorts)" : "") +
        ': "' + query + '"';

    try {

        const searchResponse =
            await fetch(
                "https://www.googleapis.com/youtube/v3/search?" +
                new URLSearchParams({

                    part:
                        "snippet",

                    q:
                        query,

                    type:
                        "video",

                    maxResults:
                        "25",

                    key:
                        YOUTUBE_API_KEY

                })
            );

        const searchData =
            await searchResponse.json();

        if (!searchResponse.ok) {

            throw new Error(
                searchData.error?.message ||
                "YouTube API error: " +
                searchResponse.status
            );
        }

        const items =
            (searchData.items || [])
                .filter(item => item?.id?.videoId);

        if (!items.length) {

            $("results").innerHTML =
                "<div class='status'>No results found.</div>";

            status(
                "No results found."
            );

            return;
        }

        const ids =
            items.map(item => item.id.videoId);

        const detailsResponse =
            await fetch(
                "https://www.googleapis.com/youtube/v3/videos?" +
                new URLSearchParams({

                    part:
                        "contentDetails,snippet",

                    id:
                        ids.join(","),

                    key:
                        YOUTUBE_API_KEY

                })
            );

        const detailsData =
            await detailsResponse.json();

        if (!detailsResponse.ok) {

            throw new Error(
                detailsData.error?.message ||
                "YouTube API error: " +
                detailsResponse.status
            );
        }

        const videos =
            (detailsData.items || [])
                .map(item => ({

                    id:
                        item.id,

                    title:
                        item.snippet?.title ||
                        "Untitled video",

                    channel:
                        item.snippet?.channelTitle ||
                        "",

                    thumb:
                        item.snippet?.thumbnails?.medium?.url ||
                        item.snippet?.thumbnails?.default?.url ||
                        "",

                    seconds:
                        parseISO8601DurationToSeconds(
                            item.contentDetails?.duration
                        )

                }));

        const filtered =
            videos.filter(video =>
                tab === "short"
                    ? video.seconds > 0 && video.seconds <= 60
                    : video.seconds > 60
            );

        if (!filtered.length) {

            $("results").innerHTML =
                "<div class='status'>No " +
                (tab === "short" ? "Shorts" : "long-form videos") +
                " found for that search. Try the other tab or a different search term.</div>";

            status(
                "No results found in this tab."
            );

            return;
        }

        if (tab === "short") {
            renderYouTubeShorts(filtered);
        }
        else {
            renderYouTubeSearch(filtered);
        }

        status(
            "YouTube search results"
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


function renderYouTubeSearch(videos) {

    let output =
        '<div class="grid">';

    for (
        const video
        of videos
    ) {

        output += `

            <div
                class="card"
                onclick="playYouTubeVideo('${escapeHTML(video.id)}')"
            >

                ${
                    video.thumb

                    ?

                    `<img
                        src="${escapeHTML(video.thumb)}"
                        alt=""
                    >`

                    :

                    `<div
                        style="
                            aspect-ratio:1;
                            background:#282828;
                            border-radius:6px;
                        "
                    ></div>`
                }

                <div class="card-title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="card-subtitle">
                    ${escapeHTML(video.channel)}
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


function renderYouTubeShorts(videos) {

    let output =
        '<div class="shorts-feed">';

    for (
        const video
        of videos
    ) {

        output += `

            <div
                class="shorts-item"
                onclick="playYouTubeVideo('${escapeHTML(video.id)}')"
            >

                ${
                    video.thumb

                    ?

                    `<img
                        src="${escapeHTML(video.thumb)}"
                        alt=""
                    >`

                    :

                    ""
                }

                <div class="shorts-caption">
                    <div class="card-title">
                        ${escapeHTML(video.title)}
                    </div>
                    <div class="card-subtitle">
                        ${escapeHTML(video.channel)}
                    </div>
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


function playYouTubeVideo(id) {

    if (!id) {

        status(
            "Could not read a video from that link or ID. Try again.",
            true
        );

        return;
    }

    const isShort =
        currentYoutubeTab === "short";

    $("heading").textContent =
        "YouTube Clone";

    $("results").innerHTML = `

        <div
            style="
                position:relative;
                width:100%;
                max-width:${isShort ? "360px" : "900px"};
                aspect-ratio:${isShort ? "9/16" : "16/9"};
                background:#000;
                border-radius:8px;
                overflow:hidden;
                margin:0 auto;
            "
        >

            <iframe
                src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1"
                style="
                    position:absolute;
                    top:0;
                    left:0;
                    width:100%;
                    height:100%;
                    border:0;
                "
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                title="YouTube video player"
            ></iframe>

        </div>

    `;

    status(
        "Playing YouTube video."
    );
}


/* Open Spotify */

function openSpotify() {

        window.open(
            currentSpotifyURL,
            "_blank"
        );

    }
}


/* Live radio filtering */

$("search").addEventListener(
    "input",

            filterRadio($("search").value);
        }

    }
);


/* Enter key */

$("search").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            handleSearchButton();

        }

    }
);


/* Start */

async function startApp() {
    try {

        const callback =
            await handleCallback();

        updateLoggedInNavigation();

        if (accessToken) {

            $("loginButton").textContent =
                "Log out";

            $("loginButton").onclick =
                function() {

                    if (player) {

                        player.disconnect();

                    }

                    localStorage.removeItem(
                        "spotify_access_token"
                    );

                    localStorage.removeItem(
                        "spotify_refresh_token"
                    );

                    localStorage.removeItem(
                        "spotify_code_verifier"
                    );

                    localStorage.removeItem(
                        "spotify_state"
                    );

                    accessToken =
                        "";

                    updateLoggedInNavigation();
                    location.reload();

                };

            status(
                callback
                    ? "Spotify connected!"
                    : "Ready. Search Spotify above."
            );

            if (
                window.Spotify &&
                !player
            ) {

                window.onSpotifyWebPlaybackSDKReady();

            }

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}



/* Always-on init (no gate in this file) */
document.title = "Spotify by Kane";
startApp();
