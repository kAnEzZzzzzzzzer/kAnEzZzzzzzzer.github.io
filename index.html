    function bytes(b64) {
        var s = atob(b64), u = new Uint8Array(s.length);

        var d = bytes(P);
        var salt = d.slice(0, 16), iv = d.slice(16, 28), ct = d.slice(28);
        var subtle = crypto.subtle;
