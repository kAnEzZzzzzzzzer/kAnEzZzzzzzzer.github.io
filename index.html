<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify Clone</title>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: grid;
    grid-template-columns: 245px 1fr;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 245px;
    background: #000;
    border-right: 1px solid #222;
    padding: 24px 14px;
    overflow-y: auto;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    margin: 10px 12px 30px;
}

.nav-button {
    width: 100%;
    border: 0;
    background: transparent;
    color: #aaa;
    text-align: left;
    border-radius: 7px;
    padding: 13px 12px;
    margin-bottom: 5px;
    font-size: 15px;
}

.nav-button:hover,
.nav-button.active {
    background: #1f1f1f;
    color: #fff;
}

.library-title {
    color: #777;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 28px 12px 10px;
}

.library-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: #bbb;
    text-align: left;
    border-radius: 7px;
    padding: 11px 12px;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 11px;
}

.library-item:hover {
    background: #1f1f1f;
    color: #fff;
}

.library-icon {
    width: 31px;
    height: 31px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #282828;
    font-size: 17px;
}

.dj-icon {
    background: linear-gradient(135deg, #7b2cff, #e73cff);
    color: white;
}

.library-text {
    min-width: 0;
}

.library-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.library-subtitle {
    color: #777;
    font-size: 11px;
    margin-top: 3px;
}

/* MAIN */

main {
    margin-left: 245px;
    min-width: 0;
    min-height: 100vh;
    background: linear-gradient(#242424 0px, #121212 430px);
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 14px 22px;
    background: rgba(18,18,18,.94);
    backdrop-filter: blur(14px);
}

.search {
    flex: 1;
    max-width: 720px;
    padding: 13px 19px;
    border: 0;
    outline: none;
    border-radius: 28px;
    font-size: 15px;
    background: #fff;
    color: #111;
}

.search-button,
.login-button {
    border: 0;
    border-radius: 25px;
    padding: 12px 18px;
    font-weight: 800;
    white-space: nowrap;
}

.search-button {
    background: #1ed760;
    color: #000;
}

.search-button:hover {
    background: #1fdf64;
}

.login-button {
    background: #fff;
    color: #000;
}

.content {
    padding: 30px 25px 130px;
}

h1 {
    margin: 0 0 10px;
    font-size: 32px;
}

h2 {
    margin: 0;
}

.status {
    color: #aaa;
    margin-bottom: 20px;
}

.error {
    color: #ff9292;
    background: #351515;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
}

/* SEARCH */

.section-title {
    margin: 32px 0 15px;
    font-size: 23px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 17px;
}

.card {
    background: rgba(255,255,255,.07);
    padding: 13px;
    border-radius: 9px;
    cursor: pointer;
    transition: .15s;
    min-width: 0;
}

.card:hover {
    background: rgba(255,255,255,.14);
    transform: translateY(-2px);
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 7px;
    background: #282828;
}

.card-title {
    margin-top: 9px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* TRACKS */

.track-list {
    width: 100%;
}

.track {
    display: grid;
    grid-template-columns: 45px 52px minmax(0,1fr) minmax(100px, .8fr) 44px;
    gap: 12px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 7px;
}

.track:hover {
    background: rgba(255,255,255,.09);
}

.track-number {
    color: #999;
    text-align: center;
}

.track img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 5px;
}

.track-main {
    min-width: 0;
}

.track-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-album {
    color: #aaa;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.play-button {
    width: 39px;
    height: 39px;
    border: 0;
    border-radius: 50%;
    background: #1ed760;
    color: #000;
    font-weight: 800;
}

.play-button:hover {
    transform: scale(1.06);
}

/* HERO */

.hero {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 28px;
}

.hero-image {
    width: 210px;
    height: 210px;
    flex-shrink: 0;
    border-radius: 8px;
    object-fit: cover;
    background: #282828;
}

.hero-info {
    min-width: 0;
}

.eyebrow {
    color: #aaa;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.hero-title {
    font-size: 38px;
    margin-bottom: 10px;
    word-break: break-word;
}

.hero-description {
    color: #aaa;
    max-width: 700px;
    line-height: 1.5;
}

.hero-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.play-main,
.shuffle-main {
    border: 0;
    border-radius: 25px;
    padding: 13px 22px;
    font-weight: 800;
}

.play-main {
    background: #1ed760;
    color: #000;
}

.shuffle-main {
    background: #282828;
    color: #fff;
    border: 1px solid #444;
}

.shuffle-main.active {
    background: #1ed760;
    color: #000;
}

/* DJ */

.dj-page {
    max-width: 800px;
    margin: 40px auto;
    text-align: center;
}

.dj-logo-large {
    width: 130px;
    height: 130px;
    margin: 0 auto 25px;
    border-radius: 28px;
    background: linear-gradient(135deg, #7b2cff, #e73cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 900;
    box-shadow: 0 15px 50px rgba(130,40,255,.25);
}

.dj-page h1 {
    font-size: 44px;
}

.dj-page p {
    color: #aaa;
    font-size: 17px;
    margin: 12px 0 25px;
}

.dj-start {
    border: 0;
    border-radius: 28px;
    background: #1ed760;
    color: #000;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 800;
}

/* PLAYER */

.player {
    position: fixed;
    left: 245px;
    right: 0;
    bottom: 0;
    height: 88px;
    background: #181818;
    border-top: 1px solid #303030;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    z-index: 50;
}

.player-image {
    width: 60px;
    height: 60px;
    border-radius: 5px;
    object-fit: cover;
    background: #282828;
    flex-shrink: 0;
}

.player-info {
    width: 220px;
    min-width: 120px;
}

.player-title {
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex: 1;
}

.player-control {
    border: 0;
    background: transparent;
    color: #ddd;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 17px;
}

.player-control:hover {
    background: #292929;
    color: #fff;
}

.player-control.play {
    background: #fff;
    color: #000;
    font-size: 16px;
}

.player-control.play:hover {
    transform: scale(1.05);
}

.dj-skip {
    border: 0;
    background: linear-gradient(135deg,#7b2cff,#e73cff);
    color: #fff;
    border-radius: 20px;
    padding: 8px 12px;
    font-weight: 800;
    font-size: 12px;
    display: none;
}

.spotify-button {
    border: 0;
    border-radius: 20px;
    padding: 10px 16px;
    background: #1ed760;
    color: #000;
    font-weight: 800;
    white-space: nowrap;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
}

.loading {
    padding: 30px 0;
    color: #aaa;
}

/* MOBILE */

@media(max-width:850px) {

    .app {
        display: block;
    }

    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px;
        overflow: hidden;
    }

    .logo {
        display: none;
    }

    .nav-button {
        margin: 0;
        padding: 10px;
        width: auto;
    }

    .library-title,
    .library-item {
        display: none;
    }

    main {
        margin-left: 0;
    }

    .player {
        left: 0;
    }

    .player-info {
        width: 150px;
    }

    .spotify-button {
        display: none !important;
    }

    .track {
        grid-template-columns: 30px 48px minmax(0,1fr) 40px;
    }

    .track-album {
        display: none;
    }
}

@media(max-width:600px) {

    .topbar {
        padding: 10px;
    }

    .search-button {
        display: none;
    }

    .content {
        padding: 20px 14px 130px;
    }

    .hero {
        align-items: flex-start;
    }

    .hero-image {
        width: 130px;
        height: 130px;
    }

    .hero-title {
        font-size: 25px;
    }

    .player {
        height: 78px;
        padding: 8px;
    }

    .player-image {
        width: 48px;
        height: 48px;
    }

    .player-info {
        width: 130px;
    }

    .player-controls {
        gap: 1px;
    }

    .player-control {
        width: 32px;
    }

    .dj-skip {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ♫ Spotify Clone
        </div>

        <button
            id="homeButton"
            class="nav-button active"
            onclick="home()"
        >
            ⌂ Home
        </button>

        <button
            class="nav-button"

        </button>

        <button

<!-- PLAYER -->

<div class="player">

        alt=""
    >

    <div class="player-info">

        <div
            id="playerTitle"

<script>

/* =========================================================
   SPOTIFY SETTINGS
   ========================================================= */

const CLIENT_ID =
    "b70e6ed30b444ef3859d594d418c2aa1";

const REDIRECT_URI =
    "https://kanezzzzzzzzzer.github.io/kAnEzZzzzzzzer.github.io/";

const SCOPES =
    [
        "streaming",
        "user-read-private",
        "user-read-email",
        "playlist-read-private",
        "playlist-read-collaborative",
        "user-read-playback-state",
        "user-read-currently-playing",
        "user-modify-playback-state",
        "user-top-read"
    ].join(" ");


/* =========================================================
   STATE
   ========================================================= */

let accessToken =
    localStorage.getItem("spotify_access_token") || "";

let refreshToken =
    localStorage.getItem("spotify_refresh_token") || "";

let tokenExpiresAt =
    Number(localStorage.getItem("spotify_token_expires_at") || 0);

let player = null;

let deviceId = null;

let playerReady = false;

let currentTrack = null;

let currentSpotifyURL = "";

let trackCache = {};

let currentPlaylistId = null;

let currentPlaylistTracks = [];

let playlistShuffle = false;

let djXActive = false;

let djQueue = [];

let djIndex = 0;

let refreshingToken = null;


/* =========================================================
   HELPERS
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}


function setStatus(text, error = false) {

    $("status").textContent = text;

    $("status").className =
        error ? "error" : "status";
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getImage(item) {

    return (
        item?.images?.[0]?.url ||
        item?.album?.images?.[0]?.url ||
        ""
    );
}


function getSpotifyURL(item) {

    return item?.external_urls?.spotify || "#";
}


function sleep(ms) {

    return new Promise(resolve => {
        setTimeout(resolve, ms);
    });
}


/* =========================================================
   PKCE
   ========================================================= */

function randomString(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return [...array]
        .map(byte => characters[byte % characters.length])
        .join("");
}


async function sha256Base64URL(value) {

    const data =
        new TextEncoder().encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(digest)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const verifier =
        randomString();

    const challenge =
        await sha256Base64URL(verifier);

    const state =
        randomString(32);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );


    const url =
        new URL(
            "https://accounts.spotify.com/authorize"
        );


    url.search =
        new URLSearchParams({

            response_type: "code",

            client_id: CLIENT_ID,

            scope: SCOPES,

            redirect_uri: REDIRECT_URI,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });


    location.href =
        url.toString();
}


/* =========================================================
   TOKEN REFRESH
   ========================================================= */

async function refreshAccessToken() {

    if (!refreshToken) {
        throw new Error("Spotify login expired. Please log in again.");
    }

    if (refreshingToken) {
        return refreshingToken;
    }


    refreshingToken =
        (async () => {

            const body =
                new URLSearchParams({

                    grant_type:
                        "refresh_token",

                    refresh_token:
                        refreshToken,

                    client_id:
                        CLIENT_ID

                });


            const response =
                await fetch(
                    "https://accounts.spotify.com/api/token",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error_description ||
                    "Unable to refresh Spotify login."
                );
            }


            accessToken =
                data.access_token;

            localStorage.setItem(
                "spotify_access_token",
                accessToken
            );


            if (data.refresh_token) {

                refreshToken =
                    data.refresh_token;

                localStorage.setItem(
                    "spotify_refresh_token",
                    refreshToken
                );
            }


            tokenExpiresAt =
                Date.now() +
                ((data.expires_in || 3600) * 1000);

            localStorage.setItem(
                "spotify_token_expires_at",
                String(tokenExpiresAt)
            );


            return accessToken;

        })()
        .finally(() => {

            refreshingToken = null;

        });


    return refreshingToken;
}


async function getValidAccessToken() {

    if (!accessToken) {

        throw new Error(
            "Please log in with Spotify first."
        );
    }


    if (
        tokenExpiresAt &&
        Date.now() > tokenExpiresAt - 60000
    ) {

        return refreshAccessToken();
    }


    return accessToken;
}


/* =========================================================
   API
   ========================================================= */

async function spotifyAPI(
    endpoint,
    options = {},
    retry = true
) {

    const token =
        await getValidAccessToken();


    const response =
        await fetch(
            "https://api.spotify.com/v1" + endpoint,
            {

                ...options,

                headers: {

                    ...(options.headers || {}),

                    Authorization:
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"

                }

            }
        );


    if (
        response.status === 401 &&
        retry &&
        refreshToken
    ) {

        await refreshAccessToken();

        return spotifyAPI(
            endpoint,
            options,
            false
        );
    }


    if (
        response.status === 204
    ) {

        return null;
    }


    let data = null;

    try {

        data =
            await response.json();

    } catch {

        data = null;
    }


    if (!response.ok) {

        const message =
            data?.error?.message ||
            data?.error_description ||
            `Spotify error ${response.status}`;

        throw new Error(message);
    }


    return data;
}


/* =========================================================
   CALLBACK
   ========================================================= */

async function handleCallback() {

    const params =
        new URLSearchParams(
            location.search
        );

    const code =
        params.get("code");

    const state =
        params.get("state");

    const error =
        params.get("error");


    if (error) {

        throw new Error(
            "Spotify login failed: " + error
        );
    }


    if (!code) {
        return false;
    }


    if (
        state !==
        localStorage.getItem("spotify_state")
    ) {

        throw new Error(
            "Spotify security check failed."
        );
    }


    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );


    if (!verifier) {

        throw new Error(
            "Spotify login verifier is missing."
        );
    }


    const body =
        new URLSearchParams({

            grant_type:
                "authorization_code",

            code: code,

            redirect_uri:
                REDIRECT_URI,

            client_id:
                CLIENT_ID,

            code_verifier:
                verifier

        });


    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded"

                },

                body

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Spotify authorization failed."
        );
    }


    accessToken =
        data.access_token;

    refreshToken =
        data.refresh_token || "";


    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );


    if (refreshToken) {

        localStorage.setItem(
            "spotify_refresh_token",
            refreshToken
        );
    }


    tokenExpiresAt =
        Date.now() +
        ((data.expires_in || 3600) * 1000);


    localStorage.setItem(
        "spotify_token_expires_at",
        String(tokenExpiresAt)
    );


    localStorage.removeItem(
        "spotify_code_verifier"
    );

    localStorage.removeItem(
        "spotify_state"
    );


    history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );


    return true;
}

   WEB PLAYBACK SDK
   ========================================================= */

window.onSpotifyWebPlaybackSDKReady =
    function() {

        initializePlayer();

    };


async function initializePlayer() {

    if (!accessToken) {
        return;
    }


    if (!window.Spotify) {
        return;
    }


    if (player) {
        return;
    }


    player =
        new Spotify.Player({

            name:
                "Spotify Clone - Kane",

            volume:
                0.75,

            getOAuthToken:
                async callback => {

                    try {

                        const token =
                            await getValidAccessToken();

                        callback(token);

                    } catch {

                        callback(
                            accessToken
                        );
                    }
                }

        });


    player.addListener(
        "ready",
        async ({ device_id }) => {

            deviceId =
                device_id;

            playerReady =
                true;

            setStatus(
                "Spotify player ready."
            );

            try {

                await spotifyAPI(
                    "/me/player",
                    {
                        method: "GET"
                    }
                );

            } catch {}

        }
    );


    player.addListener(
        "not_ready",
        ({ device_id }) => {

            if (
                deviceId === device_id
            ) {

                playerReady =
                    false;
            }
        }
    );


    player.addListener(
        "initialization_error",
        ({ message }) => {

            console.error(
                "Initialization error:",
                message
            );

        }
    );


    player.addListener(
        "authentication_error",
        ({ message }) => {

            console.error(
                "Authentication error:",
                message
            );

        }
    );


    player.addListener(
        "account_error",
        ({ message }) => {

            console.error(
                "Account error:",
                message
            );

            setStatus(
                "Spotify Premium is required for the web player.",
                true
            );

        }
    );


    player.addListener(
        "playback_error",
        ({ message }) => {

            console.error(
                "Playback error:",
                message
            );

            setStatus(
                message,
                true
            );

        }
    );


    player.addListener(
        "player_state_changed",
        state => {

            if (!state) {
                return;
            }


            const track =
                state.track_window?.current_track;


            if (track) {

                currentTrack =
                    track;

                trackCache[
                    track.id
                ] = track;


                updatePlayerUI(
                    track,
                    state.paused
                );


                if (
                    djXActive &&
                    djQueue.length
                ) {

                    const index =
                        djQueue.findIndex(
                            item =>
                                item.id === track.id
                        );

                    if (index >= 0) {

                        djIndex =
                            index;
                    }
                }
            }


            $("playPauseButton").textContent =
                state.paused
                    ? "▶"
                    : "⏸";
        }
    );


    const connected =
        await player.connect();


    if (!connected) {

        setStatus(
            "Could not connect to Spotify player.",
            true
        );
    }
}

async function activateWebPlayer() {

    if (!deviceId) {

        throw new Error(
            "Spotify web player is not ready yet. Please wait a moment."
        );
    }


    await spotifyAPI(
        "/me/player",
        {

            method: "PUT",

            body: JSON.stringify({

                device_ids: [
                    deviceId
                ],

                play: false

            })

        }
    );


    await sleep(700);
}


/* =========================================================
   PLAY TRACK
   ========================================================= */

async function playTrack(trackOrId) {

    try {

        let track =
            typeof trackOrId === "string"
                ? trackCache[trackOrId]
                : trackOrId;


        if (
            typeof trackOrId === "string" &&
            !track
        ) {

            track =
                await spotifyAPI(
                    "/tracks/" +
                    encodeURIComponent(
                        trackOrId
                    )
                );
        }


        if (!track?.uri) {

            throw new Error(
                "This track cannot be played."
            );
        }


        trackCache[
            track.id
        ] = track;


        if (!deviceId) {

            await initializePlayer();

            await sleep(1000);
        }


        if (!deviceId) {

            throw new Error(
                "Spotify player is still starting. Try again in a moment."
            );
        }


        await activateWebPlayer();


        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {

                method: "PUT",

                body: JSON.stringify({

                    uris: [
                        track.uri
                    ]

                })

            }
        );


        currentTrack =
            track;

        updatePlayerUI(
            track,
            false
        );

    } catch (error) {

        console.error(
            "Play track error:",
            error
        );

        setStatus(
            error.message,
            true
        );
    }
}


/* =========================================================
   PLAY PLAYLIST
   ========================================================= */

async function playPlaylist(
    playlistId,
    useShuffle = false
) {

    try {

        if (!deviceId) {

            throw new Error(
                "Spotify player is still starting. Wait a moment and try again."
            );
        }


        currentPlaylistId =
            playlistId;


        await activateWebPlayer();


        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {

                method: "PUT",

                body: JSON.stringify({

                    context_uri:
                        "spotify:playlist:" +
                        playlistId

                })

            }
        );


        /*
         * Spotify's player endpoints are asynchronous.
         * Wait for playback to begin before changing shuffle.
         */

        await sleep(900);


        if (useShuffle) {

            await setPlaylistShuffle(
                true
            );

        } else {

            /*
             * Do not force shuffle off unless
             * the user explicitly presses the
             * shuffle button.
             */
        }


        setStatus(
            useShuffle
                ? "Playing playlist with shuffle."
                : "Playing playlist."
        );

    } catch (error) {

        console.error(
            "Playlist playback error:",
            error
        );

        setStatus(
            error.message,
            true
        );
    }
}

    const query =

                state ? "true" : "false"

        });


    if (deviceId) {

        query.set(
            "device_id",
            deviceId
        );
    }


    await spotifyAPI(
        "/me/player/shuffle?" +
        query.toString(),
        {

            method: "PUT"

        }
    );


    playlistShuffle =
        state;


    updateShuffleButton();
}


async function togglePlaylistShuffle() {

    if (!currentPlaylistId) {
        return;
    }


    try {

        const state =
            await spotifyAPI(
                "/me/player"
            );


        const current =
            state?.shuffle_state ??
            playlistShuffle;


        await setPlaylistShuffle(
            !current
        );


        setStatus(
            !current
                ? "Shuffle is on."
                : "Shuffle is off."
        );

    } catch (error) {

        console.error(
            "Shuffle error:",
            error
        );

        setStatus(
            error.message,
            true
        );
    }
}

/* =========================================================
   PLAYLIST ITEMS
   ========================================================= */

async function getAllPlaylistItems(
    playlistId
) {

    const allItems = [];

    let offset = 0;


    while (true) {

        const params =
            new URLSearchParams({

                market: "US",

                limit: "50",

                offset:
                    String(offset)

            });


        const data =
            await spotifyAPI(
                "/playlists/" +
                encodeURIComponent(
                    playlistId
                ) +
                "/items?" +
                params.toString()
            );


        const items =
            data?.items || [];


        allItems.push(
            ...items
        );


        if (
            !data?.next ||
            items.length === 0
        ) {

            break;
        }


        offset +=
            items.length;


        if (
            data.total &&
            offset >= data.total
        ) {

            break;
        }
    }


    return allItems;
}

async function searchSpotify() {

        $("search").value.trim();


    if (!query) {
        return;
    }


    if (!accessToken) {

        setStatus(
            "Click Log in first.",
            true
        );

        return;
    }


    try {

        setStatus(
            "Searching Spotify..."
        );


        /*
         * Spotify's 2026 Development Mode
         * maximum search limit is 10.
         */

        const params =
            new URLSearchParams({

                q: query,

                type:
                    "track,artist,album,playlist",

                limit:
                    "10",

                market:
                    "US"

            });


        const data =
            await spotifyAPI(
                "/search?" +
                params.toString()
            );


        renderSearch(
            data
        );


        setStatus(
            `Search results for "${query}".`
        );

    } catch (error) {

        console.error(
            "Search error:",
            error
        );

        setStatus(
            error.message,
            true
        );
    }
}

                q:
                    `artist:"${artist.name.replace(
                        /"/g,
                        ""
                    )}"`,

                type:
                    "track",

                limit:
                    "10",

                market:
                    "US"

            });


        const data =
            await spotifyAPI(
                "/search?" +
                params.toString()
            );


        const tracks =
            data?.tracks?.items || [];


        let output = `

            <div class="hero">

                ${
                    getImage(artist)
                        ? `
                            <img
                                class="hero-image"
                                src="${escapeHTML(
                                    getImage(
                                        artist
                                    )
                                )}"
                                alt=""
                            >
                        `
                        : ""
                }

                <div class="hero-info">

                    <div class="eyebrow">
                        ARTIST
                    </div>

                    <div class="hero-title">
                        ${escapeHTML(
                            artist.name
                        )}
                    </div>

                    <div class="hero-description">
                        Spotify Artist
                    </div>

                </div>

            </div>

            <div class="section-title">
                Songs
            </div>

            <div class="track-list">
        `;


        tracks.forEach(
            (track, index) => {

                trackCache[
                    track.id
                ] = track;


                output +=
                    trackRow(
                        track,
                        index
                    );

            }
        );


        output += `
            </div>
        `;


        $("results").innerHTML =
            output;


        setStatus(
            "Artist loaded."
        );

    } catch (error) {

        setStatus(
            error.message,
            true
        );
    }
}

/* =========================================================

function openDJX() {

            >
                ▶ Start DJ X
            </button>

        </div>

    `;


    setStatus(
        "DJ X is ready."
    );
}


/*
 * DJ X isn't a public Spotify Web API endpoint.
 * This implementation creates a DJ-style queue from
 * the user's personalized Spotify top tracks.
 */

async function startDJX() {

    try {

        setStatus(
            "DJ X is choosing your music..."
        );


        const data =
            await spotifyAPI(
                "/me/top/tracks?limit=10&time_range=short_term"
            );


        let tracks =
            data?.items || [];


        if (!tracks.length) {

            throw new Error(
                "DJ X could not find personalized tracks yet."
            );
        }


        /*
         * Keep the personalized tracks,
         * then randomize their playback order.
         */

        tracks =
            [...tracks];


        for (
            let i = tracks.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            [
                tracks[i],
                tracks[j]
            ] =
            [
                tracks[j],
                tracks[i]
            ];
        }


        djQueue =
            tracks;


        djIndex =
            0;


        djXActive =
            true;


        for (
            const track of tracks
        ) {

            trackCache[
                track.id
            ] = track;
        }


        if (!deviceId) {

            throw new Error(
                "Spotify player is not ready yet. Wait a moment and try again."
            );
        }


        await activateWebPlayer();


        /*
         * Start with the first DJ-selected track.
         */

        const firstTrack =
            djQueue[0];


        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(
                deviceId
            ),
            {

                method: "PUT",

                body: JSON.stringify({

                    uris: [
                        firstTrack.uri
                    ]

                })

            }
        );


        showDJPlaying();


        setStatus(
            "DJ X is playing."
        );

    } catch (error) {

        console.error(
            "DJ X error:",
            error
        );

        setStatus(
            error.message,
            true
        );
    }
}


/* =========================================================
   DJ X PAGE WHILE PLAYING
   ========================================================= */

function showDJPlaying() {

    $("heading").textContent =
        "DJ X";


    $("results").innerHTML = `

        <div class="dj-page">

            <div class="dj-logo-large">
                DJ
            </div>

            </h1>

                DJ X is playing music picked
                for you.
            </p>

    `;

}


/* =========================================================
   DJ X SKIP
   ========================================================= */

async function djXSkip() {

    if (!djXActive) {

        await nextTrack();

        return;
    }


    /*
     * Use our own personalized DJ queue.
     * This makes DJ X Skip deterministic instead
     * of depending on Spotify's normal queue.
     */

    djIndex++;


    if (
        djIndex >=
        djQueue.length
    ) {

        /*
         * Start a new DJ session when the
         * personalized queue is exhausted.
         */

        await startDJX();

        return;
    }


    const next =
        djQueue[djIndex];


    try {

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(
                deviceId
            ),
            {

                method: "PUT",

                body: JSON.stringify({

                    uris: [
                        next.uri
                    ]

                })

            }
        );


        currentTrack =
            next;


        updatePlayerUI(
            next,
            false
        );


        setStatus(
            "DJ X skipped to the next song."
        );

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message,
            true
        );
    }
}

        }
    }

/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    localStorage.removeItem(
        "spotify_access_token"
    );

    localStorage.removeItem(
        "spotify_refresh_token"
    );

    localStorage.removeItem(
        "spotify_token_expires_at"
    );

    localStorage.removeItem(
        "spotify_code_verifier"
    );

    localStorage.removeItem(
        "spotify_state"
    );


    accessToken =
        "";

    refreshToken =
        "";

    tokenExpiresAt =
        0;


    if (player) {

        try {
            player.disconnect();
        } catch {}
    }


    location.reload();
}


/* =========================================================
   STARTUP
   ========================================================= */

(async function() {

    try {

        const callback =
            await handleCallback();


        if (accessToken) {

            $("loginButton").textContent =
                "Log out";


            $("loginButton").onclick =
                logout;


            if (callback) {

                setStatus(
                    "Spotify connected!"
                );

            } else {

                setStatus(
                    "Ready. Search Spotify above."
                );
            }


            /*
             * The SDK may already have loaded,
             * or its global callback will initialize it.
             */

            if (window.Spotify) {

                initializePlayer();

            }

        }

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message,
            true
        );
    }

})();
