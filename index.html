<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked</title>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #0b0b0b; }

#gate {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: #0b0b0b; color: #d7d7d7;
  font-family: Arial, Helvetica, sans-serif;
}
#gate .box {
  width: min(400px, calc(100vw - 48px));
  padding: 28px 32px;
  border: 1px solid #252525;
  background: #111;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
}
#gate h1 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 500;
  color: #eee;
}
#gate p {
  margin: 0 0 18px;
  color: #999;
  font-size: 13px;
  line-height: 1.5;
}
#gate input[type="password"] {
  width: 100%;
  padding: 10px 12px;
  background: #0a0a0a;
  border: 1px solid #2a2a2a;
  color: #eee;
  font-size: 14px;
  margin-bottom: 12px;
}
#gate input[type="password"]:focus {
  outline: none;
  border-color: #444;
}
#gate button {
  width: 100%;
  padding: 10px 12px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  color: #eee;
  font-size: 14px;
  cursor: pointer;
}
#gate button:hover:not(:disabled) { background: #222; }
#gate button:disabled { opacity: .5; cursor: not-allowed; }
#gate .msg {
  margin-top: 12px;
  font-size: 12px;
  min-height: 16px;
}
#gate .msg.error { color: #c66; }
#gate .msg.wait { color: #b98a3a; }

#appFrame {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  border: none; z-index: 10000;
  display: none;
}
</style>
</head>

<body>

<div id="gate">
  <div class="box">
    <h1>Password required</h1>
    <p>This page is private. Enter the password to continue.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" />
    <button id="submitBtn">Unlock</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<iframe id="appFrame" title="app"></iframe>

<script>
/* Only a SHA-256 hash of the password is stored here, never the
   password itself, so it can't be read back out of this file. */
const EXPECTED_HASH = "REPLACE_WITH_YOUR_SHA256_HASH";

const LOCKOUT_KEY = "gateAttempts";
const MAX_FREE_ATTEMPTS = 5;

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function getAttempts() {
  try {
    return JSON.parse(sessionStorage.getItem(LOCKOUT_KEY) || '{"count":0,"until":0}');
  } catch (e) {
    return { count: 0, until: 0 };
  }
}

function setAttempts(state) {
  try { sessionStorage.setItem(LOCKOUT_KEY, JSON.stringify(state)); } catch (e) {}
}

function lockoutSecondsRemaining() {
  const { until } = getAttempts();
  return Math.max(0, Math.ceil((until - Date.now()) / 1000));
}

function delayForCount(count) {
  // Delay grows with each wrong guess past the free attempts:
  // 5s, 10s, 20s, 40s... capped at 5 minutes.
  const over = count - MAX_FREE_ATTEMPTS;
  if (over <= 0) return 0;
  return Math.min(5 * Math.pow(2, over - 1), 300);
}

const pwInput = document.getElementById("pw");
const submitBtn = document.getElementById("submitBtn");
const msgEl = document.getElementById("msg");

function showMessage(text, kind) {
  msgEl.textContent = text;
  msgEl.className = "msg" + (kind ? " " + kind : "");
}

function refreshLockUI() {
  const remaining = lockoutSecondsRemaining();
  if (remaining > 0) {
    submitBtn.disabled = true;
    showMessage(`Too many attempts. Try again in ${remaining}s.`, "wait");
    setTimeout(refreshLockUI, 1000);
  } else {
    submitBtn.disabled = false;
    if (msgEl.classList.contains("wait")) showMessage("", "");
  }
}

function unlock() {
  const style = document.createElement("style");
  document.getElementById("gate").style.display = "none";

  const frame = document.getElementById("appFrame");
  try { sessionStorage.setItem("appUnlocked", "1"); } catch (e) {}
  frame.src = "app.html?v=" + Date.now();
  frame.style.display = "block";
}

async function tryUnlock() {
  if (lockoutSecondsRemaining() > 0) return;

  const value = pwInput.value;
  if (!value) return;

  const hash = await sha256Hex(value);
  if (hash === EXPECTED_HASH) {
    setAttempts({ count: 0, until: 0 });
    unlock();
    return;
  }

  const state = getAttempts();
  state.count += 1;
  const delay = delayForCount(state.count);
  state.until = delay > 0 ? Date.now() + delay * 1000 : 0;
  setAttempts(state);

  pwInput.value = "";
  if (delay > 0) {
    refreshLockUI();
  } else {
    showMessage("Incorrect password.", "error");
  }
}

submitBtn.addEventListener("click", tryUnlock);
pwInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock();
});

refreshLockUI();
</script>

</body>
</html>
