<script>
/* Apply the saved theme before first paint so light mode doesn't flash dark */
(function () {
    try {
        if (JSON.parse(localStorage.getItem("theme_mode")) === "light") {
            document.documentElement.setAttribute("data-theme", "light");
        }
    } catch (e) {}
})();
</script>
<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #000;
    --bg-main-start: #242424;
    --bg-main-end: #121212;
    --text: #fff;
    --text-dim: #aaa;
    --text-dimmer: #888;
    --border: #2a2a2a;
    --border-strong: #444;
    --nav-hover: #1f1f1f;
    --surface: rgba(255,255,255,.07);
    --surface-strong: rgba(255,255,255,.1);
    --surface-hover: rgba(255,255,255,.15);
    --surface-solid: #282828;
    --surface-solid-2: #181818;
    --input-bg: #121212;
    --topbar-bg: rgba(18,18,18,.95);
    --track: #4d4d4d;
    --accent-ink: var(--accent);
    --accent-deep: var(--accent);
}


body {
    margin: 0;
    background: #000;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
}

/* Sidebar */

.sidebar {
    background: var(--bg);
    padding: 25px 15px;
    border-right: 1px solid var(--border);
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin: 10px;
    margin-bottom: 35px;
}

.nav-button.logged-in-nav {
    display: none;
}

.nav-button.youtube-only-nav {
    display: none;
}

.nav-button {
    width: 100%;
    padding: 13px;
    margin-bottom: 5px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.nav-button:hover,
.nav-button.active {
    background: var(--nav-hover);
    color: var(--text);
}

.dj-nav {
    margin-top: 18px;
    color: var(--text);
}

.dj-nav:hover {
    background: var(--nav-hover);
    color: var(--text);
}

/* Main page */

main {
    min-width: 0;
    background: linear-gradient(var(--bg-main-start), var(--bg-main-end) 350px);
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 12px;
    padding: 15px 25px;
    background: var(--topbar-bg);
    backdrop-filter: blur(10px);
}

.search {
    flex: 1;
    max-width: 650px;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

.search-button,
.login-button,
.mode-dropdown-button {
    border: none;
    border-radius: 25px;
    padding: 0 20px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    height: 46px;
    line-height: 46px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    transition: transform .15s, box-shadow .15s, background .15s;
}

.search-button:active,
.login-button:active,
.mode-dropdown-button:active {
    transform: scale(.96);
}

.search-button {
    background: var(--accent);
    color: var(--accent-text);
}

.login-button {
    background: white;
    color: black;
}

.content {
    padding: 30px 25px 130px;
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

h2 {
    margin-top: 35px;
}

/* Cards */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
}

.card {
    position: relative;
    background: var(--surface);
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    background: var(--surface-hover);
    transform: translateY(-2px);
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface-solid);
}

.card-title {
    margin-top: 10px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Track rows */

.track {
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 6px;
}

.track:hover {
    background: var(--surface-strong);
}

.track img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}

.play-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #1ed760;
    cursor: pointer;
    font-weight: bold;
}

.play-button:hover {
    transform: scale(1.05);
}

/* Status message */

.status {
    color: var(--text-dim);
    margin-bottom: 20px;
}

.error {
    color: #ff8888;
    background: #351515;
    padding: 15px;
    border-radius: 8px;
}

/* Hero */

.hero {
    display: flex;
    gap: 20px;
    align-items: center;
    margin: 15px 0 25px;
}

.hero img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
}


.kiis-page {
    max-width: 700px;
}

.kiis-player-card {
    background: var(--surface);
    border-radius: 15px;
    padding: 25px;
    margin-top: 20px;
}

.kiis-now {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 15px;
}

.kiis-player-card .status {
    margin-top: 16px;
}

/* DJ X */

.dj-page {
    background: var(--surface);
    border-radius: 15px;
    padding: 35px;
    margin-top: 20px;
}

.dj-title {
    font-size: 55px;
    font-weight: 800;
    margin: 0 0 10px;
}

.dj-description {
    color: #bbb;
    font-size: 17px;
    margin-bottom: 25px;
}

.dj-button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    background: #1ed760;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-right: 8px;
}

.dj-button:hover {
    background: #1fdf64;
}

.dj-skip {
    border: 1px solid #777;
    background: transparent;
    color: var(--text);
}

.dj-skip:hover {
    background: var(--surface-strong);
}

.search-button.youtube-mode,
.search-button.google-mode,
.search-button.radio-mode {
    background: var(--accent);
    color: var(--accent-text);
}

/* Radio */

.nav-button.radio-only-nav {
    display: none;
}

.radio-now {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--surface);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
}

.radio-now .radio-art {
    width: 110px;
    flex-shrink: 0;
}

.radio-now .dj-button {
    background: var(--accent);
    color: var(--text);
    margin: 10px 0 0;
}

.radio-now .dj-button:hover {
    background: color-mix(in srgb, var(--accent) 80%, #fff);
}

.radio-now-title {
    font-size: 26px;
    font-weight: 800;
    margin: 4px 0;
}

.radio-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
}

.radio-grid .card {
    padding: 6px;
}

.radio-grid .card-title {
    font-size: 12px;
    margin-top: 6px;
}

.radio-grid .card-subtitle {
    font-size: 10px;
}

.radio-grid.compact {
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 8px;
}

.radio-grid.compact .card {
    padding: 4px;
}

.radio-grid.compact .card-title {
    font-size: 11px;
    margin-top: 4px;
}

.radio-grid.compact .card-subtitle {
    display: none;
}

.radio-art {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
    color: #eee;
    background: var(--surface);
    text-align: center;
    padding: 3px;
}

.radio-live {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    background: rgba(0,0,0,.55);
    border-radius: 10px;
    padding: 3px 7px;
}

.card.playing {
    outline: 2px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 18%, transparent);
}

.card {
    position: relative;
}

.radio-add-button {
    display: none;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: var(--text);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
}

.radio-add-button:hover {
    background: color-mix(in srgb, var(--accent) 80%, #fff);
}

.radio-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    z-index: 3;
}

.radio-remove:hover {
    background: #e11d48;
}

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.7);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.open {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 440px;
    background: var(--surface-solid);
    border-radius: 14px;
    padding: 26px;
}

.modal h2 {
    margin: 0 0 18px;
}

.modal label {
    display: block;
    font-size: 13px;
    color: #bbb;
    margin: 12px 0 5px;
}

.modal input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
}

.modal input:focus {
    border-color: var(--accent);
}

.modal-hint {
    font-size: 12px;
    color: var(--text-dimmer);
    margin-top: 6px;
}

.modal-error {
    color: #ff8888;
    font-size: 13px;
    min-height: 18px;
    margin-top: 12px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}

.modal-actions .dj-button {
    background: var(--accent);
    color: var(--text);
    margin: 0;
}

.modal-actions .dj-skip {
    background: transparent;
    border: 1px solid #777;
}

/* Google results */

.google-result {
    padding: 14px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
}

.google-result:hover {
    background: var(--surface);
}

.google-result-url {
    color: #8ab4f8;
    font-size: 13px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.google-result-title {
    font-size: 18px;
    color: #4285F4;
    margin-bottom: 4px;
}

.google-result-title:hover {
    text-decoration: underline;
}

.google-result-snippet {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.4;
}

/* Drawing Pad / AI / Developer modes */

.nav-button.mode-nav {
    display: none;
}

.search-button.tool-mode {
    background: var(--accent);
    color: var(--accent-text);
}

.tool-panel {
    background: var(--surface);
    border-radius: 15px;
    padding: 20px;
    margin-top: 10px;
}

.tool-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
}

.tool-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 14px;
}

.tool-btn {
    border: none;
    border-radius: 20px;
    padding: 9px 16px;
    background: var(--surface-strong);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
}

.tool-btn:hover {
    background: var(--surface-hover);
}

.tool-btn.active,
.tool-btn.primary {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: bold;
}

.tool-input {
    padding: 9px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-solid-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
}

.tool-input:focus {
    border-color: var(--accent);
}

/* Drawing pad */

.draw-canvas-wrap {
    border: 2px solid var(--accent);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    line-height: 0;
}

#drawCanvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    cursor: crosshair;
}

.draw-color-picker {
    position: relative;
    display: inline-flex;
    align-items: center;
}

.draw-color-trigger {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 2px solid var(--border-strong);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    background:
        radial-gradient(circle at center, #fff 0 28%, transparent 29%),
        conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    box-shadow: 0 0 0 1px rgba(255,255,255,.12);
}

.draw-color-trigger:hover { transform: scale(1.06); }

.draw-color-popover {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    z-index: 80;
    width: 270px;
    padding: 14px;
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    background: var(--surface-solid);
    box-shadow: 0 12px 35px rgba(0,0,0,.55);
}

.draw-color-popover.open { display: block; }

.draw-color-wheel {
    display: block;
    width: 230px;
    height: 230px;
    margin: 0 auto;
    cursor: crosshair;
    touch-action: none;
}

.draw-color-preview {
    width: 30px;
    height: 30px;
    margin: 10px auto 0;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
}

.draw-color-hex {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 7px 9px;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--input-bg);
    color: var(--text);
    text-align: center;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
}

.draw-dropper.active {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: bold;
}

.draw-swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    cursor: pointer;
    padding: 0;
}


:root[data-mode="gaming"] { --accent: #ff2d95; --accent-text: #fff; }


/* Secret AI */
.ai-page{max-width:900px;margin:0 auto}
.ai-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ai-head-icon{font-size:34px}
.ai-head h2{margin:0}
.ai-config{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:16px;margin-bottom:16px}
.ai-config-grid{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center}
.ai-config label{font-size:13px;color:var(--text-dim)}
.ai-config select,.ai-config input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--input-bg);color:var(--text);outline:none}
.ai-config select:focus,.ai-config input:focus{border-color:var(--accent)}
.ai-note{font-size:12px;color:var(--text-dimmer);margin-top:10px;line-height:1.45}
.ai-chat{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;overflow:hidden}
.ai-messages{min-height:330px;max-height:55vh;overflow:auto;padding:18px}
.ai-msg{display:flex;margin-bottom:12px}
.ai-msg.user{justify-content:flex-end}
.ai-bubble{max-width:82%;padding:11px 14px;border-radius:13px;background:var(--surface-strong);line-height:1.5;overflow-wrap:anywhere}
.ai-msg.user .ai-bubble{background:var(--accent);color:var(--accent-text)}
.ai-msg.assistant .ai-bubble pre{overflow:auto}
.ai-msg.assistant .ai-bubble p:last-child{margin-bottom:0}
.ai-compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:rgba(0,0,0,.12)}
.ai-compose textarea{flex:1;min-height:48px;max-height:150px;resize:vertical;padding:11px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--input-bg);color:var(--text);font:14px Arial,Helvetica,sans-serif;outline:none}
.ai-compose textarea:focus{border-color:var(--accent)}
.ai-send{align-self:flex-end}
.ai-thinking{opacity:.7;font-style:italic}
@media(max-width:650px){.ai-config-grid{grid-template-columns:1fr}.ai-bubble{max-width:92%}.ai-compose{flex-direction:column}.ai-send{align-self:stretch}}

/* Game Arcade */
.arc-hero{border-radius:10px;padding:20px 22px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border-strong);border-left:3px solid var(--accent);}
.arc-hero h2{margin:0 0 4px;font-size:22px;font-weight:600}
.arc-hero p{margin:0;color:var(--text-dim);font-size:13.5px}
.arc-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.arc-chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.arc-chip:hover{border-color:var(--accent)}
.arc-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:bold}
.arc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.arc-card{position:relative;text-align:left;cursor:pointer;color:var(--text);background:var(--surface);border:1px solid transparent;border-radius:14px;padding:0;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.arc-card:hover,.arc-card:focus-visible{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.35);outline:none}
.arc-art{height:96px;display:flex;align-items:center;justify-content:center;font-size:46px}
.arc-body{padding:12px 14px 14px}
.arc-name{font-weight:bold;font-size:15px;margin-bottom:3px}
.arc-desc{color:var(--text-dim);font-size:12px;line-height:1.35;min-height:32px}
.arc-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.arc-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:999px;background:var(--surface-strong);color:var(--text-dim)}
.arc-fav{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#facc15;font-size:16px;line-height:1;padding:5px 8px;border-radius:999px}.arc-fav:hover{background:rgba(0,0,0,.8)}.arc-row{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);font-weight:bold;margin:0 0 10px}.arc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.arc-best{margin-left:auto;font-weight:bold;color:var(--accent)}.arc-stage:fullscreen{background:#0b0b0f;overflow:auto;padding:24px;max-width:none}.arc-hero .tool-btn{margin-top:12px}.arc-playx{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;opacity:0;transition:opacity .15s}
.arc-card:hover .arc-play{opacity:1}
.arc-stage{max-width:760px;margin:0 auto;text-align:center}
.arc-stage-head{display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:16px}
.arc-stage-head h2{margin:0}
.arc-stage-icon{font-size:34px}
.arc-start{padding:34px 20px;border-radius:14px;background:var(--surface)}
.arc-start .big{font-size:60px;margin-bottom:8px}
.arc-start .tool-btn{font-size:16px;padding:12px 28px}
.arc-empty{padding:30px;text-align:center;color:var(--text-dim)}

/* Developer */

.dev-cat {
    margin: 22px 0 10px;
    font-size: 13px;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: bold;
}

.dev-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
}

.dev-card {
    text-align: left;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    color: var(--text);
}

.dev-card:hover {
    border-color: var(--accent);
    background: var(--surface-strong);
}

.dev-card-name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
}

.dev-card-desc {
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.35;
}

.dev-ta {
    width: 100%;
    min-height: 130px;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-solid-2);
    color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    resize: vertical;
    outline: none;
    margin-bottom: 10px;
}

.dev-ta:focus {
    border-color: var(--accent);
}

.dev-ta.dev-err {
    color: #ff8888;
}

.dev-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

@media (max-width: 900px) {
    .dev-split {
        grid-template-columns: 1fr;
    }
}

.dev-frame-wrap {
    background: #fff;
    border-radius: 8px;
    overflow: auto;
    border: 1px solid var(--border-strong);
}

.dev-frame-wrap:fullscreen {
    border-radius: 0;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    padding: 0;
}

.dev-frame-wrap:fullscreen .dev-frame {
    height: 100%;
}

.dev-frame {
    display: block;
    width: 100%;
    height: 440px;
    border: 0;
    background: #fff;
    margin: 0 auto;
}

.dev-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.dev-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
}

.dev-table td:first-child {
    color: var(--accent);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    white-space: nowrap;
    width: 1%;
    padding-right: 24px;
}

.dev-log {
    background: #0d0d0d;
    border-radius: 8px;
    padding: 12px;
    min-height: 120px;
    max-height: 300px;
    overflow: auto;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    white-space: pre-wrap;
}

.dev-log .warn {
    color: #fbbf24;
}

.dev-log .error {
    color: #ff8888;
}

.dev-box mark {
    background: var(--accent);
    color: #000;
    border-radius: 3px;
}

.dev-diff div {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    padding: 1px 8px;
}

.dev-diff .add {
    background: rgba(34, 197, 94, .2);
}

.dev-diff .del {
    background: rgba(239, 68, 68, .2);
}


/* Mode dropdown (replaces old mode-toggle-button) */

.mode-dropdown {
    position: relative;
}

.mode-dropdown-button {
    background: white;
    color: black;
    white-space: nowrap;
    gap: 8px;
}

.search-button:hover,
.login-button:hover,
.mode-dropdown-button:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transform: translateY(-1px);
}

.mode-dropdown-caret {
    font-size: 10px;
    line-height: 1;
    transition: transform .2s;
}

.mode-dropdown-open .mode-dropdown-caret {
    transform: rotate(180deg);
}

.mode-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--surface-solid);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    padding: 6px;
    min-width: 170px;
    z-index: 30;
}

.mode-dropdown-menu.open {
    display: block;
}

.mode-dropdown-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text);
    text-align: left;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.mode-dropdown-item:hover {
    background: #3a3a3a;
}

.mode-dropdown-check {
    color: #1ed760;
    font-weight: bold;
    visibility: hidden;
}

.mode-dropdown-item.active .mode-dropdown-check {
    visibility: visible;
}

/* Shorts Feed */

.shorts-feed {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-height: 75vh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    padding: 10px 0 20px;
}

.shorts-item {
    position: relative;
    scroll-snap-align: center;
    flex-shrink: 0;
    width: 260px;
    aspect-ratio: 9/16;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
}

.shorts-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.shorts-item iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.shorts-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    color: var(--text);
    font-size: 13px;
    pointer-events: none;
}

.shorts-caption .card-subtitle {
    margin-top: 2px;
}

/* Currently Playing Bar */

.player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 82px;
    background: var(--surface-solid-2);
    border-top: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    z-index: 20;
}

}

.player-title {

}

}

.play-control {

/* Cross-mode music mini player */
.mini-music-player {
    position: fixed;
    top: 12px;
    right: 18px;
    z-index: 95;
    display: none;
    align-items: center;
    gap: 9px;
    max-width: min(360px, calc(100vw - 36px));
    padding: 7px 9px 7px 11px;
    border: 1px solid var(--border-strong);

    background: rgba(18,18,18,.96);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);

.mini-music-info { min-width: 0; max-width: 250px; }
.mini-music-title,

    overflow: hidden;
    text-overflow: ellipsis;
}
.mini-music-title { font-size: 12px; font-weight: 700; }
.mini-music-artist { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
.mini-music-play {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    border: none;
    border-radius: 50%;

    align-items: center;
    justify-content: center;

    color: #000;
    font-weight: bold;

.mini-music-play.radio-source,
.play-control.radio-source { background: #a855f7; color: #fff; }

.play-control.spotify-source:hover { background: #1ed760; }
.play-control.radio-source:hover { background: #a855f7; }

@media(max-width:700px) {
    .mini-music-player {
        top: 8px;
        right: 8px;

    }

/* Mobile */

/* ===== v2.3 upgrades ===== */
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); color: #fff; }
.player { padding-bottom: env(safe-area-inset-bottom, 0px); }
.modal-overlay.open .modal { animation: k23pop .18s ease-out; }
@keyframes k23pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.k23-skip { position: fixed; left: 12px; top: -60px; z-index: 10000; background: #fff; color: #000; padding: 10px 16px; border-radius: 20px; font-weight: bold; text-decoration: none; transition: top .15s; }
.k23-skip:focus { top: 12px; }
.k23-top { position: fixed; right: 20px; bottom: 100px; z-index: 40; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface-solid); color: var(--text); font-size: 20px; cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s, transform .2s; }
.k23-top.show { opacity: 1; pointer-events: auto; transform: none; }
.k23-top:hover { background: var(--surface-hover); }
.k23-keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center; margin: 14px 0 6px; }
.k23-keys kbd { justify-self: start; min-width: 28px; text-align: center; padding: 3px 8px; border-radius: 6px; background: var(--surface-strong); border: 1px solid var(--border-strong); font: 13px/1.4 Arial, sans-serif; }
.k23-keys span { color: var(--text-dim); font-size: 14px; }
.k23-muted #volume, .k23-muted #settingsVolume { opacity: .45; }

/* Play buttons (playlist/album/search rows and the bottom player) follow the accent colour */
.play-button, .play-control, .play-control.spotify-source, .play-control.radio-source,
.mini-music-play.spotify-source, .mini-music-play.radio-source { background: var(--accent); color: var(--accent-text); }
.play-button:hover, .play-control:hover, .play-control.spotify-source:hover, .play-control.radio-source:hover { background: var(--accent); filter: brightness(1.12); }
.play-button { display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: transform .15s, filter .15s; }
/* Load Player button, DJ / Save buttons and the mode-menu tick follow the accent colour */
.splash-button, .dj-button:not(.dj-skip) { background: var(--accent); color: var(--accent-text); }
.splash-button:hover:not(:disabled), .dj-button:not(.dj-skip):hover { background: var(--accent); filter: brightness(1.12); }
.mode-dropdown-check { color: var(--accent); }
/* Three-way switch: Black / White / Auto */
.k23-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.k23-seg button { border: 0; border-right: 1px solid var(--border-strong); background: transparent; color: var(--text-dim); padding: 8px 14px; font-size: 13px; cursor: pointer; min-width: 60px; }

.k23-seg button.active { background: var(--accent); color: var(--accent-text); font-weight: bold; }
/* Spotify home page */
/* Page scrollbar (Firefox); Chrome/Safari already use the accent above */
html, * { scrollbar-color: color-mix(in srgb, var(--accent) 65%, #2a2a2a) transparent; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
/* Seek bar */
.k23-center { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-left: auto; flex: 1 1 auto; max-width: 560px; min-width: 0; }
.k23-center .player-controls { margin-left: 0; }
.k23-seek { display: flex; align-items: center; gap: 10px; width: 100%; }
.k23-time { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 40px; }
.k23-time.right { text-align: right; }
.k23-rw { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
.k23-range { --p: 0%; width: 100%; min-width: 0; height: 22px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
.k23-range:disabled { cursor: default; opacity: .6; }
.k23-range::-webkit-slider-runnable-track { height: 5px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
.k23-range::-moz-range-track { height: 4px; border-radius: 4px; background: var(--track); }
.k23-range::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
.k23-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border-radius: 50%; background: var(--accent); border: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); opacity: 0; transition: opacity .12s; }
.k23-range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); opacity: 0; }
.k23-seek:hover .k23-range:not(:disabled)::-webkit-slider-thumb, .k23-range:focus-visible::-webkit-slider-thumb, .k23-range:active::-webkit-slider-thumb { opacity: 1; }
.k23-seek:hover .k23-range:not(:disabled)::-moz-range-thumb, .k23-range:focus-visible::-moz-range-thumb { opacity: 1; }
.k23-seek:hover .k23-range:not(:disabled)::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
.k23-seek:hover .k23-range:not(:disabled)::-moz-range-progress { background: var(--accent); }
.k23-tip { position: absolute; bottom: 24px; left: 0; transform: translateX(-50%); padding: 3px 7px; border-radius: 6px; background: #000; border: 1px solid var(--border-strong); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transition: opacity .1s; white-space: nowrap; z-index: 2; }
.k23-rw:hover .k23-range:not(:disabled) ~ .k23-tip { opacity: 1; }
.k23-time.right { cursor: pointer; }
@media (pointer: coarse) { .k23-range::-webkit-slider-thumb { opacity: 1; } .k23-range::-moz-range-thumb { opacity: 1; } }
/* On wide screens the seek bar sits in the exact middle of the page */
@media (min-width: 1100px) {
    .k23-center { position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%); width: min(560px, calc(100vw - 720px)); margin: 0; justify-content: center; }
    .player-info { margin-right: auto; }
}
.k23-time.live { color: var(--accent); font-weight: bold; }
@media (max-width: 700px) { .player { gap: 10px; padding-left: 12px; padding-right: 12px; } .player-info { min-width: 0; max-width: 96px; } .k23-center { max-width: none; } .k23-time { min-width: 34px; font-size: 11px; } }
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* ================= Light theme v2 "Soft Pastel" (Settings > Appearance > Theme) ================= */
/* Default accent. :where() keeps this weaker than the per-mode accents below it. */
:root:where([data-theme="light"]) { --accent: #86d9a3; --accent-text: #000; }
:root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    /* the top of every page glows in the current accent colour */
    --bg-main-start: color-mix(in srgb, var(--accent) 30%, #ffffff);
    --bg-main-end: #f6f5fb;
    --text: #1f1d2e;
    --text-dim: #5b5870;
    --text-dimmer: #6e6b85;
    --border: #ebe9f3;
    --border-strong: #d5d2e3;
    --nav-hover: color-mix(in srgb, var(--accent) 16%, #ffffff);
    --surface: rgba(45,35,95,.05);
    --surface-strong: rgba(45,35,95,.08);
    --surface-hover: rgba(45,35,95,.12);
    --surface-solid: #ffffff;
    --surface-solid-2: #fcfcfe;
    --input-bg: #ffffff;
    --topbar-bg: rgba(255,255,255,.72);
    --track: #dcd9ea;
    --accent-ink: color-mix(in srgb, var(--accent) 40%, #1f1d2e);   /* accent as readable text */
    --accent-deep: color-mix(in srgb, var(--accent) 72%, #3b3470);  /* accent for rings, sliders, switches */
    --card-bg: #ffffff;
    --card-border: rgba(60,50,110,.09);
    --card-shadow: 0 1px 2px rgba(45,35,95,.06), 0 6px 18px rgba(45,35,95,.06);
    --card-shadow-hover: 0 2px 4px rgba(45,35,95,.08), 0 14px 32px rgba(45,35,95,.15);
}
/* Pastel versions of every per-tab accent ("Match mode") */
:root[data-theme="light"][data-mode="youtube"]  { --accent: #ff8f8f; }
:root[data-theme="light"][data-mode="google"]   { --accent: #8db9ff; }
:root[data-theme="light"][data-mode="radio"]    { --accent: #c39bff; }
:root[data-theme="light"][data-mode="draw"]     { --accent: #7fdde9; }
:root[data-theme="light"][data-mode="dev"]      { --accent: #f7d860; }
:root[data-theme="light"][data-mode="gaming"]   { --accent: #ff93c6; }
:root[data-theme="light"][data-mode="calendar"] { --accent: #8db9ff; }
:root[data-theme="light"][data-mode="clock"]    { --accent: #86d3f5; }
:root[data-theme="light"][data-mode="tasks"]    { --accent: #8fe3a8; }
:root[data-theme="light"][data-mode="notes"]    { --accent: #f9cf6b; }
:root[data-theme="light"][data-mode="ai"]       { --accent: #b9bfc9; }

/* Smooth cross-fade when the theme is switched (class is added briefly by setThemeMode) */
.theme-anim, .theme-anim *, .theme-anim *::before, .theme-anim *::after {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease !important;
}

/* ---------- Page chrome ---------- */
:root[data-theme="light"] body { background: var(--bg); }

:root[data-theme="light"] .card,
:root[data-theme="light"] .kiis-player-card,
:root[data-theme="light"] .dj-page,
:root[data-theme="light"] .radio-now,

:root[data-theme="light"] .k23-seek:hover .k23-range:not(:disabled)::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent-deep) var(--p), var(--track) var(--p)); }

    function bytes(b64) {
        var s = atob(b64), u = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
        return u;

            throw new Error("framed");

        var d = bytes(P);
        var salt = d.slice(0, 16), iv = d.slice(16, 28), ct = d.slice(28);
        var subtle = crypto.subtle;

            .then(function(km) {

            .then(function(key) {
                return subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
