<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Clone</title>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    background: #000;
    padding: 25px 15px;
    border-right: 1px solid #222;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin: 10px;
    margin-bottom: 35px;
}

.nav-button {
    width: 100%;
    padding: 13px;
    margin-bottom: 5px;
    border: none;
    background: transparent;
    color: #aaa;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.nav-button:hover,
.nav-button.active {
    background: #1f1f1f;
    color: white;
}

.dj-nav {
    margin-top: 18px;
    color: white;
}

.dj-nav:hover {
    background: #1f1f1f;
    color: white;
}

/* MAIN */

main {
    min-width: 0;
    background: linear-gradient(#242424, #121212 350px);
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 12px;
    padding: 15px 25px;
    background: rgba(18,18,18,.95);
    backdrop-filter: blur(10px);
}

.search {
    flex: 1;
    max-width: 650px;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

.search-button,
.login-button {
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

.search-button {
    background: #1ed760;
    color: black;
}

.login-button {
    background: white;
    color: black;
}

.content {
    padding: 30px 25px 130px;
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

h2 {
    margin-top: 35px;
}

/* CARDS */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
}

.card {
    background: rgba(255,255,255,.07);
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    background: rgba(255,255,255,.15);
    transform: translateY(-2px);
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    background: #282828;
}

.card-title {
    margin-top: 10px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* TRACKS */

.track {
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 6px;
}

.track:hover {
    background: rgba(255,255,255,.1);
}

.track img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}

.play-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #1ed760;
    cursor: pointer;
    font-weight: bold;
}

.play-button:hover {
    transform: scale(1.05);
}

/* STATUS */

.status {
    color: #aaa;
    margin-bottom: 20px;
}

.error {
    color: #ff8888;
    background: #351515;
    padding: 15px;
    border-radius: 8px;
}

/* HERO */

.hero {
    display: flex;
    gap: 20px;
    align-items: center;
    margin: 15px 0 25px;
}

.hero img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
}

/* DJ X */

.dj-page {
    background: rgba(255,255,255,.07);
    border-radius: 15px;
    padding: 35px;
    margin-top: 20px;
}

.dj-title {
    font-size: 55px;
    font-weight: 800;
    margin: 0 0 10px;
}

.dj-description {
    color: #bbb;
    font-size: 17px;
    margin-bottom: 25px;
}

.dj-button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    background: #1ed760;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-right: 8px;
}

.dj-button:hover {
    background: #1fdf64;
}

.dj-skip {
    border: 1px solid #777;
    background: transparent;
    color: white;
}

.dj-skip:hover {
    background: rgba(255,255,255,.1);
}

/* PLAYER */

.player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 82px;
    background: #181818;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    z-index: 20;
}

.player img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 5px;
}

.player-info {
    min-width: 180px;
    max-width: 250px;
}

.player-title {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

.control-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.control-button:hover {
    background: #333;
}

.play-control {
    background: white;
    color: black;
}

.play-control:hover {
    background: #ddd;
}

.spotify-button {
    background: #1ed760;
    color: black;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* MOBILE */

@media(max-width:700px) {

    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .content {
        padding: 20px 15px 130px;
    }

    .topbar {
        padding: 12px;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
    }

    .hero img {
        width: 140px;
        height: 140px;
    }

    .dj-page {
        padding: 25px;
    }

    .dj-title {
        font-size: 40px;
    }

    .player-info {
        min-width: 100px;
    }

    .spotify-button {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ♫ Spotify Clone
        </div>

        <button class="nav-button active" onclick="home()">
            🏠 Home
        </button>

        <button class="nav-button" onclick="focusSearch()">
            🔎 Search
        </button>

        <button class="nav-button" onclick="loadPlaylists()">
            📚 My Playlists
        </button>

        <button class="nav-button dj-nav" onclick="openDJX()">
            DJ X
        </button>

    </aside>

    <main>

        <div class="topbar">

            <input
                id="search"
                class="search"
                placeholder="What do you want to play?"
                autocomplete="off"
            >

            <button
                class="search-button"
                onclick="searchSpotify()"
            >
                Search
            </button>

            <button
                id="loginButton"
                class="login-button"
                onclick="login()"
            >
                Log in
            </button>

        </div>

        <div class="content">

            <h1 id="heading">
                Spotify Clone
            </h1>

            <div id="status" class="status">
                Log in with Spotify to search music.
            </div>

            <div id="results"></div>

        </div>

    </main>

</div>


<!-- PLAYER -->

<div class="player">

    <img id="playerImage" src="" alt="">

    <div class="player-info">

        <div
            id="playerTitle"
            class="player-title"
        >
            Nothing playing
        </div>

        <div
            id="playerArtist"
            class="player-artist"
        >
            Choose a song
        </div>

    </div>

    <div class="player-controls">

        <button
            class="control-button"
            onclick="previousTrack()"
            title="Previous"
        >
            ⏮
        </button>

        <button
            id="playButton"
            class="control-button play-control"
            onclick="togglePlayback()"
            title="Play/Pause"
        >
            ▶
        </button>

        <button
            class="control-button"
            onclick="nextTrack()"
            title="Next"
        >
            ⏭
        </button>

    </div>

    <button
        id="spotifyButton"
        class="spotify-button"
        style="display:none"
        onclick="openSpotify()"
    >
        Open in Spotify
    </button>

</div>


<script>

/* =========================================================
   SPOTIFY SETTINGS
   ========================================================= */

const CLIENT_ID =
    "b70e6ed30b444ef3859d594d418c2aa1";

const REDIRECT_URI =
    "https://kanezzzzzzzzzer.github.io/kAnEzZzzzzzzer.github.io/";

const DJ_X_PLAYLIST_ID =
    "37i9dQZF1EYkqdzj48dyYq";

const SCOPES =
    "user-read-private " +
    "user-read-email " +
    "playlist-read-private " +
    "playlist-read-collaborative " +
    "streaming " +
    "user-read-playback-state " +
    "user-modify-playback-state";


let accessToken =
    localStorage.getItem("spotify_access_token") || "";

let refreshToken =
    localStorage.getItem("spotify_refresh_token") || "";

let player = null;

let deviceId = null;

let playerReady = false;

let currentSpotifyURL = "";

let djMode = false;


/* =========================================================
   HELPERS
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}


function status(text, error = false) {

    $("status").textContent = text;

    $("status").className =
        error ? "error" : "status";
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function image(item) {

    if (!item) {
        return "";
    }

    return (
        item?.images?.[0]?.url ||
        item?.album?.images?.[0]?.url ||
        ""
    );
}


function spotifyURL(item) {

    return item?.external_urls?.spotify || "#";
}


function wait(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );
}


/* =========================================================
   PKCE
   ========================================================= */

function randomString(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return [...array]
        .map(byte =>
            characters[byte % characters.length]
        )
        .join("");
}


async function sha256Base64URL(value) {

    const data =
        new TextEncoder().encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(digest)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const verifier =
        randomString();

    const challenge =
        await sha256Base64URL(verifier);

    const state =
        randomString(32);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );

    const url =
        new URL(
            "https://accounts.spotify.com/authorize"
        );

    url.search =
        new URLSearchParams({

            response_type: "code",

            client_id: CLIENT_ID,

            scope: SCOPES,

            redirect_uri: REDIRECT_URI,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });

    window.location.href =
        url.toString();
}


/* =========================================================
   CALLBACK
   ========================================================= */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const state =
        params.get("state");

    const error =
        params.get("error");

    if (error) {

        throw new Error(
            "Spotify login failed: " + error
        );
    }

    if (!code) {
        return false;
    }

    if (
        state !==
        localStorage.getItem("spotify_state")
    ) {

        throw new Error(
            "Spotify security check failed."
        );
    }

    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    new URLSearchParams({

                        client_id:
                            CLIENT_ID,

                        grant_type:
                            "authorization_code",

                        code:
                            code,

                        redirect_uri:
                            REDIRECT_URI,

                        code_verifier:
                            verifier

                    })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Could not get Spotify access token."
        );
    }

    accessToken =
        data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );

    if (data.refresh_token) {

        refreshToken =
            data.refresh_token;

        localStorage.setItem(
            "spotify_refresh_token",
            refreshToken
        );
    }

    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );

    return true;
}


/* =========================================================
   SPOTIFY API
   ========================================================= */

async function spotifyAPI(
    endpoint,
    options = {}
) {

    if (!accessToken) {

        throw new Error(
            "Please log in with Spotify first."
        );
    }

    const headers = {

        Authorization:
            "Bearer " + accessToken

    };

    if (options.body) {

        headers["Content-Type"] =
            "application/json";
    }

    const response =
        await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            {
                ...options,

                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

    const data =
        await response
            .json()
            .catch(() => ({}));

    if (!response.ok) {

        if (response.status === 401) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            accessToken = "";

        }

        throw new Error(
            data.error?.message ||
            "Spotify API error: " +
            response.status
        );
    }

    return data;
}


/* =========================================================
   WEB PLAYBACK SDK
   ========================================================= */

window.onSpotifyWebPlaybackSDKReady =
    function() {

        if (!accessToken) {
            return;
        }

        player =
            new Spotify.Player({

                name:
                    "Spotify Clone",

                getOAuthToken:
                    callback => {

                        callback(
                            accessToken
                        );

                    },

                volume:
                    0.5

            });

        player.addListener(
            "ready",
            function({ device_id }) {

                deviceId =
                    device_id;

                playerReady =
                    true;

                console.log(
                    "Spotify player ready:",
                    deviceId
                );

                status(
                    "Spotify player connected."
                );

            }
        );

        player.addListener(
            "not_ready",
            function({ device_id }) {

                console.log(
                    "Device went offline:",
                    device_id
                );

                playerReady =
                    false;
            }
        );

        player.addListener(
            "player_state_changed",
            function(state) {

                if (!state) {
                    return;
                }

                const track =
                    state.track_window
                        ?.current_track;

                if (!track) {
                    return;
                }

                $("playerTitle").textContent =
                    track.name || "Unknown track";

                $("playerArtist").textContent =
                    (track.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ") ||
                    "Unknown artist";

                if (
                    track.album?.images?.[0]?.url
                ) {

                    $("playerImage").src =
                        track.album.images[0].url;

                }

                currentSpotifyURL =
                    track.external_urls?.spotify ||
                    "";

                $("spotifyButton").style.display =
                    currentSpotifyURL
                        ? "block"
                        : "none";

                $("playButton").textContent =
                    state.paused
                        ? "▶"
                        : "⏸";

            }
        );

        player.addListener(
            "initialization_error",
            function({ message }) {

                status(
                    "Player initialization error: " +
                    message,
                    true
                );

            }
        );

        player.addListener(
            "authentication_error",
            function({ message }) {

                status(
                    "Spotify authentication error: " +
                    message,
                    true
                );

            }
        );

        player.addListener(
            "account_error",
            function({ message }) {

                status(
                    "Spotify account error: " +
                    message,
                    true
                );

            }
        );

        player.connect();

    };


/* =========================================================
   PLAY TRACK
   ========================================================= */

async function playTrack(track) {

    if (!track) {
        return;
    }

    if (!deviceId) {

        alert(
            "Spotify player is not ready yet. " +
            "Please wait a moment after logging in."
        );

        return;
    }

    try {

        djMode = false;

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",

                body: JSON.stringify({

                    uris: [
                        track.uri
                    ]

                })

            }
        );

        $("playerImage").src =
            image(track);

        $("playerTitle").textContent =
            track.name || "Unknown track";

        $("playerArtist").textContent =
            (track.artists || [])
                .filter(Boolean)
                .map(a => a?.name)
                .filter(Boolean)
                .join(", ") ||
            "Unknown artist";

        currentSpotifyURL =
            spotifyURL(track);

        $("spotifyButton").style.display =
            currentSpotifyURL !== "#"
                ? "block"
                : "none";

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   PLAY PLAYLIST
   ========================================================= */

async function playPlaylist(id) {

    if (!deviceId) {

        alert(
            "Spotify player is not ready yet."
        );

        return;
    }

    try {

        djMode = false;

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",

                body: JSON.stringify({

                    context_uri:
                        "spotify:playlist:" +
                        id

                })

            }
        );

        status(
            "Playlist started."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   DJ X
   ========================================================= */

async function openDJX() {

    $("heading").textContent =
        "DJ X";

    $("results").innerHTML = `

        <div class="dj-page">

            <div class="dj-title">
                DJ X
            </div>

            <div class="dj-description">
                Spotify DJ X
            </div>

            <button
                class="dj-button"
                onclick="startDJX()"
            >
                ▶ Start DJ X
            </button>

            <button
                class="dj-button dj-skip"
                onclick="djXSkip()"
            >
                ⏭ Skip
            </button>

        </div>

    `;

    currentSpotifyURL =
        "https://open.spotify.com/playlist/" +
        DJ_X_PLAYLIST_ID;

    $("spotifyButton").style.display =
        "block";

    status(
        "DJ X is ready."
    );

    try {

        const playlist =
            await spotifyAPI(
                "/playlists/" +
                DJ_X_PLAYLIST_ID +
                "?market=US"
            );

        const cover =
            image(playlist);

        if (cover) {

            $("results").querySelector(
                ".dj-page"
            ).insertAdjacentHTML(
                "afterbegin",
                `
                <img
                    src="${escapeHTML(cover)}"
                    style="
                        width:180px;
                        height:180px;
                        object-fit:cover;
                        border-radius:10px;
                        margin-bottom:20px;
                    "
                >
                `
            );
        }

    }
    catch (error) {

        console.log(
            "Could not load DJ X details:",
            error.message
        );

    }
}


async function startDJX() {

    if (!deviceId) {

        alert(
            "Spotify player is not ready yet. " +
            "Please wait a moment after logging in."
        );

        return;
    }

    try {

        djMode = true;

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",

                body: JSON.stringify({

                    context_uri:
                        "spotify:playlist:" +
                        DJ_X_PLAYLIST_ID

                })

            }
        );

        status(
            "DJ X started on Spotify."
        );

    }
    catch (error) {

        status(
            "DJ X could not be started: " +
            error.message,
            true
        );

    }
}


async function djXSkip() {

    if (!accessToken) {
        return;
    }

    try {

        await spotifyAPI(
            "/me/player/next",
            {
                method: "POST"
            }
        );

        status(
            djMode
                ? "DJ X skipped."
                : "Skipped."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   PLAYER CONTROLS
   ========================================================= */

async function togglePlayback() {

    if (!player) {

        alert(
            "Spotify player is not ready yet."
        );

        return;
    }

    try {

        await player.togglePlay();

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


async function nextTrack() {

    try {

        await spotifyAPI(
            "/me/player/next",
            {
                method: "POST"
            }
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


async function previousTrack() {

    try {

        await spotifyAPI(
            "/me/player/previous",
            {
                method: "POST"
            }
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   SEARCH
   ========================================================= */

async function searchSpotify() {

    const query =
        $("search").value.trim();

    if (!query) {

        status(
            "Type something to search."
        );

        return;
    }

    if (!accessToken) {

        status(
            "Click Log in first."
        );

        return;
    }

    status(
        "Searching Spotify..."
    );

    $("heading").textContent =
        'Search: "' + query + '"';

    try {

        const data =
            await spotifyAPI(
                "/search?" +
                new URLSearchParams({

                    q: query,

                    type:
                        "track,artist,album,playlist",

                    limit:
                        "10",

                    market:
                        "US"

                })
            );

        renderSearch(data);

        status(
            "Spotify search results"
        );

    }
    catch (error) {

        console.error(
            "Spotify search error:",
            error
        );

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   SEARCH RESULTS
   FIXED TO HANDLE NULL ITEMS
   ========================================================= */

function renderSearch(data) {

    let output = "";

    const sections = [

        [
            "Songs",
            data?.tracks?.items || [],
            "track"
        ],

        [
            "Artists",
            data?.artists?.items || [],
            "artist"
        ],

        [
            "Albums",
            data?.albums?.items || [],
            "album"
        ],

        [
            "Playlists",
            data?.playlists?.items || [],
            "playlist"
        ]

    ];

    for (
        const [name, rawItems, type]
        of sections
    ) {

        /*
         * Spotify can sometimes return null entries.
         * Remove them before trying to read properties.
         */
        const items =
            Array.isArray(rawItems)
                ? rawItems.filter(item => item != null)
                : [];

        if (!items.length) {
            continue;
        }

        output +=
            "<h2>" +
            escapeHTML(name) +
            "</h2>";

        output +=
            '<div class="grid">';

        for (
            const item
            of items
        ) {

            if (!item) {
                continue;
            }

            const itemID =
                item.id || "";

            const itemName =
                item.name || "Unknown";

            const img =
                image(item);

            let subtitle =
                "";

            if (type === "track") {

                subtitle =
                    (item.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ");

            }

            else if (type === "artist") {

                subtitle =
                    "Artist";

            }

            else if (type === "album") {

                subtitle =
                    (item.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ");

            }

            else if (type === "playlist") {

                /*
                 * FIX:
                 * Use item?.owner instead of assuming
                 * owner always exists.
                 */

                const ownerName =
                    item?.owner?.display_name ||
                    item?.owner?.name ||
                    "";

                subtitle =
                    ownerName
                        ? "By " + ownerName
                        : "Spotify playlist";
            }

            output += `

                <div
                    class="card"
                    onclick="openItem(
                        '${escapeHTML(type)}',
                        '${escapeHTML(itemID)}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }

                    <div class="card-title">
                        ${escapeHTML(itemName)}
                    </div>

                    <div class="card-subtitle">
                        ${escapeHTML(subtitle)}
                    </div>

                </div>

            `;

        }

        output +=
            "</div>";

    }

    if (!output) {

        output =
            "<div class='status'>" +
            "No results found." +
            "</div>";

    }

    $("results").innerHTML =
        output;
}


/* =========================================================
   OPEN RESULT
   ========================================================= */

async function openItem(type, id) {

    if (!id) {
        return;
    }

    try {

        if (type === "track") {

            const track =
                await spotifyAPI(
                    "/tracks/" +
                    encodeURIComponent(id)
                );

            await playTrack(track);

        }

        else if (type === "playlist") {

            await openPlaylist(id);

        }

        else if (type === "album") {

            const album =
                await spotifyAPI(
                    "/albums/" +
                    encodeURIComponent(id)
                );

            openAlbum(album);

        }

        else if (type === "artist") {

            const artist =
                await spotifyAPI(
                    "/artists/" +
                    encodeURIComponent(id)
                );

            openArtist(artist);

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   PLAYLIST PAGE
   ========================================================= */

async function openPlaylist(id) {

    try {

        const playlist =
            await spotifyAPI(
                "/playlists/" +
                encodeURIComponent(id) +
                "?market=US"
            );

        $("heading").textContent =
            playlist.name || "Playlist";

        let output = "";

        const cover =
            image(playlist);

        output += `

            <div class="hero">

                ${
                    cover
                    ?
                    `<img
                        src="${escapeHTML(cover)}"
                        alt=""
                    >`
                    :
                    ""
                }

                <div>

                    <h2 style="margin:0 0 8px">
                        ${escapeHTML(
                            playlist.name ||
                            "Playlist"
                        )}
                    </h2>

                    <div class="status">
                        ${
                            escapeHTML(
                                playlist.description ||
                                "Spotify playlist"
                            )
                        }
                    </div>

                    <button
                        class="play-button"
                        onclick="playPlaylist('${escapeHTML(id)}')"
                        title="Play playlist"
                    >
                        ▶
                    </button>

                </div>

            </div>

        `;

        const items =
            playlist?.items?.items ||
            playlist?.tracks?.items ||
            [];

        for (
            const item
            of items
        ) {

            if (!item) {
                continue;
            }

            const track =
                item.item ||
                item.track;

            if (!track) {
                continue;
            }

            output +=
                trackRow(track);

        }

        $("results").innerHTML =
            output;

        status(
            "Playlist loaded."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   TRACK ROW
   ========================================================= */

function trackRow(track) {

    if (!track) {
        return "";
    }

    const trackName =
        track.name || "Unknown track";

    const artists =
        (track.artists || [])
            .filter(Boolean)
            .map(a => a?.name)
            .filter(Boolean)
            .join(", ");

    return `

        <div class="track">

            <img
                src="${escapeHTML(image(track))}"
                alt=""
            >

            <div>

                <div class="card-title">
                    ${escapeHTML(trackName)}
                </div>

                <div class="card-subtitle">
                    ${escapeHTML(
                        artists ||
                        "Unknown artist"
                    )}
                </div>

            </div>

            <button
                class="play-button"
                onclick='playTrack(${JSON.stringify(track).replace(/'/g, "&#39;")})'
            >
                ▶
            </button>

        </div>

    `;
}


/* =========================================================
   ALBUM
   ========================================================= */

function openAlbum(album) {

    if (!album) {
        return;
    }

    $("heading").textContent =
        album.name || "Album";

    let output =
        `<div class="hero">`;

    if (image(album)) {

        output += `

            <img
                src="${escapeHTML(image(album))}"
                alt=""
            >

        `;

    }

    output += `

        <div>

            <h2 style="margin:0 0 8px">
                ${escapeHTML(
                    album.name ||
                    "Album"
                )}
            </h2>

            <div class="status">
                ${
                    escapeHTML(
                        (album.artists || [])
                            .filter(Boolean)
                            .map(a => a?.name)
                            .filter(Boolean)
                            .join(", ") ||
                        "Unknown artist"
                    )
                }
            </div>

        </div>

    </div>

    `;

    for (
        const track
        of album.tracks?.items || []
    ) {

        if (!track) {
            continue;
        }

        track.album =
            album;

        output +=
            trackRow(track);

    }

    $("results").innerHTML =
        output;

    status(
        "Album loaded."
    );
}


/* =========================================================
   ARTIST
   ========================================================= */

function openArtist(artist) {

    if (!artist) {
        return;
    }

    $("heading").textContent =
        artist.name || "Artist";

    $("results").innerHTML = `

        <div
            class="card"
            style="max-width:300px"
        >

            ${
                image(artist)

                ?

                `<img
                    src="${escapeHTML(image(artist))}"
                    alt=""
                >`

                :

                ""
            }

            <div class="card-title">
                ${escapeHTML(
                    artist.name ||
                    "Unknown artist"
                )}
            </div>

            <div class="card-subtitle">
                Spotify Artist
            </div>

        </div>

    `;

    currentSpotifyURL =
        spotifyURL(artist);

    $("spotifyButton").style.display =
        currentSpotifyURL !== "#"
            ? "block"
            : "none";

    status(
        "Artist loaded."
    );
}


/* =========================================================
   MY PLAYLISTS
   ========================================================= */

async function loadPlaylists() {

    if (!accessToken) {

        status(
            "Click Log in first."
        );

        return;
    }

    $("heading").textContent =
        "My Playlists";

    status(
        "Loading your playlists..."
    );

    try {

        const data =
            await spotifyAPI(
                "/me/playlists?limit=50"
            );

        let output =
            '<div class="grid">';

        const playlists =
            (data?.items || [])
                .filter(Boolean);

        for (
            const playlist
            of playlists
        ) {

            const img =
                image(playlist);

            output += `

                <div
                    class="card"
                    onclick="openPlaylist(
                        '${escapeHTML(playlist.id || "")}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }

                    <div class="card-title">
                        ${escapeHTML(
                            playlist.name ||
                            "Untitled playlist"
                        )}
                    </div>

                    <div class="card-subtitle">
                        ${
                            escapeHTML(
                                playlist.owner?.display_name ||
                                ""
                            )
                        }
                    </div>

                </div>

            `;

        }

        output +=
            "</div>";

        $("results").innerHTML =
            output;

        status(
            playlists.length +
            " playlists loaded."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   HOME
   ========================================================= */

function home() {

    djMode = false;

    $("heading").textContent =
        "Spotify Clone";

    $("results").innerHTML =
        "";

    status(
        accessToken
            ? "Ready. Search Spotify above."
            : "Log in with Spotify to search music."
    );
}


function focusSearch() {

    $("search").focus();
}


/* =========================================================
   OPEN SPOTIFY
   ========================================================= */

function openSpotify() {

    if (currentSpotifyURL) {

        window.open(
            currentSpotifyURL,
            "_blank"
        );

    }
}


/* =========================================================
   ENTER KEY
   ========================================================= */

$("search").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchSpotify();

        }

    }
);


/* =========================================================
   START
   ========================================================= */

(async function() {

    try {

        const callback =
            await handleCallback();

        if (accessToken) {

            $("loginButton").textContent =
                "Log out";

            $("loginButton").onclick =
                function() {

                    if (player) {

                        player.disconnect();

                    }

                    localStorage.removeItem(
                        "spotify_access_token"
                    );

                    localStorage.removeItem(
                        "spotify_refresh_token"
                    );

                    localStorage.removeItem(
                        "spotify_code_verifier"
                    );

                    localStorage.removeItem(
                        "spotify_state"
                    );

                    accessToken =
                        "";

                    location.reload();

                };

            status(
                callback
                    ? "Spotify connected!"
                    : "Ready. Search Spotify above."
            );

            if (
                window.Spotify &&
                !player
            ) {

                window.onSpotifyWebPlaybackSDKReady();

            }

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }

})();

</script>
