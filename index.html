    function bytes(b64) {
        var s = atob(b64), u = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
        return u;

    try {
        if (window.top !== window.self && window.top.location.origin !== location.origin) {
            throw new Error("framed");
        }
        var id = location.origin + "/" + (location.pathname.split("/")[1] || "") + "/";
        var d = bytes(P);
        var salt = d.slice(0, 16), iv = d.slice(16, 28), ct = d.slice(28);
        var subtle = crypto.subtle;

        subtle.importKey("raw", new TextEncoder().encode(id), "PBKDF2", false, ["deriveKey"])
            .then(function(km) {
                return subtle.deriveKey(
                    { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
                    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]

            })
            .then(function(key) {
                return subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
