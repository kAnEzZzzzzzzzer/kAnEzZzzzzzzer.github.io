<script>

/* =========================================================
   SPOTIFY SETTINGS
========================================================= */

const CLIENT_ID =
    "b70e6ed30b444ef3859d594d418c2aa1";

const REDIRECT_URI =
    "https://kanezzzzzzzzzer.github.io/kAnEzZzzzzzzer.github.io/";

const DJ_X_PLAYLIST_ID =
    "37i9dQZF1EYkqdzj48dyYq";

const SCOPES =
    "user-read-private " +
    "user-read-email " +
    "playlist-read-private " +
    "playlist-read-collaborative " +
    "streaming " +
    "user-read-playback-state " +
    "user-modify-playback-state";


let accessToken =
    localStorage.getItem("spotify_access_token") || "";

let currentSpotifyURL = "";

let spotifyPlayer = null;

let deviceId = "";

let currentTrack = null;

let currentPlaylistTracks = [];

let shuffledPlaylistTracks = [];

let shuffleEnabled = false;

let currentDJXTracks = [];


/* =========================================================
   HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}


function status(text, error = false) {

    $("status").textContent = text;

    $("status").className =
        error ? "error" : "status";
}


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function image(item) {

    return (
        item?.images?.[0]?.url ||
        item?.album?.images?.[0]?.url ||
        ""
    );
}


function spotifyURL(item) {

    return item?.external_urls?.spotify || "#";
}


/* =========================================================
   PKCE LOGIN
========================================================= */

function randomString(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return [...array]
        .map(byte =>
            characters[byte % characters.length]
        )
        .join("");
}


async function sha256Base64URL(value) {

    const data =
        new TextEncoder().encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(digest)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


async function login() {

    const verifier =
        randomString();

    const challenge =
        await sha256Base64URL(verifier);

    const state =
        randomString(32);


    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );


    const url =
        new URL(
            "https://accounts.spotify.com/authorize"
        );


    url.search =
        new URLSearchParams({

            response_type: "code",

            client_id: CLIENT_ID,

            scope: SCOPES,

            redirect_uri: REDIRECT_URI,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });


    window.location.href =
        url.toString();
}


/* =========================================================
   HANDLE CALLBACK
========================================================= */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const state =
        params.get("state");

    const error =
        params.get("error");


    if (error) {

        throw new Error(
            "Spotify login failed: " + error
        );
    }


    if (!code) {

        return false;
    }


    const savedState =
        localStorage.getItem(
            "spotify_state"
        );


    if (state !== savedState) {

        throw new Error(
            "Spotify security check failed."
        );
    }


    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );


    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    new URLSearchParams({

                        client_id:
                            CLIENT_ID,

                        grant_type:
                            "authorization_code",

                        code:
                            code,

                        redirect_uri:
                            REDIRECT_URI,

                        code_verifier:
                            verifier

                    })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Could not get Spotify access token."
        );
    }


    accessToken =
        data.access_token;


    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );


    if (data.refresh_token) {

        localStorage.setItem(
            "spotify_refresh_token",
            data.refresh_token
        );
    }


    localStorage.removeItem(
        "spotify_code_verifier"
    );

    localStorage.removeItem(
        "spotify_state"
    );


    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );


    return true;
}


/* =========================================================
   SPOTIFY API
========================================================= */

async function spotifyAPI(endpoint, options = {}) {

    if (!accessToken) {

        throw new Error(
            "Please log in with Spotify first."
        );
    }


    const response =
        await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            {

                ...options,

                headers: {

                    ...(options.headers || {}),

                    Authorization:
                        "Bearer " + accessToken

                }

            }
        );


    const data =
        await response.json()
            .catch(() => ({}));


    if (!response.ok) {

        if (response.status === 401) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            accessToken = "";
        }


        throw new Error(
            data.error?.message ||
            "Spotify API error: " +
            response.status
        );
    }


    return data;
}


/* =========================================================
   WEB PLAYBACK SDK
========================================================= */

window.onSpotifyWebPlaybackSDKReady =
    function() {

        if (!accessToken) {
            return;
        }


        spotifyPlayer =
            new Spotify.Player({

                name: "Spotify Clone",

                getOAuthToken: callback => {

                    callback(accessToken);

                },

                volume: 0.7

            });


        spotifyPlayer.addListener(
            "ready",
            ({ device_id }) => {

                deviceId =
                    device_id;

                status(
                    "Spotify player ready."
                );

            }
        );


        spotifyPlayer.addListener(
            "not_ready",
            ({ device_id }) => {

                console.log(
                    "Device went offline:",
                    device_id
                );

            }
        );


        spotifyPlayer.addListener(
            "player_state_changed",
            state => {

                if (!state) {
                    return;
                }


                const track =
                    state.track_window
                        ?.current_track;


                if (track) {

                    currentTrack =
                        track;


                    updatePlayerUI(
                        track
                    );
                }


                $("playerPlayButton").textContent =
                    state.paused
                        ? "▶"
                        : "⏸";
            }
        );


        spotifyPlayer.addListener(
            "initialization_error",
            ({ message }) => {

                console.error(
                    message
                );

            }
        );


        spotifyPlayer.addListener(
            "authentication_error",
            ({ message }) => {

                console.error(
                    message
                );

            }
        );


        spotifyPlayer.addListener(
            "account_error",
            ({ message }) => {

                console.error(
                    message
                );

            }
        );


        spotifyPlayer.connect();

    };


/* =========================================================
   PLAYER UI
========================================================= */

function updatePlayerUI(track) {

    currentSpotifyURL =
        spotifyURL(track);


    $("playerImage").src =
        image(track);


    $("playerTitle").textContent =
        track.name;


    $("playerArtist").textContent =
        (track.artists || [])
            .map(a => a.name)
            .join(", ");


    $("spotifyButton").style.display =
        currentSpotifyURL !== "#"
            ? "block"
            : "none";
}


function openSpotify() {

    if (currentSpotifyURL) {

        window.open(
            currentSpotifyURL,
            "_blank"
        );
    }
}


/* =========================================================
   PLAY TRACK
========================================================= */

async function playTrack(track) {

    if (!accessToken) {

        status(
            "Log in with Spotify first."
        );

        return;
    }


    if (!deviceId) {

        status(
            "Spotify player is still loading..."
        );

        return;
    }


    try {

        updatePlayerUI(track);


        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {

                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        uris: [
                            track.uri
                        ]

                    })

            }
        );


        status(
            "Playing " + track.name
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   PLAY PLAYLIST
========================================================= */

async function playPlaylist(id) {

    if (!deviceId) {

        status(
            "Spotify player is still loading..."
        );

        return;
    }


    try {

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {

                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        context_uri:
                            "spotify:playlist:" + id

                    })

            }
        );


        status(
            "Playing playlist."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   PLAYBACK CONTROLS
========================================================= */

async function togglePlayback() {

    if (!spotifyPlayer) {

        status(
            "Spotify player is not ready."
        );

        return;
    }


    try {

        await spotifyPlayer.togglePlay();

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


async function nextTrack() {

    try {

        await spotifyAPI(
            "/me/player/next",
            {
                method: "POST"
            }
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


async function previousTrack() {

    try {

        await spotifyAPI(
            "/me/player/previous",
            {
                method: "POST"
            }
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   SEARCH
========================================================= */

async function searchSpotify() {

    const query =
        $("search").value.trim();


    if (!query) {

        status(
            "Type something to search."
        );

        return;
    }


    if (!accessToken) {

        status(
            "Click Log in first."
        );

        return;
    }


    status(
        "Searching Spotify..."
    );


    $("heading").textContent =
        'Search: "' + query + '"';


    try {

        const data =
            await spotifyAPI(
                "/search?" +
                new URLSearchParams({

                    q: query,

                    type:
                        "track,artist,album,playlist",

                    limit:
                        "10",

                    market:
                        "US"

                })
            );


        renderSearch(data);


        status(
            "Spotify search results"
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearch(data) {

    let output = "";


    const sections = [

        [
            "Songs",
            data.tracks?.items || [],
            "track"
        ],

        [
            "Artists",
            data.artists?.items || [],
            "artist"
        ],

        [
            "Albums",
            data.albums?.items || [],
            "album"
        ],

        [
            "Playlists",
            data.playlists?.items || [],
            "playlist"
        ]

    ];


    for (
        const [name, items, type]
        of sections
    ) {

        if (!items.length) {
            continue;
        }


        output +=
            "<h2>" +
            name +
            "</h2>";


        output +=
            '<div class="grid">';


        for (
            const item
            of items
        ) {

            const img =
                image(item);


            let subtitle = "";


            if (type === "track") {

                subtitle =
                    (item.artists || [])
                        .map(a => a.name)
                        .join(", ");

            }

            else if (type === "artist") {

                subtitle =
                    "Artist";

            }

            else if (type === "album") {

                subtitle =
                    (item.artists || [])
                        .map(a => a.name)
                        .join(", ");

            }

            else {

                subtitle =
                    item.owner?.display_name
                        ? "By " +
                          item.owner.display_name
                        : "Spotify playlist";
            }


            output += `

                <div
                    class="card"
                    onclick="openItem(
                        '${type}',
                        '${escapeHTML(item.id)}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }


                    <div class="card-title">
                        ${escapeHTML(item.name)}
                    </div>


                    <div class="card-subtitle">
                        ${escapeHTML(subtitle)}
                    </div>

                </div>

            `;

        }


        output +=
            "</div>";

    }


    if (!output) {

        output =
            "<div class='status'>" +
            "No results found." +
            "</div>";
    }


    $("results").innerHTML =
        output;
}


/* =========================================================
   OPEN SEARCH RESULT
========================================================= */

async function openItem(type, id) {

    try {

        if (type === "track") {

            const track =
                await spotifyAPI(
                    "/tracks/" +
                    encodeURIComponent(id)
                );


            playTrack(track);

        }


        else if (type === "playlist") {

            await openPlaylist(id);

        }


        else if (type === "album") {

            const album =
                await spotifyAPI(
                    "/albums/" +
                    encodeURIComponent(id)
                );


            openAlbum(album);

        }


        else if (type === "artist") {

            const artist =
                await spotifyAPI(
                    "/artists/" +
                    encodeURIComponent(id)
                );


            openArtist(artist);

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   PLAYLIST
========================================================= */

async function openPlaylist(id) {

    try {

        const playlist =
            await spotifyAPI(
                "/playlists/" +
                encodeURIComponent(id) +
                "?market=US"
            );


        $("heading").textContent =
            playlist.name;


        const cover =
            image(playlist);


        let output = "";


        if (cover) {

            output += `

                <img
                    src="${escapeHTML(cover)}"
                    style="
                        width:200px;
                        height:200px;
                        object-fit:cover;
                        border-radius:8px;
                    "
                >

            `;

        }


        output +=
            "<h2>" +
            escapeHTML(playlist.name) +
            "</h2>";


        output += `

            <div class="playlist-actions">

                <button
                    class="playlist-button"
                    onclick="playPlaylist('${escapeHTML(playlist.id)}')"
                >
                    ▶ Play
                </button>

                <button
                    id="shuffleButton"
                    class="playlist-button shuffle-button"
                    onclick="shuffleCurrentPlaylist()"
                >
                    🔀 Shuffle
                </button>

            </div>

        `;


        /*
         * Spotify's newer playlist response uses:
         * playlist.items.items
         *
         * Older responses may use:
         * playlist.tracks.items
         */

        const rawItems =
            playlist.items?.items ||
            playlist.tracks?.items ||
            [];


        currentPlaylistTracks =
            rawItems
                .map(item =>
                    item.item ||
                    item.track
                )
                .filter(track =>
                    track &&
                    track.type === "track"
                );


        shuffledPlaylistTracks =
            [...currentPlaylistTracks];


        shuffleEnabled =
            false;


        output +=
            '<div id="playlistTracks">';


        for (
            const track
            of currentPlaylistTracks
        ) {

            output +=
                trackRow(track);

        }


        output +=
            "</div>";


        $("results").innerHTML =
            output;


        status(
            "Playlist loaded."
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


/* =========================================================
   TRACK ROW
========================================================= */

function trackRow(track) {

    return `

        <div class="track">

            <img
                src="${escapeHTML(image(track))}"
                alt=""
            >


            <div>

                <div class="card-title">
                    ${escapeHTML(track.name)}
                </div>


                <div class="card-subtitle">

                    ${
                        escapeHTML(
                            (track.artists || [])
                                .map(a => a.name)
                                .join(", ")
                        )
                    }

                </div>

            </div>


            <button
                class="play-button"
                onclick='playTrack(${JSON.stringify(track).replace(/'/g, "&#39;")})'
            >
                ▶
            </button>

        </div>

    `;
}


/* =========================================================
   SHUFFLE PLAYLIST
========================================================= */

function shuffleCurrentPlaylist() {

    if (!currentPlaylistTracks.length) {

        return;
    }


    /*
     * Make a fresh copy so the actual
     * Spotify playlist is never changed.
     */

    shuffledPlaylistTracks =
        [...currentPlaylistTracks];


    /*
     * Fisher-Yates shuffle.
     */

    for (
        let i = shuffledPlaylistTracks.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            shuffledPlaylistTracks[i],
            shuffledPlaylistTracks[j]
        ] =
        [
            shuffledPlaylistTracks[j],
            shuffledPlaylistTracks[i]
        ];
    }


    shuffleEnabled =
        true;


    renderPlaylistTracks(
        shuffledPlaylistTracks
    );


    const button =
        $("shuffleButton");


    if (button) {

        button.classList.add(
            "active"
        );

        button.textContent =
            "🔀 Shuffled";
    }


    status(
        "Playlist shuffled."
    );
}


/* =========================================================
   RENDER PLAYLIST TRACKS
========================================================= */

function renderPlaylistTracks(tracks) {

    const container =
        $("playlistTracks");


    if (!container) {
        return;
    }


    let output = "";


    for (
        const track
        of tracks
    ) {

        output +=
            trackRow(track);

    }


    container.innerHTML =
        output;
}


/* =========================================================
   ALBUM
========================================================= */

function openAlbum(album) {

    $("heading").textContent =
        album.name;


    let output =
        `<h2>${escapeHTML(album.name)}</h2>`;


    output +=
        `<div class="status">${
            escapeHTML(
                (album.artists || [])
                    .map(a => a.name)
                    .join(", ")
            )
        }</div>`;


    for (
        const track
        of album.tracks?.items || []
    ) {

        track.album =
            album;


        output +=
            trackRow(track);

    }


    $("results").innerHTML =
        output;


    status(
        "Album loaded."
    );
}
