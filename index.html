    function bytes(b64) {

        for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);

.kane-switch{position:relative;width:46px;height:26px;flex:none}.kane-switch input{display:none}.kane-slider{position:absolute;inset:0;background:#444;border-radius:20px;cursor:pointer}.kane-slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.kane-switch input:checked+.kane-slider{background:#1db954}.kane-switch input:checked+.kane-slider:before{transform:translateX(20px)}
#kane-reset-settings{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:#292929;color:#fff;cursor:pointer}
#kane-reset-settings:hover{background:#353535}
body.kane-settings-dimless #kane-settings-overlay{background:#0003}

<button id="kane-settings-button" aria-label="Open settings" title="Settings">⚙</button>
<div id="kane-settings-overlay" aria-hidden="true">
  <div id="kane-settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="kane-settings-head"><h2>Settings</h2><button id="kane-settings-close" aria-label="Close settings">×</button></div>
    <div class="kane-setting">
      <div class="kane-setting-label">Dark mode<small>Use the dark interface</small></div>
      <label class="kane-switch"><input id="kane-dark-toggle" type="checkbox" checked><span class="kane-slider"></span></label>
    </div>
    <div class="kane-setting">
      <div class="kane-setting-label">Dim background<small>Make the settings backdrop less dark</small></div>
      <label class="kane-switch"><input id="kane-dim-toggle" type="checkbox"><span class="kane-slider"></span></label>
    </div>
    <button id="kane-reset-settings">Reset settings</button>
  </div>
</div>
<script>
(function(){
  function ready(){
    var b=document.getElementById('kane-settings-button'),o=document.getElementById('kane-settings-overlay'),
        c=document.getElementById('kane-settings-close'),d=document.getElementById('kane-dark-toggle'),
        m=document.getElementById('kane-dim-toggle'),r=document.getElementById('kane-reset-settings');
    if(!b||!o)return;
    function open(){o.classList.add('open');o.setAttribute('aria-hidden','false')}
    function close(){o.classList.remove('open');o.setAttribute('aria-hidden','true')}
    b.onclick=open;c.onclick=close;o.onclick=function(e){if(e.target===o)close()};
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
    d.onchange=function(){document.documentElement.style.filter=d.checked?'':'brightness(.9)';try{localStorage.setItem('kaneDark',d.checked?'1':'0')}catch(e){}};
    m.onchange=function(){document.body.classList.toggle('kane-settings-dimless',m.checked);try{localStorage.setItem('kaneDim',m.checked?'1':'0')}catch(e){}};
    r.onclick=function(){d.checked=true;m.checked=false;document.documentElement.style.filter='';document.body.classList.remove('kane-settings-dimless');try{localStorage.removeItem('kaneDark');localStorage.removeItem('kaneDim')}catch(e){}};
    try{
      var dv=localStorage.getItem('kaneDark'),mv=localStorage.getItem('kaneDim');
      if(dv==='0'){d.checked=false;document.documentElement.style.filter='brightness(.9)'}
      if(mv==='1'){m.checked=true;document.body.classList.add('kane-settings-dimless')}
    }catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
})();
</script>`;
