                    { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
                    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
                );
            })
            .then(function(key) {
                return subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
            })
            .then(function(plain) {
                var html = new TextDecoder().decode(plain);
                document.open();
                document.write(html);
                document.close();
            })
            .catch(block);
    } catch (e) {
        block();
    }
})();
</script>
