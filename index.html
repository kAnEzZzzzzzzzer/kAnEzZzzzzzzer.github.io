<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Clone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    border: 0;
    cursor: pointer;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 240px;
    background: #000;
    padding: 24px 16px;
    flex-shrink: 0;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 30px;
}

.nav button {
    display: block;
    width: 100%;
    background: none;
    color: #b3b3b3;
    text-align: left;
    padding: 12px;
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 5px;
}

.nav button:hover {
    background: #1f1f1f;
    color: white;
}

.login-button {
    background: #1ed760;
    color: black;
    font-weight: bold;
    padding: 12px 20px;
    border-radius: 30px;
    width: 100%;
    margin-top: 20px;
}

.main {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 110px;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(18,18,18,.95);
}

.search {
    flex: 1;
    max-width: 650px;
}

.search input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 30px;
    border: none;
    outline: none;
    font-size: 16px;
}

.content {
    padding: 10px 30px;
}

h1 {
    font-size: 32px;
}

h2 {
    margin-top: 30px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
}

.card {
    background: #181818;
    padding: 16px;
    border-radius: 8px;
    transition: .2s;
    cursor: pointer;
    position: relative;
}

.card:hover {
    background: #282828;
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 12px;
}

.card-title {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: #b3b3b3;
    font-size: 14px;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.play-small {
    background: #1ed760;
    color: black;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    position: absolute;
    right: 20px;
    bottom: 65px;
    opacity: 0;
    transition: .2s;
}

.card:hover .play-small {
    opacity: 1;
}

.track {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 10px;
    border-radius: 6px;
}

.track:hover {
    background: #282828;
}

.track img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 4px;
}

.track-info {
    flex: 1;
    min-width: 0;
}

.track-name {
    font-weight: bold;
}

.track-artist {
    color: #b3b3b3;
    font-size: 14px;
    margin-top: 4px;
}

.track-play {
    background: #1ed760;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
}

.hero {
    display: flex;
    gap: 25px;
    align-items: center;
    padding: 30px;
    background: linear-gradient(#333, #181818);
}

.hero img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
}

.hero-info h1 {
    margin: 10px 0;
}

.hero-info p {
    color: #b3b3b3;
}

.green-button {
    background: #1ed760;
    color: black;
    padding: 13px 22px;
    border-radius: 25px;
    font-weight: bold;
    margin-top: 15px;
}

.player {
    position: fixed;
    bottom: 0;
    left: 240px;
    right: 0;
    height: 90px;
    background: #181818;
    border-top: 1px solid #282828;
    display: flex;
    align-items: center;
    padding: 12px 20px;
    z-index: 100;
}

.now-playing {
    width: 30%;
    display: flex;
    align-items: center;
    gap: 12px;
}

.now-playing img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 4px;
}

.now-playing-text {
    min-width: 0;
}

.now-playing-name {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.now-playing-artist {
    color: #b3b3b3;
    font-size: 13px;
}

.controls {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.controls button {
    background: none;
    color: white;
    font-size: 20px;
}

.controls .play {
    background: white;
    color: black;
    width: 38px;
    height: 38px;
    border-radius: 50%;
}

.volume {
    width: 180px;
}

.status {
    padding: 15px 20px;
    background: #242424;
    border-radius: 8px;
    margin: 15px 0;
    color: #b3b3b3;
}

.error {
    color: #ff6b6b;
}

.empty {
    color: #b3b3b3;
    padding: 30px 0;
}

@media(max-width: 700px) {
    .sidebar {
        width: 70px;
        padding: 15px 8px;
    }

    .logo {
        font-size: 18px;
    }

    .nav button {
        font-size: 0;
    }

    .player {
        left: 70px;
    }

    .now-playing {
        width: 40%;
    }

    .volume {
        display: none;
    }

    .hero {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">♫ Spotify</div>

        <div class="nav">
            <button onclick="showHome()">Home</button>
            <button onclick="focusSearch()">Search</button>
            <button onclick="loadMyPlaylists()">Your Library</button>
        </div>

        <button class="login-button" id="loginButton" onclick="login()">
            Log in with Spotify
        </button>
    </aside>

    <main class="main">

        <div class="topbar">
            <div class="search">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="What do you want to play?"
                    onkeydown="if(event.key === 'Enter') searchSpotify()"
                >
            </div>

            <button class="green-button" onclick="searchSpotify()">
                Search
            </button>
        </div>

        <div id="content" class="content">
            <h1>Welcome</h1>
            <p class="empty">
                Log in with Spotify to search and play music.
            </p>
        </div>

    </main>
</div>

<div class="player">

    <div class="now-playing">
        <img id="playerImage" src="" style="display:none">

        <div class="now-playing-text">
            <div id="playerName" class="now-playing-name">
                Nothing playing
            </div>

            <div id="playerArtist" class="now-playing-artist">
                Connect Spotify
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="previousTrack()">⏮</button>
        <button class="play" onclick="togglePlay()">▶</button>
        <button onclick="nextTrack()">⏭</button>
    </div>

    <input
        class="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
        oninput="setVolume(this.value)"
    >

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>
/* =========================
   SPOTIFY CONFIG
========================= */

const CLIENT_ID = "b70e6ed30b444ef3859d594d418c2aa1";

const REDIRECT_URI =
    "https://kanezzzzzzzzzer.github.io/kAnEzZzzzzzzer.github.io/";

const SCOPES = [
    "streaming",
    "user-read-private",
    "user-read-email",
    "playlist-read-private",
    "playlist-read-collaborative",
    "user-read-playback-state",
    "user-read-currently-playing",
    "user-modify-playback-state"
].join(" ");


/* =========================
   GLOBAL VARIABLES
========================= */

let accessToken = localStorage.getItem("spotify_access_token");
let refreshToken = localStorage.getItem("spotify_refresh_token");
let tokenExpiresAt =
    Number(localStorage.getItem("spotify_token_expires_at")) || 0;

let player = null;
let deviceId = null;

const trackCache = new Map();


/* =========================
   PKCE
========================= */

function randomString(length = 64) {
    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    const values = new Uint8Array(length);
    crypto.getRandomValues(values);

    for (let i = 0; i < length; i++) {
        result += chars[values[i] % chars.length];
    }

    return result;
}

async function sha256(plain) {
    const encoder = new TextEncoder();

    return crypto.subtle.digest(
        "SHA-256",
        encoder.encode(plain)
    );
}

function base64url(buffer) {
    return btoa(
        String.fromCharCode(...new Uint8Array(buffer))
    )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


/* =========================
   LOGIN
========================= */

async function login() {

    const verifier = randomString(128);

    const challenge = base64url(
        await sha256(verifier)
    );

    const state = randomString(32);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );

    const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        code_challenge_method: "S256",
        code_challenge: challenge,
        state: state,
        scope: SCOPES
    });

    window.location.href =
        "https://accounts.spotify.com/authorize?" +
        params.toString();
}


/* =========================
   CALLBACK
========================= */

async function handleCallback() {

    const params = new URLSearchParams(
        window.location.search
    );

    const code = params.get("code");
    const returnedState = params.get("state");
    const error = params.get("error");

    if (error) {
        showError(
            "Spotify login failed: " + error
        );
        return;
    }

    if (!code) return;

    const savedState =
        localStorage.getItem("spotify_state");

    if (returnedState !== savedState) {
        showError("Spotify security check failed.");
        return;
    }

    const verifier =
        localStorage.getItem("spotify_code_verifier");

    try {

        const response = await fetch(
            "https://accounts.spotify.com/api/token",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    client_id: CLIENT_ID,
                    grant_type:
                        "authorization_code",
                    code: code,
                    redirect_uri:
                        REDIRECT_URI,
                    code_verifier:
                        verifier
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error_description ||
                data.error ||
                "Could not log in."
            );
        }

        saveTokens(data);

        localStorage.removeItem("spotify_state");
        localStorage.removeItem("spotify_code_verifier");

        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        await initializePlayer();

    } catch (error) {

        showError(
            "Login error: " + error.message
        );
    }
}


/* =========================
   TOKEN MANAGEMENT
========================= */

function saveTokens(data) {

    accessToken = data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );

    if (data.refresh_token) {

        refreshToken = data.refresh_token;

        localStorage.setItem(
            "spotify_refresh_token",
            refreshToken
        );
    }

    tokenExpiresAt =
        Date.now() +
        ((data.expires_in || 3600) * 1000);

    localStorage.setItem(
        "spotify_token_expires_at",
        tokenExpiresAt
    );
}


async function refreshAccessToken() {

    if (!refreshToken) {
        throw new Error("No refresh token.");
    }

    const response = await fetch(
        "https://accounts.spotify.com/api/token",
        {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                client_id: CLIENT_ID,
                grant_type:
                    "refresh_token",
                refresh_token:
                    refreshToken
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error_description ||
            "Token refresh failed."
        );
    }

    saveTokens(data);

    return accessToken;
}


async function getValidToken() {

    if (!accessToken) {
        throw new Error("Not logged in.");
    }

    if (
        tokenExpiresAt &&
        Date.now() > tokenExpiresAt - 60000
    ) {
        await refreshAccessToken();
    }

    return accessToken;
}


/* =========================
   SPOTIFY API
========================= */

async function spotifyAPI(
    endpoint,
    options = {},
    retry = true
) {

    const token = await getValidToken();

    const response = await fetch(
        "https://api.spotify.com/v1" + endpoint,
        {
            ...options,
            headers: {
                Authorization:
                    "Bearer " + token,

                "Content-Type":
                    "application/json",

                ...(options.headers || {})
            }
        }
    );

    if (
        response.status === 401 &&
        retry &&
        refreshToken
    ) {

        await refreshAccessToken();

        return spotifyAPI(
            endpoint,
            options,
            false
        );
    }

    if (!response.ok) {

        let message =
            "Spotify API error " +
            response.status;

        try {

            const error =
                await response.json();

            if (error.error?.message) {
                message =
                    error.error.message;
            }

        } catch {}

        throw new Error(message);
    }

    if (response.status === 204) {
        return null;
    }

    return response.json();
}


/* =========================
   PLAYER
========================= */

window.onSpotifyWebPlaybackSDKReady =
    function () {

        if (accessToken) {
            initializePlayer();
        }
    };


async function initializePlayer() {

    if (!accessToken) return;

    if (player) return;

    player = new Spotify.Player({

        name: "My Spotify Clone",

        getOAuthToken: async callback => {

            try {

                const token =
                    await getValidToken();

                callback(token);

            } catch {

                callback(accessToken);
            }
        },

        volume: 0.7
    });


    player.addListener(
        "ready",
        async ({ device_id }) => {

            deviceId = device_id;

            console.log(
                "Spotify device ready:",
                deviceId
            );

            try {

                await spotifyAPI(
                    "/me/player",
                    {
                        method: "PUT",
                        body: JSON.stringify({
                            device_ids: [deviceId],
                            play: false
                        })
                    }
                );

            } catch (error) {

                console.error(
                    "Device transfer failed:",
                    error
                );
            }
        }
    );


    player.addListener(
        "not_ready",
        ({ device_id }) => {

            console.log(
                "Device went offline:",
                device_id
            );
        }
    );


    player.addListener(
        "player_state_changed",
        state => {

            if (!state) return;

            updatePlayerUI(state);
        }
    );


    player.addListener(
        "initialization_error",
        ({ message }) => {

            showError(
                "Player initialization error: " +
                message
            );
        }
    );


    player.addListener(
        "authentication_error",
        ({ message }) => {

            showError(
                "Spotify authentication error: " +
                message
            );
        }
    );


    player.addListener(
        "account_error",
        ({ message }) => {

            showError(
                "Spotify account error: " +
                message
            );
        }
    );


    player.connect();
}


/* =========================
   PLAY TRACK
========================= */

async function playTrack(track) {

    if (!track) return;

    if (!deviceId) {

        showError(
            "Spotify player is not ready yet. Wait a few seconds and try again."
        );

        return;
    }

    try {

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",
                body: JSON.stringify({
                    uris: [track.uri]
                })
            }
        );

        updateNowPlaying(track);

    } catch (error) {

        showError(
            "Could not play song: " +
            error.message +
            ". If you just updated the site, log out and log back in."
        );
    }
}


async function playTrackById(id) {

    const track = trackCache.get(id);

    if (track) {
        await playTrack(track);
        return;
    }

    try {

        const track =
            await spotifyAPI(
                "/tracks/" +
                encodeURIComponent(id)
            );

        trackCache.set(
            track.id,
            track
        );

        await playTrack(track);

    } catch (error) {

        showError(
            "Could not load song: " +
            error.message
        );
    }
}


/* =========================
   PLAY PLAYLIST
========================= */

async function playPlaylist(id) {

    if (!deviceId) {

        showError(
            "Spotify player is not ready yet."
        );

        return;
    }

    try {

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",
                body: JSON.stringify({
                    context_uri:
                        "spotify:playlist:" + id
                })
            }
        );

    } catch (error) {

        showError(
            "Could not play playlist: " +
            error.message +
            ". Try logging out and back in."
        );
    }
}


/* =========================
   PLAY ALBUM
========================= */

async function playAlbum(id) {

    if (!deviceId) {
        showError("Spotify player is not ready yet.");
        return;
    }

    try {

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",
                body: JSON.stringify({
                    context_uri:
                        "spotify:album:" + id
                })
            }
        );

    } catch (error) {

        showError(
            "Could not play album: " +
            error.message
        );
    }
}


/* =========================
   PLAYER CONTROLS
========================= */

async function togglePlay() {

    if (!player) return;

    await player.togglePlay();
}


async function nextTrack() {

    try {
        await spotifyAPI(
            "/me/player/next",
            {
                method: "POST"
            }
        );
    } catch (error) {
        console.error(error);
    }
}


async function previousTrack() {

    try {
        await spotifyAPI(
            "/me/player/previous",
            {
                method: "POST"
            }
        );
    } catch (error) {
        console.error(error);
    }
}


function setVolume(value) {

    if (player) {
        player.setVolume(
            Number(value)
        );
    }
}


/* =========================
   PLAYER UI
========================= */

function updateNowPlaying(track) {

    if (!track) return;

    document.getElementById(
        "playerName"
    ).textContent = track.name;

    document.getElementById(
        "playerArtist"
    ).textContent =
        track.artists
            ?.map(a => a.name)
            .join(", ") || "";

    const image =
        track.album?.images?.[0]?.url;

    const imageElement =
        document.getElementById(
            "playerImage"
        );

    if (image) {

        imageElement.src = image;
        imageElement.style.display =
            "block";
    }
}


function updatePlayerUI(state) {

    if (!state) return;

    const track =
        state.track_window.current_track;

    if (track) {
        updateNowPlaying(track);
    }

    const playButton =
        document.querySelector(
            ".controls .play"
        );

    if (playButton) {

        playButton.textContent =
            state.paused ? "▶" : "Ⅱ";
    }
}


/* =========================
   SEARCH
========================= */

async function searchSpotify() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value.trim();

    if (!query) return;

    const content =
        document.getElementById(
            "content"
        );

    content.innerHTML =
        "<h1>Searching...</h1>";

    try {

        const params =
            new URLSearchParams({
                q: query,
                type:
                    "track,artist,album,playlist",
                limit: "20",
                market: "US"
            });

        const data =
            await spotifyAPI(
                "/search?" +
                params.toString()
            );

        renderSearch(data);

    } catch (error) {

        showError(
            "Search failed: " +
            error.message
        );
    }
}


function renderSearch(data) {

    const content =
        document.getElementById(
            "content"
        );

    let html = "";

    /* SONGS */

    html += "<h1>Songs</h1>";

    if (
        data.tracks &&
        data.tracks.items.length
    ) {

        html += '<div class="track-list">';

        data.tracks.items.forEach(track => {

            trackCache.set(
                track.id,
                track
            );

            html += trackRowHTML(track);
        });

        html += "</div>";

    } else {

        html +=
            '<div class="empty">No songs found.</div>';
    }


    /* ARTISTS */

    if (
        data.artists &&
        data.artists.items.length
    ) {

        html += "<h2>Artists</h2>";
        html += '<div class="grid">';

        data.artists.items
            .slice(0, 8)
            .forEach(artist => {

                const image =
                    artist.images?.[0]?.url ||
                    "";

                html += `
                    <div class="card"
                         onclick="openArtist('${artist.id}')">

                        ${
                            image
                            ? `<img src="${image}">`
                            : ""
                        }

                        <div class="card-title">
                            ${escapeHTML(artist.name)}
                        </div>

                        <div class="card-subtitle">
                            Artist
                        </div>
                    </div>
                `;
            });

        html += "</div>";
    }


    /* ALBUMS */

    if (
        data.albums &&
        data.albums.items.length
    ) {

        html += "<h2>Albums</h2>";
        html += '<div class="grid">';

        data.albums.items
            .slice(0, 8)
            .forEach(album => {

                const image =
                    album.images?.[0]?.url ||
                    "";

                html += `
                    <div class="card"
                         onclick="openAlbum('${album.id}')">

                        ${
                            image
                            ? `<img src="${image}">`
                            : ""
                        }

                        <div class="card-title">
                            ${escapeHTML(album.name)}
                        </div>

                        <div class="card-subtitle">
                            ${escapeHTML(
                                album.artists
                                    .map(a => a.name)
                                    .join(", ")
                            )}
                        </div>
                    </div>
                `;
            });

        html += "</div>";
    }


    /* PLAYLISTS */

    if (
        data.playlists &&
        data.playlists.items.length
    ) {

        html += "<h2>Playlists</h2>";
        html += '<div class="grid">';

        data.playlists.items
            .slice(0, 8)
            .forEach(playlist => {

                if (!playlist) return;

                const image =
                    playlist.images?.[0]?.url ||
                    "";

                html += `
                    <div class="card"
                         onclick="openPlaylist('${playlist.id}')">

                        ${
                            image
                            ? `<img src="${image}">`
                            : ""
                        }

                        <div class="card-title">
                            ${escapeHTML(playlist.name)}
                        </div>

                        <div class="card-subtitle">
                            Playlist
                        </div>
                    </div>
                `;
            });

        html += "</div>";
    }


    content.innerHTML = html;
}


/* =========================
   TRACK ROW
========================= */

function trackRowHTML(track) {

    const image =
        track.album?.images?.[0]?.url ||
        "";

    return `
        <div class="track">

            ${
                image
                ? `<img src="${image}">`
                : ""
            }

            <div class="track-info">

                <div class="track-name">
                    ${escapeHTML(track.name)}
                </div>

                <div class="track-artist">
                    ${escapeHTML(
                        track.artists
                            ?.map(a => a.name)
                            .join(", ") || ""
                    )}
                </div>

            </div>

            <button
                class="track-play"
                onclick="playTrackById('${track.id}')">
                ▶
            </button>

        </div>
    `;
}


/* =========================
   PLAYLIST PAGE
========================= */

async function openPlaylist(id) {

    const content =
        document.getElementById(
            "content"
        );

    content.innerHTML =
        "<h1>Loading playlist...</h1>";

    try {

        const playlist =
            await spotifyAPI(
                "/playlists/" +
                encodeURIComponent(id) +
                "?market=US"
            );

        let html = `
            <div class="hero">

                ${
                    playlist.images?.[0]?.url
                    ? `<img src="${playlist.images[0].url}">`
                    : ""
                }

                <div class="hero-info">

                    <p>PLAYLIST</p>

                    <h1>
                        ${escapeHTML(
                            playlist.name
                        )}
                    </h1>

                    <p>
                        ${
                            playlist.description
                            ? escapeHTML(
                                stripHTML(
                                    playlist.description
                                )
                            )
                            : ""
                        }
                    </p>

                    <button
                        class="green-button"
                        onclick="playPlaylist('${playlist.id}')">
                        ▶ Play Playlist
                    </button>

                </div>
            </div>

            <div style="padding:20px">
        `;

        const tracks =
            playlist.tracks?.items || [];

        if (!tracks.length) {

            html +=
                '<div class="empty">This playlist has no playable songs.</div>';

        } else {

            tracks.forEach(item => {

                const track =
                    item.track;

                if (!track) return;

                trackCache.set(
                    track.id,
                    track
                );

                html +=
                    trackRowHTML(track);
            });
        }

        html += "</div>";

        content.innerHTML = html;

    } catch (error) {

        showError(
            "Could not load playlist: " +
            error.message
        );
    }
}

/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "spotify_access_token"
    );

    localStorage.removeItem(
        "spotify_refresh_token"
    );

    localStorage.removeItem(
        "spotify_token_expires_at"
    );

    localStorage.removeItem(
        "spotify_code_verifier"
    );

    localStorage.removeItem(
        "spotify_state"
    );

    accessToken = null;
    refreshToken = null;
    tokenExpiresAt = 0;

    if (player) {

        player.disconnect();
        player = null;
    }

    deviceId = null;

    location.reload();
}


/* =========================
   HELPERS
========================= */

function escapeHTML(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function stripHTML(text) {

    const div =
        document.createElement("div");

    div.innerHTML = text;

    return div.textContent || "";
}


function showError(message) {

    console.error(message);

    document.getElementById(
        "content"
    ).innerHTML = `
        <div class="status error">
            ${escapeHTML(message)}
        </div>

        <button
            class="green-button"
            onclick="showHome()">
            Go Home
        </button>
    `;
}

   STARTUP
========================= */

(async function () {

    await handleCallback();

    if (accessToken) {

        document.getElementById(
            "loginButton"
        ).textContent = "Log out";

        document.getElementById(
            "loginButton"
        ).onclick = logout;

        showHome();

        if (!player) {
            initializePlayer();
        }
    }

})();
