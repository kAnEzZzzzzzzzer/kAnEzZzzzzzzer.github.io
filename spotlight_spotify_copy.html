<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight — Music Player</title>
<style>
:root{
  --bg:#000; --panel:#121212; --panel2:#181818; --text:#fff; --muted:#b3b3b3;
  --green:#1ed760; --hover:#252525; --sidebar:240px; --player:90px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button,input{font:inherit}
.app{height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:1fr var(--player)}
.sidebar{background:#000;padding:24px 16px 12px;grid-row:1;display:flex;flex-direction:column;gap:22px}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px;padding:0 8px}
.logo span{color:var(--green)}
.nav button,.playlist-link{width:100%;border:0;background:none;color:var(--muted);text-align:left;padding:9px 8px;border-radius:5px;font-weight:700;cursor:pointer}
.nav button:hover,.nav button.active,.playlist-link:hover{color:#fff;background:#1a1a1a}
.nav-icon{display:inline-block;width:26px;font-size:19px}
.section-title{color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:0 8px 7px}
.playlists{overflow:auto;flex:1}
.playlist-link{font-weight:500;font-size:14px}
.main{grid-column:2;grid-row:1;background:linear-gradient(#202020 0,#121212 240px,#121212 100%);overflow:auto;padding-bottom:30px}
.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:12px 24px;position:sticky;top:0;z-index:5;background:rgba(18,18,18,.9);backdrop-filter:blur(10px)}
.back{border:0;background:#080808;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px}
.search{position:relative;max-width:520px;flex:1}
.search input{width:100%;background:#fff;color:#111;border:0;border-radius:22px;padding:12px 18px 12px 42px;outline:none}
.search:before{content:"⌕";position:absolute;left:16px;top:8px;color:#555;font-size:24px;z-index:1}
.content{padding:10px 28px 40px}
h1{font-size:32px;margin:20px 0}
h2{font-size:23px;margin:28px 0 15px}
.hero{display:flex;align-items:end;gap:22px;padding:20px 0 15px}
.cover{width:190px;height:190px;border-radius:7px;background:linear-gradient(135deg,#1ed760,#0a5);display:grid;place-items:center;font-size:72px;box-shadow:0 12px 35px #0008}
.hero small{font-weight:700}.hero h1{font-size:46px;margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
.card{background:#181818;padding:15px;border-radius:7px;cursor:pointer;transition:.15s}
.card:hover{background:#242424}
.art{width:100%;aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:42px;margin-bottom:12px;background:linear-gradient(135deg,#333,#111)}
.card-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{color:var(--muted);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-list{display:flex;flex-direction:column}
.track{display:grid;grid-template-columns:40px 1fr minmax(120px,.7fr) 70px;align-items:center;gap:12px;padding:9px 10px;border-radius:5px}
.track:hover{background:#242424}
.track-num{color:var(--muted);text-align:center}
.track-name{font-weight:600}
.track-artist{color:var(--muted);font-size:13px;margin-top:4px}
.track-album{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-time{color:var(--muted);font-size:13px;text-align:right}
.play-btn{border:0;background:var(--green);color:#000;width:45px;height:45px;border-radius:50%;font-size:20px;cursor:pointer;font-weight:bold}
.empty{color:var(--muted);padding:30px 0}
.player{grid-column:1/3;grid-row:2;background:#181818;border-top:1px solid #282828;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:10px 18px;gap:20px}
.now{display:flex;align-items:center;gap:12px;min-width:0}.mini-art{width:58px;height:58px;border-radius:3px;display:grid;place-items:center;background:#333;font-size:25px}
.now-text{min-width:0}.now-title,.now-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-artist{font-size:12px;color:var(--muted);margin-top:5px}
.controls{text-align:center}.buttons{display:flex;justify-content:center;align-items:center;gap:18px}.ctrl{border:0;background:none;color:#ddd;cursor:pointer;font-size:19px}.ctrl:hover{color:#fff}.progress{display:flex;align-items:center;gap:8px;margin-top:5px}.bar{height:4px;background:#555;border-radius:4px;flex:1;cursor:pointer}.fill{height:100%;background:#fff;border-radius:4px;width:0}
.volume{display:flex;justify-content:flex-end;align-items:center;gap:10px}.volume input{width:120px;accent-color:#fff}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20}.modal.open{display:grid}.modal-box{background:#282828;padding:25px;border-radius:10px;width:min(420px,90vw)}.modal-box h2{margin-top:0}.modal-box input{width:100%;padding:12px;border-radius:5px;border:0;margin:10px 0;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:10px}.green{background:var(--green);color:#000;border:0;border-radius:20px;padding:10px 18px;font-weight:700;cursor:pointer}.dark{background:#444;color:#fff;border:0;border-radius:20px;padding:10px 18px;cursor:pointer}
@media(max-width:800px){:root{--sidebar:75px}.sidebar{padding:18px 8px}.logo{font-size:0;text-align:center}.logo span{font-size:25px}.nav button{font-size:0;text-align:center}.nav-icon{font-size:20px}.section-title,.playlist-link{display:none}.player{grid-template-columns:1fr 1fr}.volume{display:none}.track{grid-template-columns:30px 1fr 60px}.track-album{display:none}.hero h1{font-size:32px}.cover{width:140px;height:140px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">Spot<span>light</span></div>
    <div class="nav">
      <button class="active" onclick="showHome()"><span class="nav-icon">⌂</span>Home</button>
      <button onclick="focusSearch()"><span class="nav-icon">⌕</span>Search</button>
      <button onclick="showLibrary()"><span class="nav-icon">▣</span>Your Library</button>
    </div>
    <div>
      <p class="section-title">Playlists</p>
      <button class="playlist-link" onclick="openCreate()">＋ Create playlist</button>
      <div class="playlists" id="sidebarPlaylists"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="back" onclick="history.back()">‹</button>
      <button class="back" onclick="history.forward()">›</button>
      <div class="search"><input id="search" placeholder="What do you want to play?" oninput="searchAll(this.value)"></div>
    </div>
    <div class="content" id="content"></div>
  </main>

  <footer class="player">
    <div class="now">
      <div class="mini-art" id="miniArt">♫</div>
      <div class="now-text"><div class="now-title" id="nowTitle">Nothing playing</div><div class="now-artist" id="nowArtist">Choose a song</div></div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button class="ctrl" onclick="prevTrack()">↶</button>
        <button class="play-btn" id="mainPlay" onclick="togglePlay()">▶</button>
        <button class="ctrl" onclick="nextTrack()">↷</button>
      </div>
      <div class="progress"><span id="currentTime">0:00</span><div class="bar" onclick="seek(event)"><div class="fill" id="fill"></div></div><span id="duration">0:00</span></div>
    </div>
    <div class="volume">🔊 <input type="range" min="0" max="100" value="80" oninput="setVolume(this.value)"></div>
  </footer>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Create playlist</h2>
    <input id="playlistName" placeholder="My playlist">
    <div class="modal-actions"><button class="dark" onclick="closeModal()">Cancel</button><button class="green" onclick="createPlaylist()">Create</button></div>
  </div>
</div>

<script>
const songs = [
 {id:1,title:"Midnight Drive",artist:"Nova Lane",album:"After Hours",genre:"Pop",emoji:"🌙",duration:214},
 {id:2,title:"Electric Skies",artist:"The Satellites",album:"Neon Summer",genre:"Electronic",emoji:"⚡",duration:188},
 {id:3,title:"Paper Planes",artist:"Milo Grey",album:"Small Worlds",genre:"Indie",emoji:"✈️",duration:203},
 {id:4,title:"Golden Hour",artist:"Sienna Ray",album:"Sunset Stories",genre:"Pop",emoji:"🌅",duration:231},
 {id:5,title:"Ocean Lights",artist:"Coastline",album:"Blue Room",genre:"Chill",emoji:"🌊",duration:196},
 {id:6,title:"Static Hearts",artist:"Violet Echo",album:"Frequency",genre:"Alternative",emoji:"💜",duration:220},
 {id:7,title:"City Rain",artist:"Northbound",album:"Windows Down",genre:"Indie",emoji:"🌧️",duration:205},
 {id:8,title:"Dream Machine",artist:"Pixel Youth",album:"Arcade Love",genre:"Electronic",emoji:"🎮",duration:176},
 {id:9,title:"Starlight",artist:"Luna Park",album:"Constellations",genre:"Pop",emoji:"⭐",duration:240},
 {id:10,title:"Runaway Train",artist:"Westline",album:"Open Road",genre:"Rock",emoji:"🚂",duration:212},
 {id:11,title:"Cloud Nine",artist:"Maya Bloom",album:"Soft Focus",genre:"Chill",emoji:"☁️",duration:191},
 {id:12,title:"Afterglow",artist:"Solaris",album:"Last Light",genre:"Electronic",emoji:"✨",duration:227}
];

let playlists = JSON.parse(localStorage.getItem("spotlight_playlists") || "[]");
let currentIndex = -1, playing = false, elapsed = 0, timer = null, volume = .8;

const $ = id => document.getElementById(id);
function save(){localStorage.setItem("spotlight_playlists",JSON.stringify(playlists))}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function art(s){return `<div class="art">${s.emoji}</div>`}
function card(s){return `<div class="card" onclick="playSong(${s.id})">${art(s)}<div class="card-title">${s.title}</div><div class="card-sub">${s.artist}</div></div>`}
function track(s,i){return `<div class="track"><div class="track-num">${i+1}</div><div onclick="playSong(${s.id})" style="cursor:pointer"><div class="track-name">${s.title}</div><div class="track-artist">${s.artist}</div></div><div class="track-album">${s.album}</div><div class="track-time">${fmt(s.duration)}</div></div>`}

function renderSidebar(){
 $("sidebarPlaylists").innerHTML=playlists.length ? playlists.map(p=>`<button class="playlist-link" onclick="openPlaylist(${p.id})">♫ ${p.name}</button>`).join("") : `<div style="color:#777;font-size:13px;padding:8px">Your playlists will appear here.</div>`;
}
function showHome(){
 $("search").value="";
 $("content").innerHTML=`<section class="hero"><div class="cover">♫</div><div><small>SPOTLIGHT MUSIC</small><h1>Good evening</h1><div style="color:#aaa">Search songs, artists, albums and playlists.</div></div></section>
<h2>Made for you</h2><div class="grid">${songs.slice(0,6).map(card).join("")}</div>
<h2>Popular right now</h2><div class="track-list">${songs.slice(0,8).map(track).join("")}</div>`;
 renderSidebar();
}
function showLibrary(){
 $("content").innerHTML=`<h1>Your Library</h1><h2>Playlists</h2><div class="grid">${playlists.length ? playlists.map(p=>`<div class="card" onclick="openPlaylist(${p.id})"><div class="art">♫</div><div class="card-title">${p.name}</div><div class="card-sub">${p.songIds.length} songs</div></div>`).join("") : `<div class="empty">No playlists yet. Create one from the sidebar.</div>`}</div>`;
}
function searchAll(q){
 q=q.trim().toLowerCase();
 if(!q){showHome();return}
 const ss=songs.filter(s=>`${s.title} ${s.artist} ${s.album} ${s.genre}`.toLowerCase().includes(q));
 const ps=playlists.filter(p=>p.name.toLowerCase().includes(q));
 $("content").innerHTML=`<h1>Search results</h1>
 ${ps.length?`<h2>Playlists</h2><div class="grid">${ps.map(p=>`<div class="card" onclick="openPlaylist(${p.id})"><div class="art">♫</div><div class="card-title">${p.name}</div><div class="card-sub">${p.songIds.length} songs</div></div>`).join("")}</div>`:""}
 <h2>Songs</h2>${ss.length?`<div class="track-list">${ss.map(track).join("")}</div>`:`<div class="empty">No songs found for “${q}”.</div>`}`;
}
function focusSearch(){$("search").focus()}
function playSong(id){
 const i=songs.findIndex(s=>s.id===id); if(i<0)return;
 currentIndex=i; elapsed=0; playing=true; updatePlayer(); startTimer();
}
function updatePlayer(){
 const s=songs[currentIndex]; if(!s)return;
 $("nowTitle").textContent=s.title; $("nowArtist").textContent=s.artist; $("miniArt").textContent=s.emoji;
 $("duration").textContent=fmt(s.duration); $("mainPlay").textContent=playing?"❚❚":"▶"; updateProgress();
}
function startTimer(){clearInterval(timer); timer=setInterval(()=>{if(!playing||currentIndex<0)return; elapsed+=1;if(elapsed>=songs[currentIndex].duration){nextTrack();}updateProgress()},1000)}
function updateProgress(){
 if(currentIndex<0)return;
 const s=songs[currentIndex]; $("currentTime").textContent=fmt(elapsed); $("fill").style.width=(elapsed/s.duration*100)+"%";
}
function togglePlay(){if(currentIndex<0){playSong(songs[0].id);return}playing=!playing;updatePlayer()}
function nextTrack(){if(currentIndex<0)return;currentIndex=(currentIndex+1)%songs.length;elapsed=0;playing=true;updatePlayer()}
function prevTrack(){if(currentIndex<0)return;if(elapsed>4){elapsed=0}else{currentIndex=(currentIndex-1+songs.length)%songs.length;elapsed=0}updatePlayer()}
function seek(e){if(currentIndex<0)return;const r=e.currentTarget.getBoundingClientRect();elapsed=((e.clientX-r.left)/r.width)*songs[currentIndex].duration;updateProgress()}
function setVolume(v){volume=v/100}
function openCreate(){$("modal").classList.add("open");$("playlistName").focus()}
function closeModal(){$("modal").classList.remove("open")}
function createPlaylist(){
 const name=$("playlistName").value.trim(); if(!name)return;
 playlists.push({id:Date.now(),name,songIds:[]});save();$("playlistName").value="";closeModal();renderSidebar();showLibrary();
}
function openPlaylist(id){
 const p=playlists.find(x=>x.id===id);if(!p)return;
 const ss=p.songIds.map(id=>songs.find(s=>s.id===id)).filter(Boolean);
 $("content").innerHTML=`<section class="hero"><div class="cover">♫</div><div><small>PLAYLIST</small><h1>${p.name}</h1><div style="color:#aaa">${ss.length} songs</div></div></section>
 <div style="display:flex;gap:10px;margin-bottom:15px"><button class="play-btn" onclick="${ss.length?`playSong(${ss[0].id})`:""}">▶</button><button class="dark" onclick="addToPlaylist(${p.id})">＋ Add songs</button></div>
 ${ss.length?`<div class="track-list">${ss.map(track).join("")}</div>`:`<div class="empty">This playlist is empty. Add some songs.</div>`}`;
}
function addToPlaylist(pid){
 const p=playlists.find(x=>x.id===pid);if(!p)return;
 const remaining=songs.filter(s=>!p.songIds.includes(s.id));
 if(!remaining.length){alert("All demo songs are already in this playlist.");return}
 const choices=remaining.map(s=>`${s.id}: ${s.title} — ${s.artist}`).join("\\n");
 const answer=prompt("Type the song number to add:\\n\\n"+choices);
 const id=Number(answer);
 if(remaining.some(s=>s.id===id)){p.songIds.push(id);save();openPlaylist(pid);renderSidebar()}
}
showHome();startTimer();
</script>
</body>
</html>
