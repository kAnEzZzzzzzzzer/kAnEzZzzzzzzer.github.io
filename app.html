<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify by Kane</title>



<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
}

/* Sidebar */

.sidebar {
    background: #000;
    padding: 25px 15px;
    border-right: 1px solid #222;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin: 10px;
    margin-bottom: 35px;
}

.nav-button.logged-in-nav {
    display: none;
}

.nav-button.youtube-only-nav {
    display: none;
}

.nav-button {
    width: 100%;
    padding: 13px;
    margin-bottom: 5px;
    border: none;
    background: transparent;
    color: #aaa;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.nav-button:hover,
.nav-button.active {
    background: #1f1f1f;
    color: white;
}

.dj-nav {
    margin-top: 18px;
    color: white;
}

.dj-nav:hover {
    background: #1f1f1f;
    color: white;
}

/* Main page */

main {
    min-width: 0;
    background: linear-gradient(#242424, #121212 350px);
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 12px;
    padding: 15px 25px;
    background: rgba(18,18,18,.95);
    backdrop-filter: blur(10px);
}

.search {
    flex: 1;
    max-width: 650px;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

.search-button,
.login-button {
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

.search-button {
    background: #1ed760;
    color: black;
}

.login-button {
    background: white;
    color: black;
}

.content {
    padding: 30px 25px 130px;
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

h2 {
    margin-top: 35px;
}

/* Cards */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
}

.card {
    background: rgba(255,255,255,.07);
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    background: rgba(255,255,255,.15);
    transform: translateY(-2px);
}

.card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    background: #282828;
}

.card-title {
    margin-top: 10px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Track rows */

.track {
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 6px;
}

.track:hover {
    background: rgba(255,255,255,.1);
}

.track img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}

.play-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #1ed760;
    cursor: pointer;
    font-weight: bold;
}

.play-button:hover {
    transform: scale(1.05);
}

/* Status message */

.status {
    color: #aaa;
    margin-bottom: 20px;
}

.error {
    color: #ff8888;
    background: #351515;
    padding: 15px;
    border-radius: 8px;
}

/* Hero */

.hero {
    display: flex;
    gap: 20px;
    align-items: center;
    margin: 15px 0 25px;
}

.hero img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
}

/* DJ X */

.dj-page {
    background: rgba(255,255,255,.07);
    border-radius: 15px;
    padding: 35px;
    margin-top: 20px;
}

.dj-title {
    font-size: 55px;
    font-weight: 800;
    margin: 0 0 10px;
}

.dj-description {
    color: #bbb;
    font-size: 17px;
    margin-bottom: 25px;
}

.dj-button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    background: #1ed760;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-right: 8px;
}

.dj-button:hover {
    background: #1fdf64;
}

.dj-skip {
    border: 1px solid #777;
    background: transparent;
    color: white;
}

.dj-skip:hover {
    background: rgba(255,255,255,.1);
}

.search-button.youtube-mode {
    background: #ff3b3b;
    color: white;
}

.search-button.google-mode {
    background: #4285F4;
    color: white;
}

/* Google results */

.google-result {
    padding: 14px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
}

.google-result:hover {
    background: rgba(255,255,255,.07);
}

.google-result-url {
    color: #8ab4f8;
    font-size: 13px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.google-result-title {
    font-size: 18px;
    color: #4285F4;
    margin-bottom: 4px;
}

.google-result-title:hover {
    text-decoration: underline;
}

.google-result-snippet {
    color: #ccc;
    font-size: 14px;
    line-height: 1.4;
}

/* Mode dropdown (replaces old mode-toggle-button) */

.mode-dropdown {
    position: relative;
}

.mode-dropdown-button {
    background: white;
    color: black;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
}

.mode-dropdown-button:hover {
    background: #eee;
}

.mode-dropdown-caret {
    font-size: 10px;
    line-height: 1;
}

.mode-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #282828;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    padding: 6px;
    min-width: 170px;
    z-index: 30;
}

.mode-dropdown-menu.open {
    display: block;
}

.mode-dropdown-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.mode-dropdown-item:hover {
    background: #3a3a3a;
}

.mode-dropdown-check {
    color: #1ed760;
    font-weight: bold;
    visibility: hidden;
}

.mode-dropdown-item.active .mode-dropdown-check {
    visibility: visible;
}

/* Shorts Feed */

.shorts-feed {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-height: 75vh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    padding: 10px 0 20px;
}

.shorts-item {
    position: relative;
    scroll-snap-align: center;
    flex-shrink: 0;
    width: 260px;
    aspect-ratio: 9/16;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
}

.shorts-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.shorts-item iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.shorts-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    color: white;
    font-size: 13px;
    pointer-events: none;
}

.shorts-caption .card-subtitle {
    margin-top: 2px;
}

/* Currently Playing Bar */

.player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 82px;
    background: #181818;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    z-index: 20;
}

.player img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 5px;
}

.player-info {
    min-width: 180px;
    max-width: 250px;
}

.player-title {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

.control-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-button:hover {
    background: #333;
}

.play-control {
    background: white;
    color: black;
}

.play-control:hover {
    background: #ddd;
}

.spotify-button {
    background: #1ed760;
    color: black;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* Mobile */

@media(max-width:700px) {

    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .content {
        padding: 20px 15px 130px;
    }

    .topbar {
        padding: 12px;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
    }

    .hero img {
        width: 140px;
        height: 140px;
    }

    .dj-page {
        padding: 25px;
    }

    .dj-title {
        font-size: 40px;
    }

    .player-info {
        min-width: 100px;
    }

    .spotify-button {
        display: none;
    }

}
</style>

</head>

<script>
const _0xUnlocked = true;
/* Spotify config */

const CLIENT_ID =
    "b70e6ed30b444ef3859d594d418c2aa1";

const REDIRECT_URI =

/* YouTube config */

/* Tavily Search API config (replaces Google Custom Search) */
const TAVILY_API_KEY =
    "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";

const SCOPES =
    "user-read-private " +
    "user-read-email " +
    "playlist-read-private " +
    "playlist-read-collaborative " +
    "streaming " +
    "user-read-playback-state " +

let accessToken =
    localStorage.getItem("spotify_access_token") || "";

let refreshToken =
    localStorage.getItem("spotify_refresh_token") || "";

let player = null;

let deviceId = null;

/* Helpers */

function $(id) {
    return document.getElementById(id);
}

const PLAY_ICON_SVG =
    '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

const PAUSE_ICON_SVG =
    '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

function updateLoggedInNavigation() {
    document.querySelectorAll('.logged-in-nav').forEach(button => {
        const isSpotifyOnly = button.classList.contains('spotify-only-nav');
        if (isSpotifyOnly && currentMode !== 'spotify') {

            return;

        button.style.display = accessToken ? 'block' : 'none';

    document.querySelectorAll('.youtube-only-nav').forEach(button => {

    });

    document.querySelectorAll('.google-only-nav').forEach(button => {
        button.style.display = currentMode === 'google' ? 'block' : 'none';
    });
}


function status(text, error = false) {

    $("status").textContent = text;

    $("status").className =

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function image(item) {

    if (!item) {
        return "";
    }

    return (
        item?.images?.[0]?.url ||
        item?.album?.images?.[0]?.url ||
        ""
    );
}


function spotifyURL(item) {

    return item?.external_urls?.spotify || "#";
}


function wait(ms) {

    return new Promise(resolve =>

    );
}


/* PKCE */

function randomString(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    return [...array]
        .map(byte =>
            characters[byte % characters.length]
        )
        .join("");
}


async function sha256Base64URL(value) {

    const data =
        new TextEncoder().encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(digest)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* Log in */

async function login() {

    const verifier =
        randomString();

    const challenge =
        await sha256Base64URL(verifier);

    const state =
        randomString(32);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    localStorage.setItem(
        "spotify_state",
        state
    );

    const url =
        new URL(
            "https://accounts.spotify.com/authorize"
        );

    url.search =
        new URLSearchParams({

            response_type: "code",

            client_id: CLIENT_ID,

            scope: SCOPES,

            redirect_uri: REDIRECT_URI,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });

    window.location.href =
        url.toString();
}


/* Login callback */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const state =
        params.get("state");

    const error =
        params.get("error");

    if (error) {

        throw new Error(
            "Spotify login failed: " + error
        );
    }

    if (!code) {
        return false;
    }

    if (
        state !==
        localStorage.getItem("spotify_state")
    ) {

        throw new Error(
            "Spotify security check failed."
        );
    }

    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    new URLSearchParams({

                        client_id:
                            CLIENT_ID,

                        grant_type:
                            "authorization_code",

                        code:
                            code,

                        redirect_uri:
                            REDIRECT_URI,

                        code_verifier:
                            verifier

                    })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Could not get Spotify access token."
        );
    }

    accessToken =
        data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );

    if (data.refresh_token) {

        refreshToken =
            data.refresh_token;

        localStorage.setItem(
            "spotify_refresh_token",
            refreshToken
        );
    }

    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );

    return true;
}


/* Spotify API */

async function spotifyAPI(
    endpoint,
    options = {}
) {

    if (!accessToken) {

        throw new Error(
            "Please log in with Spotify first."
        );
    }

    const headers = {

        Authorization:
            "Bearer " + accessToken

    };

    if (options.body) {

        headers["Content-Type"] =
            "application/json";
    }

    const response =
        await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            {
                ...options,

                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

    const data =
        await response
            .json()
            .catch(() => ({}));

    if (!response.ok) {

        if (response.status === 401) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            accessToken = "";

        }

        throw new Error(
            data.error?.message ||
            "Spotify API error: " +
            response.status
        );
    }

    return data;
}


/* Web playback SDK */

window.onSpotifyWebPlaybackSDKReady =
    function() {

        if (!accessToken) {
            return;
        }

        player =
            new Spotify.Player({

                name:
                    "Spotify Clone",

                getOAuthToken:
                    callback => {

                        callback(
                            accessToken
                        );

                    },

                volume:
                    0.5

            });

        player.addListener(
            "ready",
            function({ device_id }) {

                deviceId =
                    device_id;

                playerReady =
                    true;

                console.log(
                    "Spotify player ready:",
                    deviceId
                );

                status(
                    "Spotify player connected."
                );

            }
        );

        player.addListener(
            "not_ready",
            function({ device_id }) {

                console.log(
                    "Device went offline:",
                    device_id
                );

                playerReady =
                    false;
            }
        );

        player.addListener(
            "player_state_changed",
            function(state) {

                if (!state) {
                    return;
                }

                const track =
                    state.track_window
                        ?.current_track;

                if (!track) {
                    return;
                }

                const artists =
                    (track.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ") ||
                    "Unknown artist";

                $("playerTitle").textContent =
                    track.name || "Unknown track";

                $("playerArtist").textContent =
                    artists;

                if (
                    track.album?.images?.[0]?.url
                ) {

                    $("playerImage").src =
                        track.album.images[0].url;

                }

                currentSpotifyURL =
                    track.external_urls?.spotify ||
                    "";

                $("spotifyButton").style.display =
                    currentSpotifyURL
                        ? "block"
                        : "none";

                $("playButton").innerHTML =
                    state.paused
                        ? PLAY_ICON_SVG
                        : PAUSE_ICON_SVG;

                status(
                    (state.paused ? "Paused: " : "Now playing: ") +
                    (track.name || "Unknown track") +
                    " — " +
                    artists
                );

            }
        );

        player.addListener(
            "initialization_error",
            function({ message }) {

                status(
                    "Player initialization error: " +
                    message,
                    true
                );

            }
        );

        player.addListener(
            "authentication_error",
            function({ message }) {

                status(
                    "Spotify authentication error: " +
                    message,
                    true
                );

            }
        );

        player.addListener(
            "account_error",
            function({ message }) {

                status(
                    "Spotify account error: " +
                    message,
                    true
                );

            }
        );

        player.connect();

    };


/* Play track */

async function playTrack(track) {

    if (!track) {
        return;
    }

    if (!deviceId) {

        alert(
            "Spotify player is not ready yet. " +
            "Please wait a moment after logging in."
        );

        return;
    }

    try {

        djMode = false;

        await spotifyAPI(
            "/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {
                method: "PUT",

                body: JSON.stringify({

                    uris: [
                        track.uri
                    ]

                })

            }
        );

        const artists =
            (track.artists || [])
                .filter(Boolean)
                .map(a => a?.name)
                .filter(Boolean)
                .join(", ") ||
            "Unknown artist";

        $("playerImage").src =
            image(track);

        $("playerTitle").textContent =
            track.name || "Unknown track";

        $("playerArtist").textContent =
            artists;

        currentSpotifyURL =
            spotifyURL(track);

        $("spotifyButton").style.display =
            currentSpotifyURL !== "#"
                ? "block"
                : "none";

        status(
            "Now playing: " +
            (track.name || "Unknown track") +
            " — " +
            artists
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}

/* Search results */
   

function renderSearch(data) {

    let output = "";

    const sections = [

        [
            "Songs",
            data?.tracks?.items || [],
            "track"
        ],

        [
            "Artists",
            data?.artists?.items || [],
            "artist"
        ],

        [
            "Albums",
            data?.albums?.items || [],
            "album"
        ],

        [
            "Playlists",
            data?.playlists?.items || [],
            "playlist"
        ]

    ];

    for (
        const [name, rawItems, type]
        of sections
    ) {

        const items =
            Array.isArray(rawItems)
                ? rawItems.filter(item => item != null)
                : [];

        if (!items.length) {
            continue;
        }

        output +=
            "<h2>" +
            escapeHTML(name) +
            "</h2>";

        output +=
            '<div class="grid">';

        for (
            const item
            of items
        ) {

            if (!item) {
                continue;
            }

            const itemID =
                item.id || "";

            const itemName =
                item.name || "Unknown";

            const img =
                image(item);

            let subtitle =
                "";

            if (type === "track") {

                subtitle =
                    (item.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ");

            }

            else if (type === "artist") {

                subtitle =
                    "Artist";

            }

            else if (type === "album") {

                subtitle =
                    (item.artists || [])
                        .filter(Boolean)
                        .map(a => a?.name)
                        .filter(Boolean)
                        .join(", ");

            }

            else if (type === "playlist") {

                const ownerName =
                    item?.owner?.display_name ||
                    item?.owner?.name ||
                    "";

                subtitle =
                    ownerName
                        ? "By " + ownerName
                        : "Spotify playlist";
            }

            output += `

                <div
                    class="card"
                    onclick="openItem(
                        '${escapeHTML(type)}',
                        '${escapeHTML(itemID)}'
                    )"
                >

                    ${
                        img

                        ?

                        `<img
                            src="${escapeHTML(img)}"
                            alt=""
                        >`

                        :

                        `<div
                            style="
                                aspect-ratio:1;
                                background:#282828;
                                border-radius:6px;
                            "
                        ></div>`
                    }

                    <div class="card-title">
                        ${escapeHTML(itemName)}
                    </div>

                    <div class="card-subtitle">
                        ${escapeHTML(subtitle)}
                    </div>

                </div>

            `;

        }

        output +=
            "</div>";

    }

    if (!output) {

        output =
            "<div class='status'>" +
            "No results found." +
            "</div>";

    }

    $("results").innerHTML =
        output;
}


/* Open result */

async function openItem(type, id) {

    if (!id) {
        return;
    }

    try {

        if (type === "track") {

            const track =
                await spotifyAPI(
                    "/tracks/" +
                    encodeURIComponent(id)
                );

            await playTrack(track);

        }

        else if (type === "playlist") {

            await openPlaylist(id);

        }

        else if (type === "album") {

            const album =
                await spotifyAPI(
                    "/albums/" +
                    encodeURIComponent(id)
                );

            openAlbum(album);

        }

        else if (type === "artist") {

            const artist =
                await spotifyAPI(
                    "/artists/" +
                    encodeURIComponent(id)
                );

            openArtist(artist);

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}

/* YouTube */

function extractYouTubeID(raw) {

    if (!raw) {
        return "";
    }

    const value = raw.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
        return value;
    }

    try {

        const url = new URL(value);

        if (url.hostname.includes("youtu.be")) {
            return url.pathname.replace("/", "").slice(0, 11);
        }

        if (url.hostname.includes("youtube.com")) {

            if (url.pathname.startsWith("/watch")) {
                return url.searchParams.get("v") || "";
            }

            if (url.pathname.startsWith("/embed/")) {
                return url.pathname.split("/embed/")[1]?.slice(0, 11) || "";
            }

            if (url.pathname.startsWith("/shorts/")) {
                return url.pathname.split("/shorts/")[1]?.slice(0, 11) || "";
            }

        }

    }
    catch (e) {
    }

    return "";
}

/* SafeSearch toggle */
function toggleSafeSearch() {

    $("safeSearchButton").textContent =

function googleEmptyStateHTML() {

        currentGoogleTab === "image"
            ? "Search for images, then press Search."
            : "Search Google, right from here.";

    return `
        <div class="dj-page" style="text-align:center;">
            <div style="font-size:50px; margin-bottom:15px;">🔍</div>
            <div class="dj-description" style="margin-bottom:0;">
                ${escapeHTML(message)}
            </div>
        </div>
    `;
}


async function searchGoogle(query) {

    if (
        !TAVILY_API_KEY ||
        TAVILY_API_KEY === "YOUR_TAVILY_API_KEY_HERE"
    ) {

        status(
            "Search isn't set up yet. Add your TAVILY_API_KEY in the code.",
            true
        );

        return;
    }

    status(
        "Searching..."
    );

    $("heading").textContent =
        'Google search' +
        (currentGoogleTab === "image" ? " (Images)" : "") +
        ': "' + query + '"';

    try {

        const body = {

            query:
                query,

            search_depth:
                "basic",

            max_results:
                10,

            include_images:
                currentGoogleTab === "image"

        };

        const response =
            await fetch(
                "https://api.tavily.com/search",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + TAVILY_API_KEY
                    },
                    body: JSON.stringify(body)
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.detail ||
                "Tavily API error: " +
                response.status
            );
        }

        if (currentGoogleTab === "image") {

            const images =
                (data.images || [])
                    .filter(Boolean);

            renderGoogleResults(images);

            status(
                images.length
                    ? "Image results"
                    : "No results found."
            );

        } else {

            const items =
                (data.results || [])
                    .filter(Boolean);

            renderGoogleResults(items);

            status(
                items.length
                    ? "Search results"
                    : "No results found."
            );

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


function renderGoogleResults(items) {

    if (currentGoogleTab === "image") {

        renderGoogleImageResults(items);

        return;
    }

    if (!items.length) {

        $("results").innerHTML =
            "<div class='status'>No results found.</div>";

        return;
    }

    let output =
        '<div>';

    for (
        const item
        of items
    ) {

        const link =
            item.url || "#";

        const title =
            item.title || "Untitled";

        const snippet =
            item.content || "";

        let displayLink =
            link;

        try {
            displayLink =
                new URL(link).hostname;
        } catch (e) {
        }

        output += `

            <div
                class="google-result"
                onclick="window.open('${escapeHTML(link)}', '_blank')"
            >

                <div class="google-result-url">
                    ${escapeHTML(displayLink)}
                </div>

                <div class="google-result-title">
                    ${escapeHTML(title)}
                </div>

                <div class="google-result-snippet">
                    ${escapeHTML(snippet)}
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


function renderGoogleImageResults(items) {

    if (!items.length) {

        $("results").innerHTML =
            "<div class='status'>No results found.</div>";

        return;
    }

    let output =
        '<div class="grid">';

    for (
        const item
        of items
    ) {

        // Tavily returns either plain URL strings or {url, description}
        // objects depending on settings, so handle both.
        const isPlainString =
            typeof item === "string";

        const imgURL =
            isPlainString
                ? item
                : (item.url || "");

        const pageURL =
            imgURL || "#";

        const title =
            (!isPlainString && item.description) || "Image";

        output += `

            <div
                class="card"
                onclick="window.open('${escapeHTML(pageURL)}', '_blank')"
            >

                ${
                    imgURL

                    ?

                    `<img
                        src="${escapeHTML(imgURL)}"
                        alt=""
                    >`

                    :

                    `<div
                        style="
                            aspect-ratio:1;
                            background:#282828;
                            border-radius:6px;
                        "
                    ></div>`
                }

                <div class="card-title">
                    ${escapeHTML(title)}
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


/* Spotify mode */

    $("sidebarLogo").textContent =

/* Search button */
function handleSearchButton() {

    if (currentMode === "google") {

        const raw =
            $("search")?.value.trim() || "";

        if (!raw) {

            status(
                "Type something to search."
            );

            return;
        }

        searchGoogle(raw);

        return;
    }

    if (currentMode === "youtube") {

        const raw =
            $("search")?.value.trim() || "";

        if (!raw) {

            status(
                "Type something to search, or paste a YouTube link."
            );

            return;
        }

        const id =
            extractYouTubeID(raw);

        if (id) {
            playYouTubeVideo(id);
        }
        else {
            searchYouTube(raw);
        }

        return;
    }

    searchSpotify();
}


/* Turns an ISO 8601 duration (e.g. "PT1M30S") into whole seconds. */
function parseISO8601DurationToSeconds(duration) {

    const match =
        /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(
            duration || ""
        );

    if (!match) {
        return 0;
    }

    const hours =
        parseInt(match[1] || "0", 10);

    const minutes =
        parseInt(match[2] || "0", 10);

    const seconds =
        parseInt(match[3] || "0", 10);

    return (hours * 3600) + (minutes * 60) + seconds;
}


async function searchYouTube(query) {

    const tab =
        currentYoutubeTab;

    status(
        "Searching YouTube..."
    );

    $("heading").textContent =
        'YouTube search' +
        (tab === "short" ? " (Shorts)" : "") +
        ': "' + query + '"';

    try {

        const searchResponse =
            await fetch(
                "https://www.googleapis.com/youtube/v3/search?" +
                new URLSearchParams({

                    part:
                        "snippet",

                    q:
                        query,

                    type:
                        "video",

                    maxResults:
                        "25",

                    key:
                        YOUTUBE_API_KEY

                })
            );

        const searchData =
            await searchResponse.json();

        if (!searchResponse.ok) {

            throw new Error(
                searchData.error?.message ||
                "YouTube API error: " +
                searchResponse.status
            );
        }

        const items =
            (searchData.items || [])
                .filter(item => item?.id?.videoId);

        if (!items.length) {

            $("results").innerHTML =
                "<div class='status'>No results found.</div>";

            status(
                "No results found."
            );

            return;
        }

        const ids =
            items.map(item => item.id.videoId);

        const detailsResponse =
            await fetch(
                "https://www.googleapis.com/youtube/v3/videos?" +
                new URLSearchParams({

                    part:
                        "contentDetails,snippet",

                    id:
                        ids.join(","),

                    key:
                        YOUTUBE_API_KEY

                })
            );

        const detailsData =
            await detailsResponse.json();

        if (!detailsResponse.ok) {

            throw new Error(
                detailsData.error?.message ||
                "YouTube API error: " +
                detailsResponse.status
            );
        }

        const videos =
            (detailsData.items || [])
                .map(item => ({

                    id:
                        item.id,

                    title:
                        item.snippet?.title ||
                        "Untitled video",

                    channel:
                        item.snippet?.channelTitle ||
                        "",

                    thumb:
                        item.snippet?.thumbnails?.medium?.url ||
                        item.snippet?.thumbnails?.default?.url ||
                        "",

                    seconds:
                        parseISO8601DurationToSeconds(
                            item.contentDetails?.duration
                        )

                }));

        const filtered =
            videos.filter(video =>
                tab === "short"
                    ? video.seconds > 0 && video.seconds <= 60
                    : video.seconds > 60
            );

        if (!filtered.length) {

            $("results").innerHTML =
                "<div class='status'>No " +
                (tab === "short" ? "Shorts" : "long-form videos") +
                " found for that search. Try the other tab or a different search term.</div>";

            status(
                "No results found in this tab."
            );

            return;
        }

        if (tab === "short") {
            renderYouTubeShorts(filtered);
        }
        else {
            renderYouTubeSearch(filtered);
        }

        status(
            "YouTube search results"
        );

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}


function renderYouTubeSearch(videos) {

    let output =
        '<div class="grid">';

    for (
        const video
        of videos
    ) {

        output += `

            <div
                class="card"
                onclick="playYouTubeVideo('${escapeHTML(video.id)}')"
            >

                ${
                    video.thumb

                    ?

                    `<img
                        src="${escapeHTML(video.thumb)}"
                        alt=""
                    >`

                    :

                    `<div
                        style="
                            aspect-ratio:1;
                            background:#282828;
                            border-radius:6px;
                        "
                    ></div>`
                }

                <div class="card-title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="card-subtitle">
                    ${escapeHTML(video.channel)}
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


function renderYouTubeShorts(videos) {

    let output =
        '<div class="shorts-feed">';

    for (
        const video
        of videos
    ) {

        output += `

            <div
                class="shorts-item"
                onclick="playYouTubeVideo('${escapeHTML(video.id)}')"
            >

                ${
                    video.thumb

                    ?

                    `<img
                        src="${escapeHTML(video.thumb)}"
                        alt=""
                    >`

                    :

                    ""
                }

                <div class="shorts-caption">
                    <div class="card-title">
                        ${escapeHTML(video.title)}
                    </div>
                    <div class="card-subtitle">
                        ${escapeHTML(video.channel)}
                    </div>
                </div>

            </div>

        `;

    }

    output +=
        "</div>";

    $("results").innerHTML =
        output;
}


function playYouTubeVideo(id) {

    if (!id) {

        status(
            "Could not read a video from that link or ID. Try again.",
            true
        );

        return;
    }

    const isShort =
        currentYoutubeTab === "short";

    $("heading").textContent =
        "YouTube Clone";

    $("results").innerHTML = `

        <div
            style="
                position:relative;
                width:100%;
                max-width:${isShort ? "360px" : "900px"};
                aspect-ratio:${isShort ? "9/16" : "16/9"};
                background:#000;
                border-radius:8px;
                overflow:hidden;
                margin:0 auto;
            "
        >

            <iframe
                src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1"
                style="
                    position:absolute;
                    top:0;
                    left:0;
                    width:100%;
                    height:100%;
                    border:0;
                "
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                title="YouTube video player"
            ></iframe>

        </div>

    `;

    status(
        "Playing YouTube video."
    );
}


/* Open Spotify */

function openSpotify() {

    if (currentSpotifyURL) {

        window.open(
            currentSpotifyURL,
            "_blank"
        );

    }
}


/* Enter key */

$("search").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            handleSearchButton();

        }

    }
);


/* Start */

async function startApp() {
    try {

        const callback =
            await handleCallback();

        updateLoggedInNavigation();

        if (accessToken) {

            $("loginButton").textContent =
                "Log out";

            $("loginButton").onclick =
                function() {

                    if (player) {

                        player.disconnect();

                    }

                    localStorage.removeItem(
                        "spotify_access_token"
                    );

                    localStorage.removeItem(
                        "spotify_refresh_token"
                    );

                    localStorage.removeItem(
                        "spotify_code_verifier"
                    );

                    localStorage.removeItem(
                        "spotify_state"
                    );

                    accessToken =
                        "";

                    updateLoggedInNavigation();
                    location.reload();

                };

            status(
                callback
                    ? "Spotify connected!"
                    : "Ready. Search Spotify above."
            );

            if (
                window.Spotify &&
                !player
            ) {

                window.onSpotifyWebPlaybackSDKReady();

            }

        }

    }
    catch (error) {

        status(
            error.message,
            true
        );

    }
}



/* Always-on init (no gate in this file) */
document.title = "Spotify by Kane";
startApp();
